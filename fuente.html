/* rev13: modo demo del panel (para probar sin Supabase) */
const demoPerfiles=[
  {id:"demo",email:"demo@obra.com",nombre:"Admin demo",rol:"admin",activo:true,locales_edicion:""},
  {id:"u2",email:"mariapaz@obra.com",nombre:"Maria Paz",rol:"editor",activo:true,locales_edicion:"*"},
  {id:"u3",email:"paz@obra.com",nombre:"Paz",rol:"editor",activo:true,locales_edicion:"*"},
  {id:"u4",email:"lector@obra.com",nombre:"Lector demo",rol:"lector",activo:false,locales_edicion:""}];
const ORD_ROL={admin:0,editor:1,lector:2};
function UsuariosPanel({onClose,user}){
  const [rows,setRows]=useState(null);
  const [msg,setMsg]=useState("");
  const [nuevo,setNuevo]=useState({email:"",nombre:"",rol:"lector",activo:true,locales:""});
  const [quitar,setQuitar]=useState(null);   // fila a confirmar "quitar de la app"
  const yo=((user&&user.email)||"").toLowerCase();
  // rev13: al recargar NO se pisan las filas con cambios sin guardar (antes se perdían)
  async function cargar(){
    let lista, error=null;
    if(!ONLINE){ lista=JSON.parse(JSON.stringify(demoPerfiles)); }
    else { const r=await getSB().from("av_perfiles").select("*").order("email"); lista=r.data; error=r.error; }
    if(error){ setMsg("Error al cargar: "+error.message); setRows(rs=>rs||[]); return; }
    setRows(rs=>{ const sucias={}; (rs||[]).forEach(r=>{ if(r._dirty) sucias[r.id]=r; });
      return (lista||[]).map(r=>sucias[r.id]||r)
        .sort((a,b)=>((a.activo?0:1)-(b.activo?0:1))||(ORD_ROL[a.rol]-ORD_ROL[b.rol])||String(a.email).localeCompare(String(b.email))); });
  }
  useEffect(()=>{ cargar(); },[]);
  async function rpc(fn,args){
    if(!ONLINE){
      if(fn==="av_quitar_perfil"){ const i=demoPerfiles.findIndex(p=>p.email===args.p_email); if(i>=0) demoPerfiles.splice(i,1); }
      if(fn==="av_upsert_perfil"){ const p=demoPerfiles.find(x=>x.email===args.p_email);
        const v={email:args.p_email,nombre:args.p_nombre,rol:args.p_rol,activo:args.p_activo,locales_edicion:args.p_rol==="editor"?args.p_locales:""};
        if(p) Object.assign(p,v); else demoPerfiles.push({id:"n"+Date.now(),...v}); }
      return {data:{ok:true},error:null};
    }
    return await getSB().rpc(fn,args);
  }
  async function guardarRow(p){
    setRows(rs=>rs.map(r=>r.id===p.id?{...r,_estado:"guardando"}:r));
    const {data,error}=await rpc("av_upsert_perfil",{p_email:p.email,p_nombre:p.nombre||"",
      p_rol:p.rol,p_activo:!!p.activo,p_locales:p.rol==="editor"?(p.locales_edicion||""):""});
    const err = error ? error.message : (data&&data.ok===false ? (data.error||"No se pudo guardar") : null);
    setRows(rs=>rs.map(r=>r.id===p.id?{...r,_dirty:!!err,_estado:err?("Error: "+err):"ok"}:r));
    return !err;
  }
  async function guardarTodos(){
    const sucias=(rows||[]).filter(r=>r._dirty); let ok=0;
    for(const r of sucias){ if(await guardarRow(r)) ok++; }
    setMsg(ok===sucias.length ? "✓ Guardados "+ok+" usuario(s)" : "Se guardaron "+ok+" de "+sucias.length+". Revisá las filas en rojo.");
  }
  function upd(id,campo,val){ setRows(rs=>rs.map(r=>{ if(r.id!==id) return r;
    const n={...r,[campo]:val,_dirty:true,_estado:""};
    if(campo==="rol" && val!=="editor") n.locales_edicion="";        // solo los editores tienen lista de locales
    if(campo==="rol" && val==="editor" && !n.locales_edicion) n.locales_edicion="*";
    return n; })); }
  async function agregar(){
    const email=nuevo.email.trim().toLowerCase();
    if(!email){ setMsg("Poné un email."); return; }
    setMsg("Asignando "+email+"…");
    const {data,error}=await rpc("av_upsert_perfil",{p_email:email,p_nombre:nuevo.nombre||"",
      p_rol:nuevo.rol,p_activo:true,p_locales:nuevo.rol==="editor"?(nuevo.locales||"*"):""});
    const err = error ? error.message : (data&&data.ok===false ? (data.error||"No se pudo asignar") : null);
    if(err){ setMsg("Error: "+err); return; }
    setMsg("✓ Asignado "+email); setNuevo({email:"",nombre:"",rol:"lector",activo:true,locales:""}); await cargar();
  }
  async function doQuitar(r){
    const {data,error}=await rpc("av_quitar_perfil",{p_email:r.email});
    setQuitar(null);
    if(error){ setMsg("Error: "+error.message); return; }
    setRows(rs=>rs.filter(x=>x.id!==r.id)); setMsg("✓ "+r.email+" ya no tiene acceso a esta app (su login sigue funcionando en las otras apps).");
  }
  const nSucias=(rows||[]).filter(r=>r._dirty).length;
  function tryClose(){ if(nSucias && !confirm("Hay "+nSucias+" usuario(s) con cambios SIN GUARDAR. ¿Cerrar igual y perderlos?")) return; onClose(); }
  return (
    <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)tryClose()}}>
      <div className="modal" style={{maxWidth:900}}>
        {quitar && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setQuitar(null)}}>
            <div className="modal" style={{maxWidth:440,width:"92%"}}>
              <div className="mhead"><div><h2>Quitar de la app</h2>
                <div style={{fontSize:12,opacity:.85}}><b>{quitar.email}</b> deja de ver Avance de Obra.
                  Su login <b>NO</b> se borra: sigue entrando normal a las otras apps que comparten usuarios.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn danger" onClick={()=>doQuitar(quitar)}>Sí, quitar de esta app</button>
                <button className="btn" onClick={()=>setQuitar(null)}>Cancelar</button>
              </div>
            </div>
          </div>
        )}
        <div className="mhead"><div><h2 style={{fontSize:18}}>Usuarios y permisos</h2>
          <div style={{fontSize:12,opacity:.85}}>El login es compartido con otras apps: acá solo se asigna o quita el acceso a esta obra.</div></div>
          <button className="x" onClick={tryClose}>×</button></div>
        <div className="mbody">
          {(msg||nSucias>0) && <div className={"umsg"+(msg.startsWith("✓")?" ok":(msg.startsWith("Error")||msg.startsWith("Se guardaron")?" bad":""))}>
            <span>{msg||("Hay "+nSucias+" usuario(s) con cambios sin guardar.")}</span>
            {nSucias>0 && <button className="btn sm primary" onClick={guardarTodos}>💾 Guardar todos los cambios ({nSucias})</button>}
          </div>}
          <div className="addparte" style={{alignItems:"flex-end"}}>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",width:"100%"}}>
              <input className="pwinp" style={{flex:"2 1 180px",margin:0}} placeholder="email@…" value={nuevo.email}
                onChange={e=>setNuevo(n=>({...n,email:e.target.value}))}/>
              <input className="pwinp" style={{flex:"1 1 120px",margin:0}} placeholder="nombre" value={nuevo.nombre}
                onChange={e=>setNuevo(n=>({...n,nombre:e.target.value}))}/>
              <select className="pwinp" style={{flex:"0 0 110px",margin:0}} value={nuevo.rol}
                onChange={e=>setNuevo(n=>({...n,rol:e.target.value}))}>
                <option value="lector">lector</option><option value="editor">editor</option><option value="admin">admin</option>
              </select>
              <input className="pwinp" style={{flex:"1 1 130px",margin:0}} placeholder="locales (* o lista)" value={nuevo.locales}
                onChange={e=>setNuevo(n=>({...n,locales:e.target.value}))}/>
              <button className="btn sm primary" onClick={agregar}>+ Asignar</button>
            </div>
          </div>
          {rows===null ? <div className="loading">Cargando…</div> : (
            <div style={{overflowX:"auto"}}>
            <table className="utab">
              <thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Locales que edita</th><th></th></tr></thead>
              <tbody>
                {rows.map(r=>{ const esYo=String(r.email||"").toLowerCase()===yo;
                  const err=String(r._estado||"").startsWith("Error");
                  return (
                  <tr key={r.id} className={(r._dirty?"udirty":"")+(err?" uerr":"")+(r.activo?"":" uinact")}>
                    <td className="uemail">{r.email}{esYo&&<span className="uyo"> (vos)</span>}
                      {err && <div className="uerrtxt">{r._estado.slice(7)}</div>}</td>
                    <td><input className="ucell" value={r.nombre||""} onChange={e=>upd(r.id,"nombre",e.target.value)}/></td>
                    <td><select className="ucell" value={r.rol} disabled={esYo} title={esYo?"No te podés cambiar el rol a vos mismo":""}
                      onChange={e=>upd(r.id,"rol",e.target.value)}>
                      <option value="lector">lector</option><option value="editor">editor</option><option value="admin">admin</option></select></td>
                    <td style={{textAlign:"center"}}><input type="checkbox" checked={!!r.activo} disabled={esYo} onChange={e=>upd(r.id,"activo",e.target.checked)}/></td>
                    <td>{r.rol==="editor"
                      ? <input className="ucell" placeholder="* o A-PB-101,…" value={r.locales_edicion||""} onChange={e=>upd(r.id,"locales_edicion",e.target.value)}/>
                      : <span className="umuted">{r.rol==="admin"?"todos (admin)":"— (solo consulta)"}</span>}</td>
                    <td style={{whiteSpace:"nowrap"}}>
                      <button className={"btn sm"+(r._dirty?" primary":"")} disabled={!r._dirty||r._estado==="guardando"} onClick={()=>guardarRow(r)}>
                        {r._estado==="guardando"?"Guardando…":(r._estado==="ok"&&!r._dirty?"✓ Guardado":"Guardar")}</button>
                      {!esYo && <button className="btn sm danger" style={{marginLeft:6}} title="Quitar de esta app (no borra su login)" onClick={()=>setQuitar(r)}>🗑</button>}
                    </td>
                  </tr>);})}
                {rows.length===0 && <tr><td colSpan="6" style={{color:"#64748b",padding:14}}>Todavía no hay perfiles de obra. Asigná el primero arriba.</td></tr>}
              </tbody>
            </table>
            </div>
          )}
          <div style={{marginTop:10,fontSize:11.5,color:"#64748b"}}>
            <b>Rol:</b> admin (edita todo + gestiona usuarios) · editor (edita los locales de la lista) · lector (solo consulta y comenta).
            En <b>Locales que edita</b>: <code>*</code> = todos, o IDs separados por coma (ej. <code>A-PB-101,A-PB-104</code>). Solo aplica a editores.<br/>
            Las filas en amarillo tienen cambios sin guardar. Los cambios le llegan a la persona cuando recarga la app.
            🗑 quita el acceso a esta app; el login sigue sirviendo para las otras apps.
          </div>
        </div>
      </div>
    </div>
  );
}
/* ================== Configuración matriz (solo admin) ================== */
const TIPOS_MATRIZ=[["TABIQUE","Tabiques"],["SOLADO","Solados"],["CIELORRASO","Cielorrasos"]];
function etapaFija(tipo,nombre){ const n=normNom(nombre);   // rev23
  return n===normNom(PP_NOMBRE) || (tipo==="SOLADO" && (n.startsWith("verificacion")||n.startsWith("terminacion"))); }
function MatrizPanel({data,onClose,onApplied}){
  const [tipo,setTipo]=useState("TABIQUE");
  // rev5: la matriz solo edita las etapas que NO son per-local (Revestimiento/Terminaciones)
  const base=()=> ((data.plantillas&&data.plantillas[tipo]) || data.plantilla || []).filter(f=>PERLOCAL_NOMBRES.indexOf(f.nombre)<0);
  // rev23: cada etapa/tarea/subtarea recuerda su nombre original (_o) → renombrar no pierde el avance cargado
  const conOrig=pl0=>{ const p=JSON.parse(JSON.stringify(pl0));
    p.forEach(f=>{ f._o=f.nombre; (f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ t._o=t.nombre;
      (t.subs||[]).forEach(x=>{ x._o=(x.g||"")+"\u0000"+x.n; }); })); }); return p; };
  const sinOrig=pl0=>{ const p=JSON.parse(JSON.stringify(pl0));
    p.forEach(f=>{ delete f._o; (f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ delete t._o;
      (t.subs||[]).forEach(x=>{ delete x._o; }); })); }); return p; };
  const [pl,setPl]=useState(()=>conOrig(base()));
  const [dirty,setDirty]=useState(false);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  const [openF,setOpenF]=useState({});
  const [naCompleto,setNaCompleto]=useState(true);   // v2: ítems nuevos en rubros ya completos → No aplica
  const [ask,setAsk]=useState(false);       // confirmar "aplicar a toda la obra"
  const [askExit,setAskExit]=useState(false); // confirmar "salir sin guardar"
  const [pendingTipo,setPendingTipo]=useState(null); // cambio de tipo con cambios sin aplicar
  const dragRef=useRef(null);
  useEffect(()=>{ setPl(conOrig(base())); setDirty(false); setMsg(""); setOpenF({}); },[tipo]);
  function mut(fn){ setPl(p=>{const np=JSON.parse(JSON.stringify(p)); fn(np); return np;}); setDirty(true); }
  const afectados = data.locales.reduce((n,l)=>n+l.partes.filter(p=>p.tipo===tipo).length,0);

  function tryClose(){ if(dirty&&!saving) setAskExit(true); else onClose(); }
  function cambiarTipo(k){ if(k===tipo) return; if(dirty&&!saving){ setPendingTipo(k); } else { setTipo(k); } }
  function cancelarCambios(){ setPl(conOrig(base())); setDirty(false); setMsg("Cambios descartados"); }
  // reordenar arrastrando (dentro de la misma lista)
  function moveItem(arr,from,to){ if(from===to||from<0||to<0||from>=arr.length||to>=arr.length) return; const [x]=arr.splice(from,1); arr.splice(to,0,x); }
  function startDrag(desc){ dragRef.current=desc; }
  function dropOn(desc){ const d=dragRef.current; dragRef.current=null; if(!d||d.lvl!==desc.lvl) return;
    if(d.lvl==='f'){ mut(p=>moveItem(p,d.idx,desc.idx)); }
    else if(d.lvl==='t'){ if(d.fi!==desc.fi||d.gi!==desc.gi) return; mut(p=>moveItem(p[desc.fi].grupos[desc.gi].tareas,d.idx,desc.idx)); }
    else if(d.lvl==='s'){ if(d.fi!==desc.fi||d.gi!==desc.gi||d.ti!==desc.ti) return; mut(p=>moveItem(p[desc.fi].grupos[desc.gi].tareas[desc.ti].subs,d.idx,desc.idx)); }
  }
  async function aplicar(){
    setSaving(true); setMsg("");
    const partes=[], b=base(), cuentaNA={n:0};
    data.locales.forEach(l=>l.partes.forEach(p=>{ if(p.tipo===tipo){
      const old=p.fases||buildFases(b,p.parte_id);
      const tmp={tipo:p.tipo, parte_id:p.parte_id, fases:mergeFasesByName(pl,p.parte_id,old,{naSiCompleto:MATRIZ_V2&&naCompleto,cuenta:cuentaNA})};
      normalizeParte(tmp);
      partes.push({parte_id:p.parte_id, fases:tmp.fases});
    }}));
    // Se aplica POR LOTES para no superar el límite de tiempo de Supabase.
    // La plantilla se manda solo en el primer lote.
    const CH=100, total=partes.length;
    const lotes=[]; for(let i=0;i<total;i+=CH) lotes.push(partes.slice(i,i+CH));
    if(lotes.length===0) lotes.push([]);   // al menos un lote: guarda la plantilla aunque no haya elementos
    for(let i=0;i<lotes.length;i++){
      setMsg(total? ("Aplicando… "+Math.min((i+1)*CH,total)+"/"+total) : "Guardando plantilla…");
      const res=await apiPost({action:'matriz', tipo, plantilla:i===0?sinOrig(pl):null, partes:lotes[i]});
      if(!res.ok){ setSaving(false);
        setMsg("Error: "+(res.error||"desconocido")+(i>0?(" — se aplicó parcial ("+(i*CH)+"/"+total+"). Tocá “Aplicar” otra vez para completar."):""));
        setAsk(false); return; }
    }
    setSaving(false); setMsg("Aplicado ✓ a "+total+" elemento(s)"+(cuentaNA.n?" · "+cuentaNA.n+" ítem(s) nuevo(s) en rubros que ya estaban al 100% quedaron en No aplica":"")); setDirty(false);
    const plLimpia=sinOrig(pl);
    onApplied(tipo,plLimpia,partes); setAsk(false);
    setPl(conOrig(plLimpia));   // rev23: lo aplicado pasa a ser el nuevo punto de partida
  }
  // mutadores por índice
  const addEtapa=()=>mut(p=>p.push({id:nid("f_"),nombre:"Nueva etapa",hito:"Hito",grupos:[{nombre:null,tareas:[]}]}));
  const delEtapa=(fi)=>mut(p=>p.splice(fi,1));
  const addGrupo=(fi)=>mut(p=>p[fi].grupos.push({nombre:"",tareas:[]}));
  const delGrupo=(fi,gi)=>mut(p=>p[fi].grupos.splice(gi,1));
  const addTarea=(fi,gi)=>mut(p=>p[fi].grupos[gi].tareas.push({nombre:"Nueva tarea",subs:[]}));
  const delTarea=(fi,gi,ti)=>mut(p=>p[fi].grupos[gi].tareas.splice(ti,1));
  const addSub=(fi,gi,ti)=>mut(p=>{const t=p[fi].grupos[gi].tareas[ti]; t.subs=t.subs||[]; t.subs.push({n:"Nueva subtarea",g:null});});
  const delSub=(fi,gi,ti,si)=>mut(p=>p[fi].grupos[gi].tareas[ti].subs.splice(si,1));

  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")tryClose()}}>
      <div className="modal" style={{maxWidth:900}}>
        {ask && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setAsk(false)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>Aplicar cambios de la matriz</h2>
                <div style={{fontSize:12,opacity:.85}}>Se va a reescribir la estructura de <b>{afectados}</b> elemento(s) de tipo <b>{tipo}</b> en toda la obra. El avance ya cargado se conserva, también en lo que renombraste.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                {MATRIZ_V2 && <label style={{display:"flex",gap:8,alignItems:"flex-start",fontSize:13,lineHeight:1.35}}>
                  <input type="checkbox" checked={naCompleto} onChange={e=>setNaCompleto(e.target.checked)} style={{marginTop:2}}/>
                  <span>Si un rubro ya estaba al <b>100%</b> en un elemento, sus ítems nuevos quedan en <b>No aplica</b> (así no le baja el avance). En el resto entran en Sin realizar.</span></label>}
                <button className="btn primary" disabled={saving} onClick={aplicar}>{saving?"Aplicando…":"Sí, aplicar a toda la obra"}</button>
                <button className="btn" disabled={saving} onClick={()=>setAsk(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        )}
        {askExit && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setAskExit(false)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>¿Salir sin guardar?</h2>
                <div style={{fontSize:12,opacity:.85}}>Tenés cambios en la matriz que todavía no aplicaste. Si salís, se descartan.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn danger" onClick={()=>{setAskExit(false);onClose();}}>Salir sin guardar</button>
                <button className="btn" onClick={()=>setAskExit(false)}>Seguir editando</button>
              </div>
            </div>
          </div>
        )}
        {pendingTipo && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setPendingTipo(null)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>Cambiar de tipo</h2>
                <div style={{fontSize:12,opacity:.85}}>Tenés cambios sin aplicar en <b>{tipo}</b>. Si cambiás de tipo ahora, se descartan.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn danger" onClick={()=>{const k=pendingTipo;setPendingTipo(null);setTipo(k);}}>Descartar y cambiar</button>
                <button className="btn" onClick={()=>setPendingTipo(null)}>Seguir editando</button>
              </div>
            </div>
          </div>
        )}
        <div className="mhead">
          <div><h2 style={{fontSize:18}}>🧩 Configuración matriz</h2>
            <div style={{fontSize:12,opacity:.85}}>Definí la estructura de etapas, tareas y subtareas. Al aplicar, se replica a <b>todos</b> los elementos de ese tipo.</div></div>
          <button className="x" onClick={tryClose}>×</button>
        </div>
        <div className="mbody">
          <div className="addparte" style={{gap:10,flexWrap:"wrap"}}>
            <b>Tipo:</b>
            {TIPOS_MATRIZ.map(([k,n])=>
              <button key={k} className={"btn sm"+(tipo===k?" primary":"")} onClick={()=>cambiarTipo(k)}>{n}</button>)}
            <span className="hint" style={{marginLeft:"auto"}}>{afectados} elemento(s) de este tipo en la obra</span>
          </div>
          <div className="fases" style={{marginTop:10}}>
            {pl.map((f,fi)=>{
              const fopen=!!openF[f.id||fi];
              return (
              <div className="fase" key={f.id||fi}
                   onDragOver={e=>e.preventDefault()} onDrop={()=>dropOn({lvl:'f',idx:fi})}>
                <div className="fase-h" style={{gap:8}}>
                  <span className="draghandle" draggable onDragStart={()=>startDrag({lvl:'f',idx:fi})} title="Arrastrar para reordenar la etapa">⠿</span>
                  <span className="twist" onClick={()=>setOpenF(o=>({...o,[f.id||fi]:!fopen}))} style={{cursor:"pointer"}}>{fopen?"▾":"▸"}</span>
                  {/* rev23: estos nombres los usa la app para los colores y "¿Permite continuar?" → no se renombran */}
                  <input value={f.nombre||""} onChange={e=>mut(p=>p[fi].nombre=e.target.value)}
                    readOnly={etapaFija(tipo,f._o||f.nombre)} title={etapaFija(tipo,f._o||f.nombre)?"Este nombre lo usa la app para los colores; no se puede cambiar":""}
                    style={{flex:"1 1 160px",fontWeight:700,border:"1px solid var(--line)",borderRadius:6,padding:"4px 8px",background:etapaFija(tipo,f._o||f.nombre)?"#f1f5f9":undefined}} placeholder="Nombre de etapa"/>
                  <button className="rmtask" title="Quitar etapa" onClick={()=>delEtapa(fi)}>✕</button>
                </div>
                {fopen && <div style={{padding:"4px 8px 10px 22px"}}>
                  {(f.grupos||[]).map((g,gi)=>(
                    <div className="grupo" key={gi} style={{borderLeft:"2px solid var(--line)",paddingLeft:8,marginBottom:8}}>
                      <div style={{display:"flex",alignItems:"center",gap:6,margin:"4px 0"}}>
                        <input value={g.nombre||""} onChange={e=>mut(p=>p[fi].grupos[gi].nombre=e.target.value||null)}
                          placeholder="Grupo (opcional)"
                          style={{flex:"1 1 140px",fontSize:12,fontWeight:600,border:"1px dashed var(--line)",borderRadius:6,padding:"3px 7px"}}/>
                        {(f.grupos.length>1) && <button className="rmtask" title="Quitar grupo" onClick={()=>delGrupo(fi,gi)}>✕</button>}
                      </div>
                      {(g.tareas||[]).map((t,ti)=>(
                        <div className="tarea" key={ti} style={{marginLeft:6}}
                             onDragOver={e=>e.preventDefault()} onDrop={e=>{e.stopPropagation();dropOn({lvl:'t',fi,gi,idx:ti});}}>
                          <div className="tarea-row" style={{gap:6}}>
                            <span className="draghandle" draggable onDragStart={e=>{e.stopPropagation();startDrag({lvl:'t',fi,gi,idx:ti});}} title="Arrastrar para reordenar la tarea">⠿</span>
                            <input value={t.nombre||""} onChange={e=>mut(p=>p[fi].grupos[gi].tareas[ti].nombre=e.target.value)}
                              placeholder="Nombre de tarea"
                              style={{flex:"1 1 160px",border:"1px solid var(--line)",borderRadius:6,padding:"3px 7px"}}/>
                            <span className="subc">{(t.subs&&t.subs.length)?t.subs.length+" sub":""}</span>
                            <button className="rmtask" title="Quitar tarea" onClick={()=>delTarea(fi,gi,ti)}>✕</button>
                          </div>
                          <div className="subtareas">
                            {(t.subs||[]).map((s,si)=>(
                              <div className="sub" key={si} style={{gap:6}}
                                   onDragOver={e=>e.preventDefault()} onDrop={e=>{e.stopPropagation();dropOn({lvl:'s',fi,gi,ti,idx:si});}}>
                                <span className="draghandle" draggable onDragStart={e=>{e.stopPropagation();startDrag({lvl:'s',fi,gi,ti,idx:si});}} title="Arrastrar para reordenar la subtarea">⠿</span>
                                <input value={s.g||""} onChange={e=>mut(p=>p[fi].grupos[gi].tareas[ti].subs[si].g=e.target.value||null)}
                                  placeholder="(subgrupo)"
                                  style={{flex:"0 1 110px",fontSize:12,border:"1px dashed var(--line)",borderRadius:6,padding:"2px 6px"}}/>
                                <input value={s.n||""} onChange={e=>mut(p=>p[fi].grupos[gi].tareas[ti].subs[si].n=e.target.value)}
                                  placeholder="Nombre de subtarea"
                                  style={{flex:"1 1 150px",fontSize:12,border:"1px solid var(--line)",borderRadius:6,padding:"2px 6px"}}/>
                                <button className="rmtask" title="Quitar subtarea" onClick={()=>delSub(fi,gi,ti,si)}>✕</button>
                              </div>
                            ))}
                            <div className="addtarea sub">
                              <button className="btn sm" onClick={()=>addSub(fi,gi,ti)}>+ Subtarea</button>
                            </div>
                          </div>
                        </div>
                      ))}
                      <div className="addtarea"><button className="btn sm" onClick={()=>addTarea(fi,gi)}>+ Tarea</button></div>
                    </div>
                  ))}
                  <button className="btn sm" onClick={()=>addGrupo(fi)}>+ Grupo</button>
                </div>}
              </div>);
            })}
            <div className="addtarea addfase"><button className="btn sm primary" onClick={addEtapa}>+ Etapa</button></div>
          </div>
        </div>
        <div className="savebar">
          <span style={{color:msg.startsWith("Error")?"#b91c1c":"#166534",fontWeight:600}}>{msg}</span>
          <div className="spacer"></div>
          <button className="btn" onClick={tryClose}>Cerrar</button>
          <button className="btn danger" disabled={!dirty||saving} onClick={cancelarCambios}>Cancelar cambios</button>
          <button className="btn primary" disabled={!dirty||saving} onClick={()=>setAsk(true)}>
            {saving?"Aplicando…":"Aplicar a toda la obra"}</button>
        </div>
      </div>
    </div>
  );
}
/* ================== Códigos QR por local (admin) ================== */
function qrDataURL(texto){
  try{ const qr=window.qrcode(0,'M'); qr.addData(texto); qr.make(); return qr.createDataURL(6,2); }
  catch(e){ return null; }
}
function QRPanel({data,modulo,nivel,onClose}){
  const [scope,setScope]=useState("sector");   // "sector" | "todos" | "uno" (rev20)
  const [uno,setUno]=useState("");             // rev20: local_id elegido para imprimir un solo QR
  const baseURL = (window.location.origin+window.location.pathname).replace(/[?#].*$/,"");
  const todosOrd=[...data.locales].sort((a,b)=> ordArea(a,b) || (a.numero||"").localeCompare(b.numero||"",'es',{numeric:true}));
  const locs = scope==="sector" ? data.locales.filter(l=>l.modulo===modulo&&l.nivel===nivel)
    : scope==="uno" ? todosOrd.filter(l=>l.local_id===uno)
    : todosOrd;
  const hayLib = !!window.qrcode;
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")onClose()}}>
      <div className="modal" style={{maxWidth:900}}>
        <div className="mhead qr-noprint">
          <div><h2 style={{fontSize:18}}>🔳 Códigos QR de locales</h2>
            <div style={{fontSize:12,opacity:.85}}>Imprimí y pegá el QR en cada local. Al escanearlo, se abre ese local directamente.</div></div>
          <button className="x" onClick={onClose}>×</button>
        </div>
        <div className="mbody">
          <div className="addparte qr-noprint" style={{gap:10,flexWrap:"wrap"}}>
            <b>Mostrar:</b>
            <button className={"btn sm"+(scope==="sector"?" primary":"")} onClick={()=>setScope("sector")}>Este sector ({mNom(modulo)} · {nNom(nivel)})</button>
            <button className={"btn sm"+(scope==="todos"?" primary":"")} onClick={()=>setScope("todos")}>Toda la obra</button>
            <button className={"btn sm"+(scope==="uno"?" primary":"")} onClick={()=>setScope("uno")}>Un local</button>
            {scope==="uno" && <select className="fsel" value={uno} onChange={e=>setUno(e.target.value)}>
              <option value="">— elegir local —</option>
              {todosOrd.map(l=><option key={l.local_id} value={l.local_id}>{mLbl(l.modulo)} · {nNom(l.nivel)} · {l.numero} {l.nombre}</option>)}
            </select>}
            <button className="btn sm" style={{marginLeft:"auto"}} disabled={!locs.length} onClick={()=>window.print()}>🖨 Imprimir</button>
          </div>
          {!hayLib && <div className="noplano" style={{margin:"10px 0"}}><p>No se pudo cargar el generador de QR (revisá la conexión). Volvé a abrir este panel.</p></div>}
          {hayLib && (locs.length? (
            <div className="qrsheet">
              {locs.map(l=>{ const url=baseURL+"?local="+encodeURIComponent(l.local_id); const img=qrDataURL(url);
                return (
                <div className="qrcard" key={l.local_id}>
                  {img? <img src={img} alt={l.local_id} className="qrimg"/> : <div className="qrimg"/>}

/* ================== Filtros por tarea/subtarea (vista transversal) ================== */
function FiltrosPanel({data,user,modulo:m0,nivel:n0,onClose,onAbrirLocal,onGuardado}){
  const [guardando,setGuardando]=useState(false); // rev21: guardando los cambios pendientes
  const [pend,setPend]=useState({});              // rev21: parte_id -> estado nuevo (sin guardar todavía)
  const [masivo,setMasivo]=useState("");          // rev20: estado elegido para "cambiar todos"
  const [fmsg,setFmsg]=useState("");
  const nPend=Object.keys(pend).length;
  // rev21: antes de cambiar el filtro, cerrar o abrir un local, avisar si hay cambios sin guardar
  function sinPendientes(fn){
    if(nPend && !confirm("Hay "+nPend+" cambio(s) sin guardar en Filtros.\n¿Descartarlos y seguir?")) return;
    setPend({}); fn();
  }
  const [m,setM]=useState(m0);
  const [n,setN]=useState(n0);
  const [loc,setLoc]=useState("*");
  const [tarea,setTarea]=useState("");
  const [sub,setSub]=useState("");
  useEffect(()=>{ setLoc("*"); },[m,n]);
  useEffect(()=>{ setSub(""); },[tarea]);
  const locs=data.locales.filter(l=>l.modulo===m&&l.nivel===n);
  const scopeLocs = loc==="*" ? locs : locs.filter(l=>l.local_id===loc);
  // tareas y subtareas presentes en el alcance
  const tMap=new Map();
  scopeLocs.forEach(l=>l.partes.forEach(p=>(p.fases||[]).forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
    if(!tMap.has(t.nombre)) tMap.set(t.nombre,new Map());
    (t.subtareas||[]).forEach(s=>{ const k=(s.grupo||"")+"\u0000"+s.nombre; tMap.get(t.nombre).set(k,(s.grupo?s.grupo+" · ":"")+s.nombre); });
  })))));
  const tareas=[...tMap.keys()].sort((a,b)=>a.localeCompare(b,'es'));
  const subsDisp = tarea&&tMap.get(tarea) ? [...tMap.get(tarea).entries()] : [];
  function estadoDe(p){
    let found=null;
    (p.fases||[]).forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(t.nombre===tarea) found=t; })));
    if(!found) return null;
    if(sub){ const s=(found.subtareas||[]).find(x=>((x.grupo||"")+"\u0000"+x.nombre)===sub); return s?s.estado:null; }
    if(found.subtareas&&found.subtareas.length) return rollupEstado(found.subtareas);
    return found.estado;
  }
  const filas=[];
  if(tarea) scopeLocs.forEach(l=>l.partes.forEach(p=>{ const e=estadoDe(p); if(e!=null) filas.push({l,p,e}); }));
  const resumen={}; filas.forEach(f=>{resumen[f.e]=(resumen[f.e]||0)+1;});
  const ordTipo={SOLADO:0,TABIQUE:1,CIELORRASO:2};
  filas.sort((a,b)=> (a.l.numero||"").localeCompare(b.l.numero||"",'es',{numeric:true}) || (ordTipo[a.p.tipo]-ordTipo[b.p.tipo]) || ((a.p.indice||0)-(b.p.indice||0)));
  /* rev20/rev21: cambiar el estado de la tarea/subtarea filtrada desde acá. rev21: los cambios quedan
     PENDIENTES (fila en amarillo) hasta tocar "Guardar cambios"; se guardan local por local, igual que en
     la ficha, con auditoría. Si se elige la tarea entera y tiene subtareas, el estado se aplica a TODAS. */
  const editables=filas.filter(f=>puedeEditar(user,f.l.local_id));
  function aplicarEnParte(pt,nuevo){
    let found=null;
    (pt.fases||[]).forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(t.nombre===tarea) found=t; })));
    if(!found) return false;
    if(sub){ const s=(found.subtareas||[]).find(x=>((x.grupo||"")+"\u0000"+x.nombre)===sub); if(!s) return false; s.estado=nuevo; }
    else if(found.subtareas&&found.subtareas.length) found.subtareas.forEach(s=>s.estado=nuevo);
    else found.estado=nuevo;
    return true;
  }
  function marcar(f,nuevo){ setFmsg(""); setPend(x=>{ const y={...x}; if(nuevo===f.e) delete y[f.p.parte_id]; else y[f.p.parte_id]=nuevo; return y; }); }
  async function guardarPend(){
    const sel=filas.filter(f=>pend[f.p.parte_id]!=null);
    const porLocal={}; sel.forEach(f=>{ (porLocal[f.l.local_id]=porLocal[f.l.local_id]||[]).push(f.p.parte_id); });
    setGuardando(true); setFmsg("");
    let ok=0, err=[]; const guardados=[];
    for(const lid of Object.keys(porLocal)){
      const l=data.locales.find(x=>x.local_id===lid); if(!l) continue;
      const partes=[], cambios=[], nuevas={};
      porLocal[lid].forEach(pid=>{ const orig=l.partes.find(p=>p.parte_id===pid); if(!orig||!orig.fases) return;
        const pt=JSON.parse(JSON.stringify(orig)); if(!aplicarEnParte(pt,pend[pid])) return;
        const dc=diffFases(orig.fases,pt.fases,pid); if(!dc.length) return;   // ya estaba en ese estado: no se guarda
        dc.forEach(c=>cambios.push(c));
        partes.push({parte_id:pt.parte_id,tipo:pt.tipo,indice:pt.indice,etiqueta:pt.etiqueta,tipologia:pt.tipologia||"",
          plano_x:pt.plano_x,plano_y:pt.plano_y,comentarios:pt.comentarios||"",fases:pt.fases});
        nuevas[pid]=pt.fases; });
      if(!partes.length){ porLocal[lid].forEach(pid=>guardados.push(pid)); continue; }
      const res=await apiPost({action:"guardar",email:user.email,local_id:lid,partes,borrar:[],cambios});
      if(res.ok){ ok+=partes.length; onGuardado(lid,nuevas); porLocal[lid].forEach(pid=>guardados.push(pid)); }
      else err.push(l.numero+": "+errorGuardado(res.error));
    }
    // los que se guardaron salen de pendientes; los que fallaron quedan en amarillo para reintentar
    setPend(x=>{ const y={...x}; guardados.forEach(pid=>delete y[pid]); return y; });
    setGuardando(false);
    setFmsg(err.length ? "Error: "+err.join(" · ") : "✓ Guardado: "+ok+" elemento(s)");
  }
  function cambiarTodos(){
    if(!masivo||!editables.length) return;
    editables.forEach(f=>marcar(f,masivo)); setMasivo("");
  }
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")sinPendientes(onClose)}}>
      <div className="modal" style={{maxWidth:820}}>
        <div className="mhead">
          <div><h2 style={{fontSize:18}}>🔎 Filtros</h2>
            <div style={{fontSize:12,opacity:.85}}>Elegí módulo, piso, local y una tarea/subtarea para ver su estado en todos los elementos.</div></div>
          <button className="x" onClick={()=>sinPendientes(onClose)}>×</button>
        </div>
        <div className="mbody">
          <div className="fgrid">
            <div className="frow"><span className="lbl">Módulo</span>
              {MODS.map(x=><button key={x} className={"vchip"+(m===x?" on":"")} onClick={()=>x!==m&&sinPendientes(()=>setM(x))}>{mLbl(x)}</button>)}</div>
            <div className="frow"><span className="lbl">Piso</span>
              {[["PB","Planta Baja"],["PA","Planta Alta"],["EP","Entrepiso"]].map(([c,nm])=>
                <button key={c} className={"vchip"+(n===c?" on":"")} onClick={()=>c!==n&&sinPendientes(()=>setN(c))}>{nm}</button>)}</div>
            <div className="frow"><span className="lbl">Local</span>
              <select value={loc} onChange={e=>{const v=e.target.value; sinPendientes(()=>setLoc(v));}} className="fsel">
                <option value="*">Todos ({locs.length})</option>
                {locs.map(l=><option key={l.local_id} value={l.local_id}>{l.numero} · {l.nombre}</option>)}
              </select></div>
            <div className="frow"><span className="lbl">Rubro / Tarea</span>
              <select value={tarea} onChange={e=>{const v=e.target.value; sinPendientes(()=>setTarea(v));}} className="fsel">
                <option value="">— elegir —</option>
                {tareas.map(t=><option key={t} value={t}>{t}</option>)}
              </select></div>
            {tarea && subsDisp.length>0 && <div className="frow"><span className="lbl">Subtarea</span>
              <select value={sub} onChange={e=>{const v=e.target.value; sinPendientes(()=>setSub(v));}} className="fsel">
                <option value="">(toda la tarea)</option>
                {subsDisp.map(([k,label])=><option key={k} value={k}>{label}</option>)}
              </select></div>}
          </div>
          {!tarea && <div className="noplano" style={{marginTop:12}}><p>Elegí un rubro/tarea para ver resultados.</p></div>}
          {tarea && (
            <React.Fragment>
              <div className="fresumen">
                {Object.keys(resumen).sort().map(k=>
                  <span key={k} className="fchip-r" style={{background:COLOR[k]||"#94a3b8"}}>{k}: {resumen[k]}</span>)}
                <span style={{marginLeft:"auto",fontSize:12,color:"var(--muted)",fontWeight:700}}>{filas.length} elemento(s)</span>
              </div>
              {editables.length>0 && <div className="fmasivo">
                <span>Cambiar los <b>{editables.length}</b> mostrados a:</span>
                <select className="fsel" style={{minWidth:140}} value={masivo} onChange={e=>setMasivo(e.target.value)}>
                  <option value="">— estado —</option>
                  {ESTADOS.map(o=><option key={o} value={o}>{o}</option>)}
                </select>
                <button className="btn sm primary" disabled={!masivo||guardando} onClick={cambiarTodos}>Aplicar</button>
                <span className="fhint">o cambiá cada fila con su botón de estado · después tocá <b>Guardar cambios</b></span>
              </div>}
              {fmsg && <div className={fmsg.startsWith("Error")?"err":"fok"}>{fmsg.startsWith("Error")?"⚠ "+fmsg.slice(7):fmsg}</div>}
              <div className="ftable">
                {filas.map((fila,i)=>{ const {l,p,e}=fila; const ed=puedeEditar(user,l.local_id); const pv=pend[p.parte_id]; const val=pv||e;
                  return (
                  <div className={"ftr"+(pv?" fpend":"")} key={i} onClick={()=>sinPendientes(()=>{onAbrirLocal(l.local_id,p.parte_id,tarea);onClose();})}>
                    <span className="ftloc">{l.numero}</span>
                    <span className="ftnom">{l.nombre}</span>
                    <span className="ftel">{normEtq(p.etiqueta)}{pv && <span className="fantes"> · antes: {e}</span>}</span>
                    {ed
                      ? <select className="estado-sel" data-e={val} value={val} disabled={guardando} style={{marginLeft:"auto"}}
                          title={sub?"Cambia esta subtarea":"Cambia la tarea (y todas sus subtareas)"}
                          onClick={ev=>ev.stopPropagation()} onChange={ev=>{ev.stopPropagation(); marcar(fila,ev.target.value);}}>
                          {ESTADOS.map(o=><option key={o} value={o}>{o}</option>)}
                        </select>
                      : <span className="estado-sel ro" data-e={e} style={{marginLeft:"auto"}}>{e}</span>}
                  </div>);})}
                {filas.length===0 && <div className="noplano"><p>Ningún elemento del alcance tiene esa tarea.</p></div>}
              </div>
            </React.Fragment>
          )}
        </div>
        {/* rev21: barra para guardar o descartar los cambios hechos en Filtros */}
        {nPend>0 && <div className="savebar">
          <button className="btn primary" disabled={guardando} onClick={guardarPend}>{guardando?"Guardando…":"💾 Guardar cambios ("+nPend+")"}</button>
          <button className="btn" disabled={guardando} onClick={()=>{setPend({});setFmsg("");}}>Descartar</button>
          <span className="msg">{nPend} elemento(s) con cambios sin guardar</span>
        </div>}
      </div>
    </div>
  );
}

// Solo comentarios ORIGINALES y ABIERTOS (sin respuestas, sin cerrados), agrupados por local y elemento.
function armarReporte(data,locs,titulo){
  const ordTipo={SOLADO:0,TABIQUE:1,CIELORRASO:2};
  const coms=(data.comentarios||[]).filter(c=>!c.parent_id&&!c.cerrado);
  const lineas=[], ahora=fmtFecha(new Date().toISOString());
  let total=0;
  lineas.push("REPORTE DE COMENTARIOS ABIERTOS — "+titulo);
  lineas.push("Generado: "+ahora);
  lineas.push("");
  locs.forEach(l=>{
    const cl=coms.filter(c=>c.local_id===l.local_id);
    if(!cl.length) return;
    lineas.push("■ Local "+l.numero+(l.nombre?" · "+l.nombre:"")+"  ("+mNom(l.modulo)+" · "+nNom(l.nivel)+")");
    const partes=[...l.partes].sort((a,b)=>(ordTipo[a.tipo]-ordTipo[b.tipo])||((a.indice||0)-(b.indice||0)));
    const grupos=partes.map(p=>({etq:normEtq(p.etiqueta), cs:cl.filter(c=>c.parte_id===p.parte_id)}));
    const huerf=cl.filter(c=>!partes.some(p=>p.parte_id===c.parte_id));
    if(huerf.length) grupos.push({etq:"(elemento eliminado)", cs:huerf});
    grupos.forEach(g=>{
      if(!g.cs.length) return;
      [...g.cs].sort((a,b)=>(a.ref||"").localeCompare(b.ref||"",'es')||String(a.creado_en).localeCompare(String(b.creado_en))).forEach(c=>{
        total++;
        const donde=g.etq+(c.ref?" › "+c.ref:" (general)");
        lineas.push("   • "+donde+": "+(c.autor_nombre||c.autor_email||"?")+" ("+fmtFecha(c.creado_en)+") comentó: "
          +(c.texto||"").replace(/\s*\n\s*/g," / ")+(c.foto_path?" [con foto]":""));
      });
    });
    lineas.push("");
  });
  if(!total) lineas.push("No hay comentarios abiertos en este alcance.");
  else lineas.splice(2,0,"Comentarios abiertos: "+total);
  return lineas.join("\n");
}

        <div className="modal" style={{maxWidth:420,width:"92%"}}>
          <div className="mhead"><div><h2>Quitar local</h2>
            <div style={{fontSize:12,opacity:.85}}>Se va a eliminar <b>{confirmDel.numero} · {confirmDel.nombre}</b> y todos sus elementos ({confirmDel.partes.length}). No se puede deshacer.</div></div></div>
          <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn danger" onClick={()=>doBorrarLocal(confirmDel)}>Sí, quitar local</button>
            <button className="btn" onClick={()=>setConfirmDel(null)}>Cancelar</button>
          </div>
        </div>
      </div>
    )}

    {!wide && !movil && <div className="foot">
      Avance de Obra · beta {ONLINE?"· en línea (Supabase)":"· MODO DEMO (datos de ejemplo)"}
      <span style={{marginLeft:8,fontSize:11.5,fontWeight:700,color:"#475569",background:"#e2e8f0",borderRadius:99,padding:"2px 8px"}}>Rev. {APP_REV.replace(/^rev/,"")}</span>
    </div>}
  </div>
  </ComCtx.Provider>
  );
}
// rev15/rev18: conectores C-1 (código "C1", entre A y B) y C-2 (código "C2", entre B y C)
function mNom(m){ return (m==="C1"||m==="C2") ? "Conector "+mLbl(m) : "Módulo "+m; }
function mLbl(m){ return m==="C1" ? "C-1" : m==="C2" ? "C-2" : m; }
function ordMod(a,b){ return MODS.indexOf(a)-MODS.indexOf(b); }
function ordArea(a,b){ return ordMod(a.modulo,b.modulo) || NIVS.findIndex(x=>x[0]===a.nivel)-NIVS.findIndex(x=>x[0]===b.nivel); }
function nNom(n){ const f=NIVS.find(x=>x[0]===n); return f?f[1]:n; }
// app instalable: guarda la app en el celular para abrir rápido; si hay una versión nueva, avisa para actualizar
if(!CLON&&("serviceWorker" in navigator)&&/^https:|^http:\/\/localhost/.test(location.href)){
  navigator.serviceWorker.addEventListener("message",e=>{ if(e.data&&e.data.tipo==="nueva") avAvisoVersion(); });
  navigator.serviceWorker.register("sw.js").catch(()=>{}); }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
