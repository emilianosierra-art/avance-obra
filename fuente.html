  body{font-family:'AvIconos',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#eef2f7;color:var(--ink);-webkit-text-size-adjust:100%}
  button,select,textarea,input{font-family:inherit}
  button{cursor:pointer}
  .app{max-width:1200px;margin:0 auto;padding:0 14px 60px}
  /* Header */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;
    margin:0 -14px 16px;padding:14px 18px;box-shadow:0 2px 14px rgba(15,23,42,.18)}
  .top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .top .sub{font-size:12px;opacity:.8;margin-top:2px}
  .spacer{flex:1}
  .userbox{font-size:12.5px;text-align:right;line-height:1.3}
  .userbox b{display:block;font-size:13px}
  .btn{border:0;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;background:#fff;color:var(--brand)}
  .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* global progress */
  .globalbar{display:flex;align-items:center;gap:12px;margin:6px 0 0}
  .globalbar .track{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .globalbar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80)}
  /* area selector */
  .areabar{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:12px}
  .areagrp{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .areagrp .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-right:2px}
  .achip{position:relative;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700}
  .achip.wide{padding:7px 14px}
  .achip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .achip .cbadge{display:inline-block;margin-left:7px;background:#e2e8f0;color:#334155;border-radius:99px;font-size:10.5px;font-weight:800;padding:1px 6px}
  .achip.on .cbadge{background:rgba(255,255,255,.25);color:#fff}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* Plano */
  .planowrap{position:relative;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .planowrap .inner{position:relative;width:100%}
  .planowrap img{display:block;width:100%;height:auto;user-select:none}
  .noplano{padding:40px 20px;text-align:center;color:var(--muted)}
  /* rev20: cambiar estados desde Filtros */
  .fmasivo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eef4fb;border:1px solid #cfe0f5;border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:13px}
  .fmasivo .fhint{font-size:11.5px;color:var(--muted)}
  .fok{background:#dcfce7;color:#166534;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .ftr .estado-sel{flex:0 0 auto}
  .ftr.fpend{background:#fffbeb;border-color:#fcd34d}
  .fantes{font-size:11px;color:#b45309;font-weight:600}
  /* rev20: botones Anterior / Sig. local en la ficha */
  .navloc{display:inline-flex;gap:6px}
  .navloc button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:4px 9px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:44px}
  .navloc button b{font-size:15px}
  .navloc button small{font-size:9.5px;font-weight:700;opacity:.9;white-space:nowrap}
  .navloc button:disabled{opacity:.3;cursor:default}
  @media(max-width:640px){ .navloc button small{display:none} .navloc button{padding:7px 10px} }
  /* rev20: zoom del plano + círculos que se adaptan (--mk = diámetro según el ancho de la pantalla) */
  .planobox{position:relative}
  .zoombox{position:absolute;top:8px;right:8px;z-index:9;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);
    padding:4px 6px;border-radius:10px;box-shadow:var(--shadow-sm);font-size:12px;font-weight:700;color:var(--muted)}
  .zoombox .btn{border:1px solid var(--line);min-width:32px;font-size:16px;line-height:1;padding:4px 8px}
  .planowrap.zoomed{overflow:auto;max-height:calc(100vh - 140px);-webkit-overflow-scrolling:touch}
  .planowrap.zoomed .inner{display:block;max-width:none!important}   /* con zoom el plano crece (en pantallas grandes y en 3 columnas tenía tope) */
  .planowrap.zoomed img{width:100%!important;max-width:none!important;max-height:none!important}
  .marker{position:absolute;transform:translate(-50%,-50%);width:var(--mk,34px);height:var(--mk,34px);border-radius:50%;
    border:2.5px solid #fff;box-shadow:0 0 0 2.5px #0f172a, 0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s;
    white-space:nowrap;overflow:hidden;line-height:1;letter-spacing:-.3px;text-align:center;padding:0}
  .marker:hover{transform:translate(-50%,-50%) scale(1.15);z-index:5}
  .marker.dim{opacity:.35}
  .pmarker{position:absolute;transform:translate(-50%,-50%);min-width:calc(var(--mk,34px) * .65);height:calc(var(--mk,34px) * .65);
    padding:0 calc(var(--mk,34px) * .14);border-radius:99px;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--mk,34px) * .29);font-weight:800;color:#fff;z-index:4}
  .pmarker.sel{outline:3px solid #2c5282;outline-offset:1px}
  .pmarker.dim{opacity:.3}
  .pmarker{cursor:pointer;transition:transform .1s}
  .pmarker:hover{transform:translate(-50%,-50%) scale(1.18);z-index:6}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px;font-size:12.5px;color:var(--muted)}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  /* Grid list */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;cursor:pointer;border:1px solid #eef2f7;transition:.14s}
  .card:hover{border-color:var(--brand2);transform:translateY(-2px)}
  .card .name-lg{font-size:17px;font-weight:800;color:var(--brand);line-height:1.15}

  .umuted{color:var(--muted);font-size:12px}
  /* rev16: pantalla grande / TV touch — se agranda todo (zoom) y se usa todo el ancho.
     El zoom depende del ancho: 1080p ≈ 1.3x, 2K ≈ 1.7x, 4K sin escalar ≈ 2.4x.
     Las alturas con vh se dividen por el zoom para que los modales y el plano entren en la pantalla. */
  @media(min-width:1500px){
    :root{--z:1}
    .app{zoom:var(--z);max-width:none;padding:0 18px 40px}
    header.top{margin:0 -18px 14px}
    .modal{max-height:calc(92vh / var(--z))}
    .modal.local{max-width:1100px}
    .reptxt{min-height:calc(55vh / var(--z))}
    .fotobig img{max-height:calc(88vh / var(--z))}
    /* el plano se achica para entrar entero en la altura de la pantalla, centrado */
    .planowrap{text-align:center}
    .planowrap .inner{display:inline-block;width:auto;max-width:100%;vertical-align:top}
    .planowrap img{width:auto;max-width:100%;max-height:calc(100vh / var(--z) - 245px)}
    header.top{padding:8px 18px}
    .globalbar{margin-top:2px}
    .verbar{display:none}            /* en TV, "Cómo ver" va arriba de la lista lateral */
    .ver-over{display:flex;flex-direction:column;position:absolute;top:8px;left:8px;z-index:8;gap:6px;background:rgba(255,255,255,.92);
      padding:5px;border-radius:11px;box-shadow:var(--shadow-sm)}
    .ver-over .vchip{font-size:12px;padding:6px 10px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
    .planolayout{display:flex;gap:16px;align-items:flex-start}
    .planocol{flex:1 1 auto;min-width:0}
    .planoside{display:flex;flex-direction:column;gap:6px;flex:0 0 300px;max-height:calc(100vh / var(--z) - 250px);overflow:auto;
      background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px}
  }
  /* rev18: planos parados (C-1, C-2): en PC no se estiran a todo el ancho; entran en la altura de la pantalla */
  .planowrap.vert{text-align:center}
  .planowrap.vert .inner{display:inline-block;width:auto;max-width:100%;vertical-align:top}
  .planowrap.vert img{width:auto;max-width:100%;max-height:calc(100vh - 140px)}
  .planoside{display:none}
  .ver-over{display:none}   /* rev17: solo en pantalla grande (en PC común/celu está la barra "Cómo ver" arriba del plano) */
  @media(min-width:1500px){ .planoside{display:flex} .ver-over{display:flex}
    .planowrap.vert img{max-height:calc(100vh / var(--z) - 245px)}
    .planowrap.zoomed{max-height:calc(100vh / var(--z) - 245px)} }
  .ps-tit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:2px 4px 4px;display:flex;justify-content:space-between}
  .ps-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;text-align:left;font-size:13px;color:var(--ink)}
  .ps-item:hover{border-color:var(--brand2);background:#f8fafc}
  .ps-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .ps-num{font-weight:800;color:var(--brand);min-width:38px}
  .ps-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* el agrandado es solo para la tele táctil (se maneja con el dedo); en un monitor con mouse todo queda igual y se ve más */
  @media(min-width:1500px) and (pointer:coarse){ :root{--z:1.3} }
  @media(min-width:2200px) and (pointer:coarse){ :root{--z:1.7} }
  @media(min-width:3000px) and (pointer:coarse){ :root{--z:2.4} }
  /* rev10: celular — la ficha del local (la que abre el QR) ocupa toda la pantalla y se lee cómoda */
  @media(max-width:640px){
    .overlay.ov-local{align-items:stretch}
    .modal.local{max-height:none;height:100vh;height:100dvh;border-radius:0}
    .modal.local .mhead{padding:10px 12px;gap:8px}
    .modal.local .mhead h2{font-size:16px;line-height:1.2}
    .modal.local .mbody{padding:10px 8px 20px}

    .modal.local .tarea-row{gap:6px;min-height:40px}
    .modal.local .tarea-n{font-size:13px}
    .modal.local .estado-sel{min-width:100px;font-size:12px;padding:8px 6px}
    .modal.local .estado-sel.sm{min-width:96px}
    .modal.local .subtareas{margin-left:6px;padding-left:8px}
    .modal.local .sub{min-height:38px}
    .modal.local .sub-n{flex:1 1 120px;font-size:12px}
    .modal.local .parte .ph{padding:12px 10px}
    .modal.local .coment{margin:4px 8px 10px;width:calc(100% - 16px)}
    .modal.local .savebar{padding:10px 10px calc(10px + env(safe-area-inset-bottom));flex-wrap:wrap}
    .modal.local .lp-svgwrap{max-height:240px}
    .nota-inp,.coment,.addtarea input,.addrubro select,.fsel,.buscador input,.ccomp textarea{font-size:16px}  /* evita el zoom automático de iOS */
    .reptxt{white-space:pre-wrap;font-size:12px}
    .top h1{font-size:15px}
    .userbox span{display:none}
  }
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    .qrsheet,.qrsheet *{visibility:visible}
    .qrsheet{position:absolute;left:0;top:0;width:100%;grid-template-columns:repeat(3,1fr);gap:10px}
    .qr-noprint{display:none!important}
    .overlay{position:static;background:none}
    .modal{box-shadow:none;max-width:none;width:100%}
  }

<script>
/* visor: los documentos adjuntos y los informes se abren para verlos (imagen o PDF página por página); "Descargar" está adentro */
(function(){
  async function bajar(href,nombre){ try{ const r=await fetch(href); if(!r.ok) throw new Error("HTTP "+r.status); const u=URL.createObjectURL(await r.blob());
      const a=document.createElement("a"); a.href=u; a.download=nombre||"archivo"; a.setAttribute("data-bajar","1"); document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),4000); }
    catch(e){ console.error("descarga",e); window.open(href,"_blank"); } }
  const PDFJS="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/";
  let pdfjsP=null; const cargarPdfjs=()=>pdfjsP||(pdfjsP=new Promise((res,rej)=>{ const sc=document.createElement("script"); sc.src=PDFJS+"pdf.min.js";
    sc.onload=()=>{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+"pdf.worker.min.js"; res(window.pdfjsLib); }; sc.onerror=()=>rej(new Error("no cargó el visor de PDF")); document.head.appendChild(sc); }));
  function visor(href,nombre){
    const ov=document.createElement("div"); ov.className="vis-ov";
    ov.innerHTML='<div class="vis"><div class="vis-h"><span class="vis-n"></span><button class="vis-b" data-v="bajar">⬇ Descargar</button><button class="vis-x" data-v="cerrar" aria-label="Cerrar">×</button></div><div class="vis-c"><div class="vis-m">Abriendo…</div></div></div>';
    ov.querySelector(".vis-n").textContent=nombre||"";
    const cerrar=()=>{ ov.remove(); document.removeEventListener("keydown",esc); }; const esc=e=>{ if(e.key==="Escape") cerrar(); };
    ov.addEventListener("click",e=>{ if(e.target===ov||e.target.closest("[data-v=cerrar]")) cerrar(); if(e.target.closest("[data-v=bajar]")) bajar(href,nombre); });
    document.addEventListener("keydown",esc); document.body.appendChild(ov);
    const C=ov.querySelector(".vis-c"), msg=t=>{ C.innerHTML='<div class="vis-m"></div>'; C.firstChild.textContent=t; };
    (async()=>{ try{
      const r=await fetch(href); if(!r.ok) throw new Error("HTTP "+r.status); const buf=await r.arrayBuffer();
      if(/\.pdf$/i.test(nombre||href)||/^data:application\/pdf/.test(href)){
        const lib=await cargarPdfjs(); const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise; C.innerHTML="";
        const W=Math.min(C.clientWidth-16,1100), dpr=Math.min(window.devicePixelRatio||1,2);
        for(let i=1;i<=doc.numPages;i++){ if(!ov.isConnected) return; const pg=await doc.getPage(i); const v0=pg.getViewport({scale:1}); const sc=W/v0.width; const vp=pg.getViewport({scale:sc*dpr});
          const cv=document.createElement("canvas"); cv.width=vp.width; cv.height=vp.height; cv.style.width=(vp.width/dpr)+"px"; C.appendChild(cv);
          await pg.render({canvasContext:cv.getContext("2d"),viewport:vp}).promise; }
      } else { const u=URL.createObjectURL(new Blob([buf])); const im=new Image(); im.onload=()=>{ C.innerHTML=""; C.appendChild(im); }; im.onerror=()=>msg("No se puede mostrar este archivo; usá Descargar."); im.src=u; }
    }catch(e){ console.error("visor",e); msg("No se pudo abrir el archivo ("+(e.message||e)+"). Probá con Descargar."); } })();
  }
  window.__visor=visor;
  document.addEventListener("click",ev=>{ const a=ev.target.closest&&ev.target.closest("a[download]"); if(!a||a.hasAttribute("data-bajar")) return;
    if(/^blob:/.test(a.href)&&!/\.(pdf|jpe?g|png|webp|gif)$/i.test(a.getAttribute("download")||"")) return;   // CSV, Excel, respaldo: se bajan directo
    ev.preventDefault(); ev.stopPropagation(); visor(a.href,a.getAttribute("download")); },true);
})();

/* Los tabiques/solados/cielorrasos (av_partes) traen toda la matriz y pesan mucho: pedirlos junto con los locales en una
   sola consulta hacía que Supabase la cortara por tiempo ("canceling statement due to statement timeout").
   Ahora se piden aparte, en tandas, y cada tanda se reintenta si se corta. */
async function avReintentar(f,n){ let e; for(let i=0;i<(n||3);i++){ const r=await f(); if(!r.error) return r; e=r.error;
    if(!/timeout|fetch|network|503|504/i.test(e.message||"")) break; await new Promise(z=>setTimeout(z,700*(i+1))); } return {error:e}; }
async function leerPartes(sb){
  const T=150; const c=await avReintentar(()=>sb.from('av_partes').select('parte_id',{count:'exact',head:true}));
  if(c.error) return {error:c.error};
  const n=c.count||0, tandas=[]; for(let d=0; d<n; d+=T) tandas.push(d);
  const out=[]; let err=null;
  for(let i=0;i<tandas.length;i+=4){   // de a 4 tandas a la vez
    const rs=await Promise.all(tandas.slice(i,i+4).map(d=>avReintentar(()=>sb.from('av_partes').select('*').order('parte_id').range(d,d+T-1))));
    for(const r of rs){ if(r.error){ err=r.error; break; } out.push(...(r.data||[])); } if(err) break; }
  return err?{error:err}:{data:out};
}
async function cargarDatos(sb, uid, email){

    leerPartes(sb)
  ]);
  if(locR.error) return {ok:false, error: locR.error.message};
  if(partR.error) return {ok:false, error: "No se pudieron leer los tabiques/solados ("+partR.error.message+"). Probá de nuevo en un rato."};
  const partesDe={}; (partR.data||[]).forEach(p=>{ (partesDe[p.local_id]=partesDe[p.local_id]||[]).push(p); });
  (locR.data||[]).forEach(l=>{ const rk={SOLADO:0,TABIQUE:1,CIELORRASO:2}; l.av_partes=(partesDe[l.local_id]||[]).sort((a,b)=>((rk[a.tipo]??3)-(rk[b.tipo]??3))||((a.indice||0)-(b.indice||0))); });

async function leerComentarios(sb, local_id){
  const out=[];
  for(let desde=0; ; desde+=1000){
    let q=sb.from('av_comentarios').select('*').order('creado_en').range(desde, desde+999);
    if(local_id) q=q.eq('local_id', local_id);

// Achica la foto en el navegador (máx. 1600 px, JPEG) para que pese ~200-400 KB
function achicarFoto(file){
  return new Promise((resolve,reject)=>{
    const img=new Image(); const url=URL.createObjectURL(file);
    img.onload=()=>{
      const intentar=(max,q)=>{
        const k=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
        const cv=document.createElement('canvas'); cv.width=Math.round(img.naturalWidth*k); cv.height=Math.round(img.naturalHeight*k);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        cv.toBlob(b=>{ if(!b) return reject(new Error("No se pudo procesar la foto"));
          if(b.size>450*1024 && max>900) intentar(max-400,q-0.1); else { URL.revokeObjectURL(url); resolve(b); } },'image/jpeg',q);
      };
      intentar(1600,0.75);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); reject(new Error("Ese archivo no parece una imagen")); };
    img.src=url;
  });
}

function v2MigrarDeV1(d){ const M=V2_MIG, TIPO={TABIQUE:"Tabique",SOLADO:"Solado",CIELORRASO:"Cielorraso"};

/* diff de fases para auditoría (qué tarea/subtarea/hito cambió) */
function diffFases(orig, neu, parte_id){
  const out=[];
  (neu||[]).forEach(f=>{
    const of=(orig||[]).find(x=>x.id===f.id);
    if(of && (of.hito&&f.hito) && of.hito.valor!==f.hito.valor)
      out.push({tipo:'hito',parte_id,item:f.nombre,campo:f.hito.nombre,anterior:of.hito.valor,nuevo:f.hito.valor});
    (f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      let ot=null; (of&&of.grupos||[]).forEach(gg=>{const x=(gg.tareas||[]).find(y=>y.id===t.id); if(x)ot=x;});
      if(ot){
        if((ot.estado||'')!==(t.estado||'')) out.push({tipo:'estado',parte_id,item:t.nombre,campo:'estado',anterior:ot.estado||'',nuevo:t.estado||''});
        if((ot.comentario||'')!==(t.comentario||'')) out.push({tipo:'comentario',parte_id,item:t.nombre,campo:'comentario',anterior:ot.comentario||'',nuevo:t.comentario||''});
      }
      (t.subtareas||[]).forEach(s=>{
        const os= ot ? (ot.subtareas||[]).find(y=>y.id===s.id) : null;
        if(os){
          if((os.estado||'')!==(s.estado||'')) out.push({tipo:'subtarea',parte_id,item:t.nombre+' › '+s.nombre,campo:'estado',anterior:os.estado||'',nuevo:s.estado||''});
          if((os.comentario||'')!==(s.comentario||'')) out.push({tipo:'comentario',parte_id,item:t.nombre+' › '+s.nombre,campo:'comentario',anterior:os.comentario||'',nuevo:s.comentario||''});
        }
      });
    }));
  });
  return out;
}

    const out=[];
    pt.fases.forEach(f=>f.grupos.forEach(g=>g.tareas.forEach(t=>{
      if(t.subtareas&&t.subtareas.length) t.subtareas.forEach(s=>out.push(s.estado));

}
function avancePct(local){

    if(PESO[e]===null) return; tot++; done+=(PESO[e]||0);
  }));

}

/* color por estado de los ítems hoja: verde=todo terminado, naranja=algo iniciado/terminado,
   rojo=nada. Así cualquier avance (por chico que sea) cambia el color, sin depender del %. */
function colorItems(items){
  if(!items||items.length===0) return "#dc2626";        // sin datos cargados → sin iniciar (rojo)
  const rel=items.filter(e=>PESO[e]!==null);           // excluye "No aplica"
  if(rel.length===0) return "#94a3b8";                  // todo "No aplica" → gris
  if(rel.every(e=>e==="Terminado")) return "#16a34a";   // todo terminado → verde

}

   - ROJO:    nada iniciado
   - NARANJA: algo iniciado o terminado
   - VERDE:   todas las etapas de la matriz (Primeros pasos, Emplacado…) al 100%
   - GRIS:    además, la etapa per-local (Revestimiento en tabiques / Terminaciones en cielorraso) al 100%
     (rev20: en solados, verde = "Verificación" terminada; gris = además "Terminaciones" terminada)
   Un local toma el color "más atrasado" de sus elementos (gris solo si TODOS están en gris). */
const COL_EST={rojo:"#dc2626",naranja:"#f59e0b",verde:"#16a34a",gris:"#64748b"};

  if(p.tipo==="SOLADO"){
    const iVer=p.fases.findIndex(f=>normNom(f.nombre).startsWith("verificacion"));
    esFinal=f=>normNom(f.nombre).startsWith("terminacion");   // en la base se llama "TERMINACION"
    esBase=(f,i)=>!esFinal(f) && (iVer<0 || i<=iVer);   // sin "Verificación": todas menos Terminaciones
  } else {
    esFinal=f=>!!f.perLocal || PERLOCAL_NOMBRES.indexOf(f.nombre)>=0;
    esBase=f=>!esFinal(f);
  }
  const base=hojasDe(p.fases.filter((f,i)=>esBase(f,i))), rev=hojasDe(p.fases.filter(f=>esFinal(f)));
  if(completas(base)) return (rev.length>0 && rev.some(e=>e!=="No aplica") && completas(rev)) ? "gris" : "verde";

/* ================== v2: Informe de avance (métricas) ==================
   Reemplaza al 📝 Reporte de comentarios: avance general, por sector, elemento, etapa y rubro, locales más atrasados,
   informes de etapa (listos, generados, cargados) y comentarios vigentes. Respeta los filtros activos. Se descarga en PDF. */
function iaCombo(fg,k,v){ if(fg[k].length&&!fg[k].some(x=>normNom(x)===normNom(v))) return null; return {...fg,[k]:[v]}; }
function iaHay(locs,fg){ const act=filtroActivo(fg); return locs.some(l=>(l.partes||[]).some(p=>{ const x=act?hojasFiltradas(p,fg):partItems(p); return x&&x.some(e=>PESO[e]!==null); })); }
function iaCalc(data,locs,fg,reg){
  const R={};
  R.general=pctLocales(locs,fg);
  const sec={}; locs.forEach(l=>{ const k=l.modulo+"|"+l.nivel; (sec[k]=sec[k]||{mod:l.modulo,niv:l.nivel,locs:[]}).locs.push(l); });
  R.sectores=Object.values(sec).sort((a,b)=>MODS.indexOf(a.mod)-MODS.indexOf(b.mod)||NIVS.findIndex(x=>x[0]===a.niv)-NIVS.findIndex(x=>x[0]===b.niv))
    .map(s=>({nom:mNom(s.mod)+" · "+nNom(s.niv),n:s.locs.length,pct:pctLocales(s.locs,fg),hay:iaHay(s.locs,fg)}));
  R.elementos=["SOLADO","TABIQUE","CIELORRASO"].map(t=>{ const f=iaCombo(fg,"elementos",t); return f&&iaHay(locs,f)?{nom:ELEM_NOM[t],pct:pctLocales(locs,f)}:null; }).filter(Boolean);
  R.etapas=V2_ETAPAS.map((et,i)=>{ const f=iaCombo(fg,"etapas",et); if(!f||!iaHay(locs,f)) return null; let comp=0,tot=0;
    locs.forEach(l=>rpEstadoLocal(l,et).forEach(x=>{ if(fg.elementos.length&&fg.elementos.indexOf(x.el.tipo)<0) return; tot++; if(x.ok) comp++; }));
    return {nom:V2_ETQ[i],et,pct:pctLocales(locs,f),comp,tot}; }).filter(Boolean);
  const rub=[], vis=new Set(); locs.forEach(l=>(l.partes||[]).forEach(p=>{ if(fg.elementos.length&&fg.elementos.indexOf(p.tipo)<0) return;
    (p.fases||[]).forEach(fz=>{ if(fg.etapas.length&&fg.etapas.indexOf(etapaGrupo(fz.nombre))<0) return;
      (fz.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ const k=normNom(t.nombre); if(!vis.has(k)){ vis.add(k); rub.push(t.nombre); } })); }); }));
  R.rubros=[...GRUPOS_RUBRO.map(g=>g[0]),"Otros"].map(gn=>({gn,items:rub.filter(r=>grupoRubro(r)===gn).sort((a,b)=>a.localeCompare(b,"es"))
    .map(r=>{ const f=iaCombo(fg,"rubros",r); return f&&iaHay(locs,f)?{nom:r,pct:pctLocales(locs,f)}:null; }).filter(Boolean)})).filter(g=>g.items.length);
  R.atrasados=locs.filter(l=>iaHay([l],fg)).map(l=>({l,pct:pctLocales([l],fg)})).sort((a,b)=>a.pct-b.pct).slice(0,10);
  let listos=0, gen=0, carg=0; locs.forEach(l=>V2_ETAPAS.forEach(et=>rpEstadoLocal(l,et).forEach(x=>{ if(!x.ok) return; listos++;
    const r=(reg||[]).find(r=>r.local_id===l.local_id&&r.el===x.el.id&&r.etapa===et); if(r) gen++; if(r&&r.cargado) carg++; })));
  R.informes={listos,gen,carg,pend:listos-carg};
  const pById={}; data.locales.forEach(l=>(l.partes||[]).forEach(p=>pById[p.parte_id]=p)); const lids=new Set(locs.map(l=>l.local_id));
  const cv=(data.comentarios||[]).filter(c=>!c.parent_id&&!c.cerrado&&lids.has(c.local_id)&&comEnFiltro(c,pById,fg));
  R.coms=R.sectores.map(s=>({nom:s.nom,n:cv.filter(c=>{ const l=data.locales.find(x=>x.local_id===c.local_id); return l&&mNom(l.modulo)+" · "+nNom(l.nivel)===s.nom; }).length})).filter(x=>x.n);
  R.comsLista=cv.map(c=>{ const l=data.locales.find(x=>x.local_id===c.local_id)||{}; const p=pById[c.parte_id]; return {loc:(l.modulo||"")+"-"+(l.nivel||"")+" "+(l.numero||""),el:p?(p.tipo==="TABIQUE"?"Tabiques":RP_ELNOM[p.tipo]):"",ref:c.ref||"",texto:c.texto||"",autor:c.autor_nombre||"",fecha:c.creado_en}; })
    .sort((a,b)=>a.loc.localeCompare(b.loc,"es",{numeric:true}));
  return R;
}

      </div></div></div>;
}

/* ---------- v2: menciones (@Nombre) y comentarios no vistos ---------- */
function v2usuariosMencion(coms,user){   // lista para @: la de la base (si está el SQL 16) + autores de comentarios + yo
  const m={}; (window.__usuarios||[]).forEach(u=>{ if(u.nombre) m[u.nombre.toLowerCase()]={id:u.id||null,nombre:u.nombre}; });
  (coms||[]).forEach(c=>{ const n=c.autor_nombre; if(n&&!m[n.toLowerCase()]) m[n.toLowerCase()]={id:c.autor_id||null,nombre:n}; });
  if(CLON) ["Admin demo","Editor demo","Lector demo"].forEach(n=>{ if(!m[n.toLowerCase()]) m[n.toLowerCase()]={id:null,nombre:n}; });
  if(user&&user.nombre&&!m[user.nombre.toLowerCase()]) m[user.nombre.toLowerCase()]={id:user.id,nombre:user.nombre};
  return Object.values(m).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es")); }
function v2mencionaA(c,user){ if(!user||!c||!c.texto) return false; const n=(user.nombre||"").trim(); if(!n) return false;
  return String(c.texto).toLowerCase().indexOf("@"+n.toLowerCase())>=0; }
const v2esMio=(c,user)=>!!(user&&c&&((c.autor_id&&c.autor_id===user.id)||(!c.autor_id&&c.autor_nombre&&c.autor_nombre===user.nombre)));
// es para mí: me menciona, o es una respuesta (de otro) en un hilo que abrí yo o en el que respondí
function v2paraMi(c,user,coms){ if(!c||v2esMio(c,user)) return false; if(v2mencionaA(c,user)) return true;
  if(!c.parent_id) return false; const raiz=(coms||[]).find(x=>x.id===c.parent_id); if(!raiz) return false;
  return v2esMio(raiz,user)||(coms||[]).some(x=>x.parent_id===raiz.id&&v2esMio(x,user)); }
// texto con las @menciones resaltadas (HTML ya escapado)
function v2textoMenc(texto,coms,user){ let h=v2esc(texto||""); const us=v2usuariosMencion(coms,user).map(u=>u.nombre).sort((a,b)=>b.length-a.length);
  us.forEach(n=>{ const e=v2esc("@"+n); h=h.split(e).join('<b class="menc'+(user&&n===user.nombre?" yo":"")+'">'+e+'</b>'); }); return h; }
function TextoMenc({texto,coms,user}){ return <span dangerouslySetInnerHTML={{__html:v2textoMenc(texto,coms,user)}}/>; }
function v2comsVistoIni(user){ const k="av_coms_visto:"+((user&&user.email)||""); let a=""; try{ a=localStorage.getItem(k)||""; }catch(e){}
  const b=(window.__misPrefs&&window.__misPrefs.coms_visto)||""; const v=a>b?a:b;
  if(!v){ const n=CLON?"2026-11-20T12:00:00Z":new Date().toISOString(); try{ localStorage.setItem(k,n); }catch(e){} return n; }   // primera vez: no marcar todo como nuevo (en el clon, desde el mediodía del 20/11 para ver los de prueba)
  return v; }
function v2comsVistoGuardar(user,iso){ try{ localStorage.setItem("av_coms_visto:"+((user&&user.email)||""),iso); }catch(e){}
  window.__misPrefs=Object.assign({},window.__misPrefs||{},{coms_visto:iso});

const v2fechaCom=c=>String(c.editado_en&&c.editado_en>c.creado_en?c.editado_en:c.creado_en||"");
// autocompletar @ en cualquier caja de texto de comentarios (ficha, ventana de comentarios, respuestas)
(function(){ let pop=null, ta=null, ini=-1;
  const cerrar=()=>{ if(pop){ pop.remove(); pop=null; } ta=null; };
  document.addEventListener("input",e=>{ const t=e.target; if(!t||t.tagName!=="TEXTAREA"||t.__menc||!(t.matches("[data-ctxt],[data-rtxt],[data-cedtxt],.cobra-rt,.coment,.cnew"))) return;
    const pos=t.selectionStart, txt=t.value.slice(0,pos), m=txt.match(/(^|\s)@([^@\n]{0,30})$/); if(!m){ cerrar(); return; }
    const q=m[2].toLowerCase(); const us=v2usuariosMencion(window.__comCtx&&window.__comCtx.coms,window.__yo).filter(u=>u.nombre.toLowerCase().indexOf(q)>=0).slice(0,8);
    if(!us.length){ cerrar(); return; }
    ta=t; ini=pos-m[2].length-1; if(!pop){ pop=document.createElement("div"); pop.className="menc-pop"; document.body.appendChild(pop); }
    pop.innerHTML=us.map((u,i)=>`<button type="button" data-n="${v2esc(u.nombre)}"${i===0?' class="on"':""}>@${v2esc(u.nombre)}</button>`).join("");
    const r=t.getBoundingClientRect(); pop.style.left=Math.max(8,r.left)+"px"; pop.style.top=(r.bottom+4)+"px"; pop.style.minWidth=Math.min(r.width,260)+"px"; });
  document.addEventListener("mousedown",e=>{ const b=e.target.closest&&e.target.closest(".menc-pop button"); if(!b){ if(pop&&!e.target.closest(".menc-pop")) cerrar(); return; }
    e.preventDefault(); if(!ta) return; const t=ta, v=t.value, fin=t.selectionStart, ins="@"+b.dataset.n+" ", p=ini+ins.length; cerrar();
    const setter=Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype,"value").set; setter.call(t,v.slice(0,ini)+ins+v.slice(fin));
    t.__menc=true; t.dispatchEvent(new Event("input",{bubbles:true})); t.__menc=false; t.focus(); t.setSelectionRange(p,p); });
  document.addEventListener("keydown",e=>{ if(!pop) return; if(e.key==="Escape"){ cerrar(); return; }
    if(e.key==="Enter"||e.key==="Tab"){ const b=pop.querySelector("button.on"); if(b){ e.preventDefault(); b.dispatchEvent(new MouseEvent("mousedown",{bubbles:true})); } }
    if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); const bs=[...pop.querySelectorAll("button")]; let i=bs.findIndex(x=>x.classList.contains("on")); bs.forEach(x=>x.classList.remove("on")); i=(i+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length; bs[i].classList.add("on"); } },true);
})();

function MultiFiltro({label,opciones,valor,onChange,grupos}){
  const [open,setOpen]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{ if(!open) return; const h=e=>{ if(ref.current&&!ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown",h); document.addEventListener("touchstart",h);
    return ()=>{ document.removeEventListener("mousedown",h); document.removeEventListener("touchstart",h); }; },[open]);
  const toggle=v=>onChange(valor.indexOf(v)>=0 ? valor.filter(x=>x!==v) : [...valor,v]);
  // opciones que quedaron elegidas pero ya no aparecen (por otro filtro) se siguen mostrando para poder quitarlas
  const lista=[...opciones, ...valor.filter(v=>!opciones.some(o=>o[0]===v)).map(v=>[v,v])];
  return (
    <div className="mf" ref={ref}>
      <button className={"mf-btn"+(valor.length?" on":"")} onClick={()=>setOpen(o=>!o)}>
        {label}{valor.length?<span className="mf-n">{valor.length}</span>:null} <span className="mf-car">▾</span></button>
      {open && <div className="mf-pop">
        {lista.length===0 && <div className="mf-vacio">No hay opciones con los otros filtros.</div>}
        {!grupos && lista.map(([v,txt])=><label key={v} className="mf-op">
          <input type="checkbox" checked={valor.indexOf(v)>=0} onChange={()=>toggle(v)}/> <span>{txt}</span></label>)}
        {grupos && [...GRUPOS_RUBRO.map(g=>g[0]),"Otros"].map(gn=>{ const ops=lista.filter(o=>grupos(o[0])===gn); if(!ops.length) return null;
          const todos=ops.every(o=>valor.indexOf(o[0])>=0), alguno=ops.some(o=>valor.indexOf(o[0])>=0);
          return <div key={gn} className="mf-g">
            <label className="mf-gh"><input type="checkbox" checked={todos} ref={el=>{ if(el) el.indeterminate=alguno&&!todos; }}
              onChange={()=>onChange(todos?valor.filter(v=>!ops.some(o=>o[0]===v)):[...valor,...ops.map(o=>o[0]).filter(v=>valor.indexOf(v)<0)])}/> <span>{gn}</span></label>
            {ops.map(([v,txt])=><label key={v} className="mf-op mf-sub">
              <input type="checkbox" checked={valor.indexOf(v)>=0} onChange={()=>toggle(v)}/> <span>{txt}</span></label>)}</div>; })}
        {valor.length>0 && <button className="clink mf-clr" onClick={()=>onChange([])}>Quitar este filtro</button>}
      </div>}
    </div>
  );
}
function puedeEditar(user,local_id){
  if(!user) return false;
  if(user.puede_editar==="*") return true;
  return Array.isArray(user.puede_editar) && user.puede_editar.indexOf(local_id)>=0;
}
/* ---- Backup: exporta a Excel (o CSV si no cargó la librería) un cuadro con
   cada local, cada tabique/solado/cielorraso y el estado de cada ítem ---- */
async function exportarBackup(data){
  const rows=[["Modulo","Nivel","Local N°","Local nombre","Elemento","Etapa","Grupo","Tarea","Subgrupo","Subtarea","Estado","Comentario"]];
  (data.locales||[]).forEach(l=>(l.partes||[]).forEach(p=>{
    const fs=p.fases||[];
    if(!fs.length){ rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),"","","","","","(sin cargar)",p.comentarios||""]); return; }
    fs.forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      if(t.subtareas&&t.subtareas.length){
        t.subtareas.forEach(s=>rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),f.nombre,g.nombre||"",t.nombre,s.grupo||"",s.nombre,s.estado,s.comentario||""]));
      } else {
        rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),f.nombre,g.nombre||"",t.nombre,"","",t.estado,t.comentario||""]);
      }
    })));
  }));
  const fecha=new Date().toISOString().slice(0,10);
  try{
    let XL=null; try{ XL=await cargarXlsx(); }catch(e){}
    if(XL){
      const XLSX=XL; const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:7},{wch:6},{wch:8},{wch:20},{wch:14},{wch:16},{wch:16},{wch:18},{wch:14},{wch:22},{wch:12},{wch:24}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Avance");
      XLSX.writeFile(wb,"backup_avance_"+fecha+".xlsx");
    } else {
      const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n");
      const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
      a.download="backup_avance_"+fecha+".csv"; document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ alert("No se pudo generar el backup: "+(e&&e.message||e)); }
}

function normEtq(s){ return String(s||"").replace(/CIELORASO/gi,"CIELORRASO"); }
function buildFases(plantilla,pid){
  let tc=0,sc=0;
  // rev5: las etapas per-local (Revestimiento/Terminaciones) NO salen de la matriz
  return (plantilla||[]).filter(f=>PERLOCAL_NOMBRES.indexOf(f.nombre)<0).map(f=>({
    id:pid+"::"+f.id, nombre:f.nombre, hito:{nombre:f.hito,valor:"NO"}, comentario:"",
    grupos:(f.grupos||[]).map(g=>({nombre:g.nombre, tareas:(g.tareas||[]).map(t=>({
      id:pid+"::t"+(tc++), nombre:t.nombre, estado:"Sin realizar", comentario:"",
      subtareas:(t.subs||[]).map(s=>({id:pid+"::s"+(sc++), nombre:s.n, grupo:s.g||null, estado:"Sin realizar", comentario:""}))
    }))}))
  }));
}
/* etapa per-local vacía (revestimiento en tabiques / terminaciones en cielorraso) */
function etapaPerLocal(pid,nombre){
  return {id:pid+"::rev", nombre:nombre, perLocal:true, verificacion:"NO", comentario:"", grupos:[{nombre:null,tareas:[]}]};
}
/* normaliza una parte al modelo rev5: PP con "permite continuar", y etapa per-local
   según el tipo (descartando tareas placeholder viejas, conservando rubros válidos) */
function normalizeParte(pt){
  if(!pt||!pt.fases) return pt;
  const pp=pt.fases.find(f=>f.nombre===PP_NOMBRE);
  if(pp && pp.permiteContinuar==null) pp.permiteContinuar="SI";
  const revName=ETAPA_PERLOCAL[pt.tipo];
  if(revName){
    let rev=pt.fases.find(f=>f.nombre===revName || f.perLocal);
    if(!rev){ rev=etapaPerLocal(pt.parte_id,revName); pt.fases.push(rev); }
    rev.nombre=revName; rev.perLocal=true;
    if(rev.verificacion==null) rev.verificacion="NO";
    const rubros=[];
    (rev.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(esRubroValido(t.nombre,pt.tipo)) rubros.push(t); }));
    rev.grupos=[{nombre:null, tareas:rubros}];
  }
  return pt;
}
function normalizeData(data){
  (data&&data.locales||[]).forEach(l=>(l.partes||[]).forEach(p=>{ if(p.fases) normalizeParte(p); }));
  return data;
}
/* plantilla vigente para un tipo de elemento (TABIQUE/SOLADO/CIELORRASO) */
function plantillaDe(data,tipo){
  return (data&&data.plantillas&&data.plantillas[tipo]) || (data&&data.plantilla) || [];
}
/* Reconstruye las fases de una parte desde una plantilla nueva, CONSERVANDO el avance
   ya cargado emparejando por nombre (etapa › tarea › subtarea[+subgrupo]). Las que
   dejan de existir se descartan; las nuevas arrancan en "Sin realizar". */
/* rev23: cada etapa/tarea/subtarea de la plantilla puede traer "_o" = su nombre ORIGINAL (lo pone la
   Configuración de matriz). Si se renombró, el avance se busca por el nombre original, así no se pierde.
   Sin "_o" (ítem nuevo, o llamada desde otro lado) se empareja por nombre, como siempre. */
function aliasNuevo(old,viejoNom,nuevoNom){
  const a=[viejoNom].concat((old&&old.alias)||[]).filter((v,i,arr)=>v && v!==nuevoNom && arr.indexOf(v)===i);
  return a.length?a:null;
}
function mergeFasesByName(plantilla,pid,oldFases,opts){
  const HECHO=e=>e==="Terminado"||e==="No aplica";
  const fresh=buildFases(plantilla,pid);
  const pf=(plantilla||[]).filter(f=>PERLOCAL_NOMBRES.indexOf(f.nombre)<0);   // mismo orden que fresh
  const clave=(x,nom)=>(x&&x._o)?x._o:nom;
  const oldF={}; (oldFases||[]).forEach(f=>{ oldF[f.nombre]=f; });
  fresh.forEach((nf,fi)=>{
    const pF=pf[fi]||{};
    const of=oldF[clave(pF,nf.nombre)]; if(!of) return;
    if(of.hito&&nf.hito) nf.hito.valor=of.hito.valor;
    if(of.permiteContinuar!=null) nf.permiteContinuar=of.permiteContinuar;  // conservar "permite continuar"
    const fa=aliasNuevo(of,of.nombre,nf.nombre); if(fa) nf.alias=fa;
    const oT={}, oS={};
    (of.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      oT[t.nombre]=t;
      (t.subtareas||[]).forEach(s=>{ oS[t.nombre+'\u0000'+(s.grupo||'')+'\u0000'+s.nombre]=s; });
    }));
    (nf.grupos||[]).forEach((g,gi)=>(g.tareas||[]).forEach((t,ti)=>{
      const pT=(((pF.grupos||[])[gi]||{}).tareas||[])[ti]||{};
      const tk=clave(pT,t.nombre);
      const ot=oT[tk];
      if(ot){ t.estado=ot.estado||t.estado; t.comentario=ot.comentario||"";
        const ta=aliasNuevo(ot,ot.nombre,t.nombre); if(ta) t.alias=ta; }
      // v2: si el rubro ya estaba al 100% (todo Terminado / No aplica), los ítems nuevos entran como "No aplica" (no le bajan el avance)
      const rubroCompleto=!!(opts&&opts.naSiCompleto&&ot&&(ot.subtareas||[]).length&&(ot.subtareas||[]).every(x=>HECHO(x.estado)));
      (t.subtareas||[]).forEach((s,si)=>{
        const pS=(pT.subs||[])[si]||{};
        const sk=pS._o ? pS._o : ((s.grupo||'')+'\u0000'+s.nombre);
        const os=oS[tk+'\u0000'+sk];
        if(os){ s.estado=os.estado||s.estado; s.comentario=os.comentario||"";
          const lab=x=>(x.grupo? x.grupo+" · ":"")+x.nombre;
          const sa=aliasNuevo(os,lab(os),lab(s)); if(sa) s.alias=sa; }
        else if(rubroCompleto){ s.estado="No aplica"; if(opts.cuenta) opts.cuenta.n++; }
      });
    }));
  });
  // PP: asegurar "permite continuar"
  const ppF=fresh.find(f=>f.nombre===PP_NOMBRE); if(ppF&&ppF.permiteContinuar==null) ppF.permiteContinuar="SI";
  // preservar SOLO las etapas per-local conocidas (Revestimiento/Terminaciones).
  // Cualquier otra etapa que no esté en la matriz fue BORRADA a propósito → no se reañade.
  const names=new Set(fresh.map(f=>f.nombre));
  (oldFases||[]).forEach(of=>{ if(!names.has(of.nombre) && PERLOCAL_NOMBRES.indexOf(of.nombre)>=0) fresh.push(of); });
  return fresh;
}
function initDraft(local,data){
  const nd=JSON.parse(JSON.stringify(local));
  nd.partes.forEach(pt=>{
    pt.etiqueta=normEtq(pt.etiqueta);
    if(!pt.fases) pt.fases=buildFases(plantillaDe(data,pt.tipo),pt.parte_id);
    normalizeParte(pt);
  });
  return nd;
}

function findTareaIn(p,faseId,tareaId){
  const f=(p.fases||[]).find(x=>x.id===faseId); if(!f) return {};
  for(const g of f.grupos){const t=g.tareas.find(x=>x.id===tareaId); if(t) return {f,g,t};}
  return {f};
}
function rollupEstado(subs){
  const p=estadoLeaves(subs.map(s=>s.estado));
  if(subs.length && subs.every(s=>s.estado==="No aplica")) return "No aplica";
  if(p>=100) return "Terminado"; if(p>0) return "Iniciado"; return "Sin realizar";
}

/* estructura (subetapas › rubros) de una etapa, tomada de la primera parte; en Terminaciones, unión de rubros elegidos */
function v2estructura(el,et){
  const f0=v2fase(el.partes[0],et); if(!f0) return null;
  if(f0.perLocal){ const nombres=[]; const items={};
    el.partes.forEach(p=>{ const f=v2fase(p,et); (f&&f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(nombres.indexOf(t.nombre)<0){ nombres.push(t.nombre); items[t.nombre]=t; } })); });
    return {perLocal:true,subetapas:[{nombre:"",rubros:nombres.map(n=>({nombre:n,items:(items[n].subtareas||[]).map(s=>({sr:s.grupo||"",n:s.nombre,req:!!s.req_doc}))}))}]}; }

}
/* filas de un rubro: tabiques agrupados por la letra guardada en la tarea ("NA" = no aplica en ese T) */
function v2filas(el,et,sub,rub){
  if(!el.ts) return [{fila:null,partes:el.partes,ts:null}];
  const by={}, na=[];
  el.partes.forEach((p,i)=>{ const t=v2tarea(p,et,sub,rub); const T=el.ts[i]; if(!t){ na.push(T); return; } const f=t.fila||"A"; if(f==="NA"){ na.push(T); return; } (by[f]=by[f]||{fila:f,partes:[],ts:[]}); by[f].partes.push(p); by[f].ts.push(T); });

/* hojas (estados) de una fila; cada hoja apunta a la misma subtarea en todos los T de la fila */
function v2hojas(fila,et,sub,rub){
  const t0=v2tarea(fila.partes[0],et,sub,rub); if(!t0) return [];
  const subs=t0.subtareas||[];
  if(!subs.length) return [{i:"r",n:rub,sr:"",req:false,get:()=>t0.estado||"Sin realizar",meta:()=>t0,
    objs:()=>fila.partes.map(p=>v2tarea(p,et,sub,rub)).filter(Boolean)}];
  return subs.map((s,i)=>({i,n:s.nombre,sr:s.grupo||"",req:!!s.req_doc,get:()=>s.estado||"Sin realizar",meta:()=>s,

}

function FichaV2({draft,mutar,editable,user,local,filtro,adj,adjOps,orden,onInforme,vista}){
  const ref=useRef(null);
  const comCtx=React.useContext(ComCtx);
  const ui=useRef({vista:vista||"porT",excep:new Set(),modo:"normal",panel:null,verTodo:false,etTab:null,pasoSel:null,resumen:null,resTag:"",undo:null,imgPend:null});
  const props={draft,mutar,editable,user,local,filtro,adj,adjOps,comCtx,onInforme};
  const pRef=useRef(props); pRef.current=props;
  const [tick,setTick]=useState(0);
  const redraw=()=>setTick(t=>t+1);
  // v2: Combinada / Por tabique se elige en el título de la ventana del local
  if(vista && ui.current.vista!==vista){ ui.current.vista=vista; ui.current.panel=null; ui.current.pasoSel=null; }
  // órdenes desde la ventana del local: "cerrar" = todo cerrado; "abrir" = abrir ese elemento y saltar ahí sin deslizar
  useEffect(()=>{ if(!orden) return; const U=ui.current;
    if(orden.tipo==="cerrar"){ U.modo="nada"; U.excep.clear(); U.panel=null; redraw(); return; }
    if(orden.tipo==="abrirTodo"){ U.modo="todo"; U.excep.clear(); redraw(); return; }
    // abrir solo ese elemento (los demás quedan cerrados) y saltar a su título
    if(orden.tipo==="abrir"){ const oid=(orden.id==="TAB"&&U.vista==="porT"&&orden.pid)?"TAB:"+orden.pid:orden.id;
      v2elementos(pRef.current.draft.partes,U.vista).forEach(e=>v2setOpen(U,"el¦"+e.id,e.id===oid)); U.pasoSel=oid; redraw();
      setTimeout(()=>{ const r=ref.current; if(!r) return; const el=r.querySelector("#pt-"+CSS.escape(oid))||r.querySelector(".pasoh"); if(el) v2saltar(el); },30); } },[orden&&orden.n]);
  useEffect(()=>{ if(ref.current) v2render(ref.current,pRef.current,ui.current); });
  useEffect(()=>{ const el=ref.current; if(!el) return;
    const h=e=>v2click(e,pRef.current,ui.current,redraw,el); const c=e=>v2change(e,pRef.current,ui.current,redraw,el);
    const k=e=>{ if(e.key==="Escape"){ const U=ui.current; if(U.resumen){U.resumen=null;redraw();} else if(U.panel){U.panel=null;redraw();} } };
    el.addEventListener("click",h); el.addEventListener("change",c); document.addEventListener("keydown",k);
    return ()=>{ el.removeEventListener("click",h); el.removeEventListener("change",c); document.removeEventListener("keydown",k); }; },[]);
  return <div ref={ref} className="fv2"></div>;
}

function v2marcar(P,keys,v,origen){

  const U=P._U; const hojas=keys.map(k=>U.hojas[k]).filter(Boolean);
  const salt=hojas.filter(h=>v==="Terminado"&&h.req&&!P.adj.find(a=>a.tipo==="doc"&&a.item&&a.item.indexOf(" › ")>0&&a.item.split("¦")[0].endsWith((h.sr?h.sr+" · ":"")+h.n))).length;

  const isAdmin = user.rol==="admin";
  const [draft,setDraft]=useState(()=>initDraft(local,data));
  function patchParte(pid,fn){
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d)); const pt=nd.partes.find(p=>p.parte_id===pid); if(pt)fn(pt); return nd;});
    setDirty(true);
  }
  // v2: la ficha nueva cambia el borrador al instante (para poder deshacer y avisar cuántos cambió)
  const draftRef=useRef(draft); draftRef.current=draft;
  function mutar(fn){ const nd=JSON.parse(JSON.stringify(draftRef.current)); fn(nd.partes); draftRef.current=nd; setDraft(nd); setDirty(true); }
  const [adjL,adjOps]=useAdj(local.local_id);
  const [ordenV2,setOrdenV2]=useState(null);   // v2: abrir un elemento / cerrar todo en la ficha
  const modalRef=useRef(null);
  // ventana del local en la compu: letra (zoom del contenido), posición (arrastrando el título) y tamaño (esquina) — se recuerdan en este navegador
  const LZ=[0.6,0.7,0.8,0.9,1,1.1,1.25];
  // en compu/tele el "100%" de la ficha equivale al 90% anterior (se veía muy grande)
  const LZ_BASE_PC=0.9;
  const [lz,setLz]=useState(()=>{ const v=parseFloat(store.get("lvLetra")); return LZ.indexOf(v)>=0?v:1; });
  const cambiarLz=d=>setLz(v=>{ const i=LZ.indexOf(v); const n=d===0?1:LZ[Math.max(0,Math.min(LZ.length-1,i+d))]; store.set("lvLetra",String(n)); return n; });
  const posRef=useRef({x:0,y:0});
  useEffect(()=>{ const m=modalRef.current; if(!m) return;
    if(embebido||!window.matchMedia("(min-width:900px) and (pointer:fine)").matches) return;
    m.classList.add("lv-mov");
    try{ const t=JSON.parse(store.get("lvTam")||"null"); if(t&&t.w>300&&t.h>200){ m.style.width=Math.min(t.w,innerWidth*0.96)+"px"; m.style.height=Math.min(t.h,innerHeight*0.96)+"px"; m.style.maxHeight="none"; } }catch(e){}
    const hd=m.querySelector(".mhead"); let ini=null;
    const mover=e=>{ if(!ini) return; const z=(parseFloat(getComputedStyle(m.closest(".app")||m).zoom))||1;
      posRef.current={x:ini.x+(e.clientX-ini.cx)/z,y:ini.y+(e.clientY-ini.cy)/z}; m.style.transform="translate("+posRef.current.x+"px,"+posRef.current.y+"px)"; };
    const soltar=()=>{ ini=null; document.removeEventListener("mousemove",mover); document.removeEventListener("mouseup",soltar); document.body.style.userSelect=""; };
    const bajar=e=>{ if(e.button!==0||e.target.closest("button,a,input,select,textarea,.lfiltro")) return; e.preventDefault();
      ini={cx:e.clientX,cy:e.clientY,x:posRef.current.x,y:posRef.current.y}; document.body.style.userSelect="none";
      document.addEventListener("mousemove",mover); document.addEventListener("mouseup",soltar); };
    hd&&hd.addEventListener("mousedown",bajar);
    const fijarTop=()=>{ const z=parseFloat(getComputedStyle(m).getPropertyValue("--lz"))||1; m.style.setProperty("--lvtop",((hd?hd.offsetHeight:0)/z+8)+"px"); };
    const roH=new ResizeObserver(fijarTop); hd&&roH.observe(hd); fijarTop(); m.__fijarTop=fijarTop;
    // al soltar la esquina de cambiar tamaño, se guarda
    let tm=null; const ro=new ResizeObserver(()=>{ clearTimeout(tm); tm=setTimeout(()=>{ if(m.style.width) store.set("lvTam",JSON.stringify({w:m.offsetWidth,h:m.offsetHeight})); },400); });
    ro.observe(m);
    return ()=>{ hd&&hd.removeEventListener("mousedown",bajar); soltar(); ro.disconnect(); roH.disconnect(); clearTimeout(tm); }; },[]);
  useEffect(()=>{ const m=modalRef.current; m&&m.__fijarTop&&m.__fijarTop(); },[lz]);
  const [customR,setCustomR]=useState({});           // id -> nombre (tareas nuevas)
  const [newTask,setNewTask]=useState({});            // parte_id -> texto del input
  const [openCom,setOpenCom]=useState({});            // "parte|rid" -> bool (nota abierta)
  const [openP,setOpenP]=useState(()=>initialParte?{[initialParte]:true}:{}); // parte_id -> abierto (acordeón elementos)
  const [edit,setEdit]=useState(false);               // modo editar (admin)
  // rev22: el filtro general también se aplica acá; "Ver todo" lo saca solo dentro de este local.
  // (si se entra desde 🔎 Filtros o a un elemento que no entra en el filtro, arranca viendo todo)
  // v2 celular: el plano del local se muestra con "Ver plano" (abajo, junto a Guardar) y queda fijo arriba de la ficha
  const esCelL=MATRIZ_V2&&!embebido&&!window.matchMedia("(min-width:1100px) and (orientation:landscape)").matches;   // celular y tablet parada
  const [verPlanCel,setVerPlanCel]=useState(false);
  // alto del título de la ficha → para que lo que queda fijo debajo (plano del local, elemento) no quede tapado
  useEffect(()=>{ if(!MATRIZ_V2) return; document.querySelectorAll(".modal.local").forEach(m=>{ const h=m.querySelector(":scope>.mhead")||m.querySelector(".mhead"); const z=parseFloat(getComputedStyle(m).getPropertyValue("--lz"))||1;   // el cuerpo de la ficha tiene zoom (A− / A+)
    if(h) m.style.setProperty("--mhh",(h.offsetHeight/z)+"px");
    const lp=m.querySelector(".lv-plan.celfijo"); m.style.setProperty("--lph",(lp?lp.offsetHeight:0)+"px");
    const ph=m.querySelector(".fv2 .parte.abierta>.ph"); if(ph) m.style.setProperty("--phh",ph.offsetHeight+"px"); }); });
  const [vistaT,setVistaT]=useState(()=>{ try{ return localStorage.getItem("v2vistaTab2")||"porT"; }catch(e){ return "porT"; } });
  const elegirVista=v=>{ setVistaT(v); try{ localStorage.setItem("v2vistaTab2",v); }catch(e){} };
  const [verTodo,setVerTodo]=useState(()=>!!foco || (filtroActivo(filtro) && !localEnFiltro(local,filtro)) || !!(initialParte && filtroActivo(filtro) &&
    (local.partes||[]).some(p=>p.parte_id===initialParte && hojasFiltradas(p,filtro)===null)));
  const fgL = (filtroActivo(filtro) && !verTodo && !edit) ? filtro : null;
  const [nuevoTipo,setNuevoTipo]=useState("TABIQUE");
  const [dirty,setDirty]=useState(false);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  const [askClose,setAskClose]=useState(false);
  // clon: borrador automático — lo que se cambia sin tocar "Guardar cambios" queda en el navegador y se recupera al volver a abrir el local
  // (por ejemplo si la página se recarga); se borra al guardar o al elegir "Cerrar sin guardar"
  const borrK="borr:"+local.local_id, borrOk=useRef(false);
  // app real: igual, en el celular; solo se recupera si el local no cambió desde otro lado mientras tanto (para no pisar cambios de otros)
  const borrBase=useMemo(()=>{ const t=JSON.stringify(local.partes||[]); let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))|0; return h+":"+t.length; },[local]);
  const borrLS={ get:()=>{ try{ return Promise.resolve(JSON.parse(store.get("av_"+borrK)||"null")); }catch(e){ return Promise.resolve(null); } },
    set:v=>store.set("av_"+borrK,JSON.stringify(v)), del:()=>store.del("av_"+borrK) };
  useEffect(()=>{ if(!CLON&&!MATRIZ_V2) return; (CLON?clonDB.get(borrK):borrLS.get()).then(b=>{ borrOk.current=true;
    if(!b||!b.draft||b.draft.local_id!==local.local_id) return;
    if(!CLON&&(b.email!==(user&&user.email)||b.base!==borrBase)){ borrLS.del();
      if(b.email===(user&&user.email)) setMsg("Había cambios sin guardar de este local ("+b.cuando+"), pero el local se modificó desde otro lado y no se recuperaron."); return; }
    setDraft(b.draft); draftRef.current=b.draft; setDirty(true); setMsg("Se recuperaron cambios que no estaban guardados ("+b.cuando+"). Tocá Guardar cambios para dejarlos."); }); },[]);
  const borrT=useRef(null);
  // al pasar a otra app el celular puede cerrar la pestaña: se guarda el borrador en ese momento, sin esperar
  const borrYa=useRef(null); borrYa.current=()=>{ if(CLON||!MATRIZ_V2||!borrOk.current||!dirty) return; clearTimeout(borrT.current); borrLS.set({draft,cuando:v2ahora(),base:borrBase,email:user&&user.email}); };
  useEffect(()=>{ const h=()=>{ if(document.visibilityState==="hidden") borrYa.current(); }, h2=()=>borrYa.current();
    document.addEventListener("visibilitychange",h); window.addEventListener("pagehide",h2);
    return ()=>{ document.removeEventListener("visibilitychange",h); window.removeEventListener("pagehide",h2); }; },[]);
  useEffect(()=>{ if((!CLON&&!MATRIZ_V2)||!borrOk.current) return; clearTimeout(borrT.current);
    if(!dirty){ if(CLON) clonDB.del(borrK); else borrLS.del(); return; }
    borrT.current=setTimeout(()=>{ if(CLON) clonDB.set(borrK,{draft,cuando:v2ahora()}); else borrLS.set({draft,cuando:v2ahora(),base:borrBase,email:user&&user.email}); },500); },[draft,dirty]);
  // rev11: comentarios (se refrescan al abrir el local para ver lo que comentaron otros)
  const comCtx=React.useContext(ComCtx);
  useEffect(()=>{ if(comCtx) comCtx.refrescar(local.local_id); },[local.local_id]);
  // rev10: mini-plano (tamaño real de la imagen del plano para recortar bien)
  const area=(data.areas||[]).find(a=>a.modulo===local.modulo&&a.nivel===local.nivel);
  const [lpZoom,setLpZoom]=useState(0.40);
  const [lpCentro,setLpCentro]=useState(null);   // rev19: centro del recorte (% del plano)
  const [dims,setDims]=useState(null);
  // rev19: al cargar el plano, el recorte se ajusta JUSTO a las partes ubicadas del local (tabiques,
  // solado, cielorraso) y se centra en ellas. Sin partes ubicadas: zoom 0.40 centrado en el local.
  // (en rev14 este cálculo no corría porque `dims` se declaraba después del useEffect)
  useEffect(()=>{ if(!dims||local.plano_x==null||local.plano_y==null) return;
    const pts=(local.partes||[]).filter(p=>p.plano_x!=null&&p.plano_y!=null)
      .map(p=>({x:p.plano_x/100*dims.w, y:p.plano_y/100*dims.h}));
    if(!pts.length){ setLpCentro(null); setLpZoom(0.40); return; }
    const xs=pts.map(p=>p.x), ys=pts.map(p=>p.y);
    const x0=Math.min(...xs), x1=Math.max(...xs), y0=Math.min(...ys), y1=Math.max(...ys);
    const minW=dims.w*0.10;                               // no acercar más que 10% del ancho del plano
    let necW=Math.max((x1-x0)*1.35, (y1-y0)*1.35/0.62, minW); // 0.62 = alto/ancho del recorte
    necW+=necW*0.08;                                      // margen para que los círculos no queden cortados
    setLpCentro({x:(x0+x1)/2/dims.w*100, y:(y0+y1)/2/dims.h*100});
    setLpZoom(Math.min(1, +(necW/dims.w).toFixed(3)));
  },[dims]);
  useEffect(()=>{ if(!area||!area.plano_url) return; const im=new Image();
    im.onload=()=>setDims({w:im.naturalWidth||1000,h:im.naturalHeight||1000}); im.src=area.plano_url; },[area&&area.plano_url]);
  // v2: va directo al elemento (sin deslizar, que marea) y lo resalta un momento
  function abrirParte(pid){ if(MATRIZ_V2&&!edit){ const p=draft.partes.find(x=>x.parte_id===pid); const id=p&&p.tipo==="TABIQUE"?"TAB":pid;
      setOrdenV2(o=>({tipo:"abrir",id,pid,n:((o&&o.n)||0)+1})); return; }
    setOpenP(o=>({...o,[pid]:true}));
    setTimeout(()=>{const el=document.getElementById("pt-"+pid); if(el) (MATRIZ_V2?v2saltar(el):el.scrollIntoView({behavior:"smooth",block:"start"}));},50); }
  // v2: informe de etapa de un elemento, desde el local (con lo guardado: si hay cambios sin guardar, pide guardar antes)
  async function generarInforme(elId,et){
    if(elId==="TAB"&&!dirty){ // elegir los tabiques
      const l0={...local,partes:draft.partes}; const st=rpEstadoLocal(l0,et).find(x=>x.el.id==="TAB"); if(!st) return;
      const reg=await rpCargarReg(); const m=rpTabsInformados(reg,local.local_id,et);
      const tabs=await v2ElegirTabs(st.tsEst||[],m); if(!tabs) return;
      const el=v2elementos(draft.partes).find(x=>x.id==="TAB");
      // solo los comentarios de los tabiques elegidos (no los de otros tabiques del local)
      const tNom=pid=>{ const pp=draft.partes.find(x=>x.parte_id===pid); return pp?"T"+(pp.indice||"?"):pid; };
      const comsT=await v2RevisarComsInsp({coms:(comCtx&&comCtx.coms)||[],ids:tabs,et,elNom:"Tabiques "+tabs.map(tNom).join(", "),puedeCerrar:c=>comCtx.puedeCerrar(c)}); if(!comsT) return;
      const fAhora=await v2PedirFirma(user,1); if(fAhora===undefined) return;
      setMsg("Generando inspección…");
      try{ const r=await rpGenerarVarios({items:[{l:l0,el,tabs}],et,data,user,cfg:rpCfg(),coms:comsT,firmaAhora:fAhora});
        setMsg("Inspección "+r[0].rec.num+" ("+r[0].rec.ts.join(", ")+") generada ✓ · queda en 🧾 Inspecciones › Generados"); }
      catch(e){ setMsg("Error: "+(e.message||e)); } return; }
    if(dirty){ setMsg("Guardá los cambios antes de generar la inspección."); return; }
    const l={...local,partes:draft.partes}; const el=v2elementos(draft.partes).find(x=>x.id===elId); if(!el) return;
    const comsI=await v2RevisarComsInsp({coms:(comCtx&&comCtx.coms)||[],ids:el.partes.map(p=>p.parte_id),et,elNom:el.nom||elId,puedeCerrar:c=>comCtx.puedeCerrar(c)}); if(!comsI) return;
    const fAhora=await v2PedirFirma(user,1); if(fAhora===undefined) return;   // canceló la firma
    setMsg("Generando inspección…");
    try{ const r=await rpGenerarVarios({items:[{l,el}],et,data,user,cfg:rpCfg(),coms:comsI,firmaAhora:fAhora});
      setMsg("Inspección "+r[0].rec.num+" generada ✓ · queda en 🧾 Inspecciones › Generados"); }
    catch(e){ setMsg("Error: "+(e.message||e)); } }
  function irArriba(){ if(modalRef.current) modalRef.current.scrollTop=0; }
  const [todoCerrado,setTodoCerrado]=useState(false);   // v2: el botón alterna Cerrar todo / Abrir todo
  function cerrarTodo(){ setOpenP({}); setOrdenV2(o=>({tipo:"cerrar",n:((o&&o.n)||0)+1})); setTodoCerrado(true); irArriba(); }
  function abrirTodo(){ setOrdenV2(o=>({tipo:"abrirTodo",n:((o&&o.n)||0)+1})); setTodoCerrado(false); }
  // rev20: la misma pregunta "¿Guardar cambios?" sirve para cerrar o para pasar a otro local
  const accionRef=useRef(onClose);
  const [accionTxt,setAccionTxt]=useState("");   // "" = cerrar · "anterior"/"siguiente" = navegar
  // pantalla dividida: tocar otro local en el plano o en la lista pasa por acá (pregunta si hay cambios sin guardar)
  if(embebido) window.__lvIr=(l,pid)=>tryClose(()=>onIr(l,pid),"local "+l.numero);
  if(embebido) window.__lvSalir=fn=>tryClose(fn,"");   // v2: cambiar de módulo deslizando el plano (pregunta si hay cambios sin guardar)
  function tryClose(accion,txt){ const a=accion||onClose;
    if(dirty && !saving){ accionRef.current=a; setAccionTxt(txt?txt+" local":""); setAskClose(true); } else { a(); } }
  // rev9: si falla, el cartel queda abierto mostrando el error (antes se cerraba sin avisar)
  async function guardarYcerrar(){ const res=await guardar(); if(res&&res.ok){ accionRef.current(); } }

  const rubrosById = useMemo(()=>Object.fromEntries((data.rubros||[]).map(r=>[r.id,r])),[data]);
  const nombreDe = (rid)=> customR[rid] || (rubrosById[rid]||{}).nombre || rid;

  function addParte(tipo){
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      let idx="";
      if(tipo==="TABIQUE"){ const ns=nd.partes.filter(p=>p.tipo==="TABIQUE").map(p=>+p.indice||0);
        idx=(ns.length?Math.max.apply(null,ns):0)+1; }
      const etq = tipo==="TABIQUE"?("TABIQUE "+idx):tipo;
      const pid = nd.local_id+"::"+tipo.slice(0,3)+(idx||"")+"_"+Date.now().toString(36);
      const nuevo={parte_id:pid,tipo,indice:idx,etiqueta:etq,tipologia:"",comentarios:"",
        plano_x:null,plano_y:null,fases:buildFases(plantillaDe(data,tipo),pid)};
      normalizeParte(nuevo);
      nd.partes.push(nuevo);
      return nd;});
    setDirty(true);
  }
  function removeParte(pid){
    setDraft(d=>({...d,partes:d.partes.filter(p=>p.parte_id!==pid)}));
    setDirty(true);
  }

  function setEstado(parte_id,rid,valor){
    if(!editable) return;
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      const pt=nd.partes.find(x=>x.parte_id===parte_id); pt.avance[rid]=valor; return nd;});
    setDirty(true);
  }
  function setComTarea(parte_id,rid,texto){
    if(!editable) return;
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      const pt=nd.partes.find(x=>x.parte_id===parte_id);
      pt.com_tareas=pt.com_tareas||{}; pt.com_tareas[rid]=texto; return nd;});
    setDirty(true);
  }
  function setParteCampo(parte_id,campo,valor){
    if(!editable) return;
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      const pt=nd.partes.find(x=>x.parte_id===parte_id); pt[campo]=valor; return nd;});
    setDirty(true);
  }
  function quitarTarea(parte_id,rid){
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      const pt=nd.partes.find(x=>x.parte_id===parte_id);
      pt.tareas=pt.tareas.filter(r=>r!==rid); delete pt.avance[rid]; return nd;});
    setDirty(true);
  }
  function agregarTarea(parte_id){
    const nombre=(newTask[parte_id]||"").trim();
    if(!nombre) return;
    // ¿coincide con una tarea del catálogo?
    let rid=(data.rubros||[]).find(r=>r.nombre.toLowerCase()===nombre.toLowerCase());
    rid=rid?rid.id:null;
    if(!rid){ // tarea nueva (personalizada)
      rid="cst_"+nombre.toLowerCase().replace(/[^a-z0-9]+/g,"_")+"_"+Date.now().toString(36);
      setCustomR(c=>({...c,[rid]:nombre}));
    }
    setDraft(d=>{const nd=JSON.parse(JSON.stringify(d));
      const pt=nd.partes.find(x=>x.parte_id===parte_id);
      if(!pt.tareas.includes(rid)){ pt.tareas.push(rid); pt.avance[rid]="Sin realizar"; }
      return nd;});
    setNewTask(t=>({...t,[parte_id]:""})); setDirty(true);
  }
  async function guardar(){
    setSaving(true); setMsg("");
    const partes=[], cambios=[];
    const origIds=new Set(local.partes.map(p=>p.parte_id));
    const draftIds=new Set(draft.partes.map(p=>p.parte_id));
    const borrar=local.partes.filter(p=>!draftIds.has(p.parte_id)).map(p=>p.parte_id);
    borrar.forEach(pid=>cambios.push({tipo:'baja_parte',parte_id:pid,item:'',campo:'',anterior:'',nuevo:''}));

    draft.partes.forEach(pt=>{
      const orig=local.partes.find(x=>x.parte_id===pt.parte_id);
      const origFases = orig ? (orig.fases||buildFases(plantillaDe(data,pt.tipo),pt.parte_id)) : null;
      const nuevo = !orig;
      const dcam = orig ? diffFases(origFases, pt.fases, pt.parte_id) : [];
      const comCambio = (pt.comentarios||"") !== ((orig&&orig.comentarios)||"");
      const estructuraCambio = orig ? (JSON.stringify(origFases)!==JSON.stringify(pt.fases)) : true;
      if(nuevo || estructuraCambio || dcam.length || comCambio){
        partes.push({parte_id:pt.parte_id,tipo:pt.tipo,indice:pt.indice,etiqueta:pt.etiqueta,
          tipologia:pt.tipologia||"",plano_x:pt.plano_x,plano_y:pt.plano_y,comentarios:pt.comentarios||"",fases:pt.fases});
        if(nuevo) cambios.push({tipo:'alta_parte',parte_id:pt.parte_id,item:pt.etiqueta,campo:'',anterior:'',nuevo:pt.tipo});
        dcam.forEach(c=>cambios.push(c));
        if(comCambio) cambios.push({tipo:'comentario',parte_id:pt.parte_id,item:'(elemento)',campo:'comentario general',anterior:(orig&&orig.comentarios)||'',nuevo:pt.comentarios||''});
      }
    });
    const res=await apiPost({action:"guardar",email:user.email,local_id:local.local_id,
                             partes,borrar,cambios});
    setSaving(false);
    if(res.ok){ setMsg("Guardado ✓"); setDirty(false); onSaved(draft); }
    else setMsg("Error: "+errorGuardado(res.error));
    return res;
  }
  useEffect(()=>{ if(initialParte && !foco){ if(MATRIZ_V2){ abrirParte(initialParte); return; } const el=document.getElementById("pt-"+initialParte);
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); } },[initialParte]);
  const orderTipo={SOLADO:0,TABIQUE:1,CIELORRASO:2};
  const partes=[...draft.partes].sort((a,b)=>(orderTipo[a.tipo]-orderTipo[b.tipo])||((a.indice||0)-(b.indice||0)));

  return (
    <div className={embebido?"lv-embed":"overlay ov-local"} onClick={e=>{if(!embebido&&e.target===e.currentTarget)tryClose()}}>
      <div className={"modal local"+(embebido?" embed":"")} ref={modalRef} style={{"--lz":lz*(esCelL?1:LZ_BASE_PC)}}>
        {askClose && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setAskClose(false)}}>
            <div className="modal" style={{maxWidth:380,width:"90%"}}>
              <div className="mhead"><div><h2>¿Guardar cambios?</h2>
                <div style={{fontSize:12,opacity:.85}}>Tenés cambios sin guardar en este local.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>

function parteResumen(pt,aplicables){
  let t=0,d=0; aplicables.forEach(r=>{const e=pt.avance[r]||"Sin realizar"; if(PESO[e]===null)return; t++; d+=PESO[e];});
  return t? Math.round(100*d/t)+"%":"—";
}

/* ================== Cambiar contraseña ================== */
function CambiarPwd({onClose}){
  const [p1,setP1]=useState(""); const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(""); const [saving,setSaving]=useState(false);
  async function guardar(){
    if(p1.length<6){ setMsg("La contraseña debe tener al menos 6 caracteres."); return; }
    if(p1!==p2){ setMsg("Las contraseñas no coinciden."); return; }
    setSaving(true); setMsg("");
    const sb=getSB();
    const {error}=await sb.auth.updateUser({password:p1});
    setSaving(false);
    if(error){ setMsg("Error: "+error.message); }
    else { setMsg("✓ Contraseña actualizada."); setTimeout(onClose,1200); }
  }
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")onClose()}}>
      <div className="modal" style={{maxWidth:400}}>
        <div className="mhead"><div><h2 style={{fontSize:17}}>Cambiar contraseña</h2></div>
          <button className="x" onClick={onClose}>×</button></div>
        <div className="mbody">
          <input className="pwinp" type="password" placeholder="Nueva contraseña" value={p1}
                 onChange={e=>setP1(e.target.value)} autoFocus/>
          <input className="pwinp" type="password" placeholder="Repetir contraseña" value={p2}
                 onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/>
          <button className="btn primary" style={{width:"100%",padding:11}} disabled={saving} onClick={guardar}>
            {saving?"Guardando…":"Guardar contraseña"}</button>
          {msg && <div style={{marginTop:10,fontSize:13,fontWeight:600,
            color:msg.startsWith("✓")?"#166534":"#b91c1c"}}>{msg}</div>}
        </div>
      </div>
    </div>
  );
}
