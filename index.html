<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Avance de Obra</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231f3a5f'/%3E%3Crect x='14' y='34' width='8' height='16' rx='2' fill='%23ffffff'/%3E%3Crect x='28' y='26' width='8' height='24' rx='2' fill='%23ffffff'/%3E%3Crect x='42' y='16' width='8' height='34' rx='2' fill='%2316a34a'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#0f172a; --panel:#ffffff; --ink:#1e293b; --muted:#64748b; --line:#e8edf3;
    --brand:#1e3a5f; --brand2:#2c5282;
    --term:#15a34a; --inic:#f59e0b; --sin:#e11d48; --na:#94a3b8;
    --shadow:0 1px 2px rgba(15,23,42,.04), 0 6px 20px rgba(15,23,42,.07);
    --shadow-sm:0 1px 3px rgba(15,23,42,.08);
    --radius:14px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#eef2f7;color:var(--ink);-webkit-text-size-adjust:100%}
  button{font-family:inherit;cursor:pointer}
  .app{max-width:1200px;margin:0 auto;padding:0 14px 60px}
  /* Header */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;
    margin:0 -14px 16px;padding:14px 18px;box-shadow:0 2px 14px rgba(15,23,42,.18)}
  .top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .top .sub{font-size:12px;opacity:.8;margin-top:2px}
  .spacer{flex:1}
  .userbox{font-size:12.5px;text-align:right;line-height:1.3}
  .userbox b{display:block;font-size:13px}
  .btn{border:0;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;background:#fff;color:var(--brand)}
  .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* global progress */
  .globalbar{display:flex;align-items:center;gap:12px;margin:6px 0 0}
  .globalbar .track{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .globalbar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80)}
  /* area selector */
  .areabar{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:12px}
  .areagrp{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .areagrp .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-right:2px}
  .achip{position:relative;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700}
  .achip.wide{padding:7px 14px}
  .achip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .achip .cbadge{display:inline-block;margin-left:7px;background:#e2e8f0;color:#334155;border-radius:99px;font-size:10.5px;font-weight:800;padding:1px 6px}
  .achip.on .cbadge{background:rgba(255,255,255,.25);color:#fff}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px}
  .tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* Plano */
  .planowrap{position:relative;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .planowrap .inner{position:relative;width:100%}
  .planowrap img{display:block;width:100%;height:auto;user-select:none}
  .noplano{padding:40px 20px;text-align:center;color:var(--muted)}
  .marker{position:absolute;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;
    border:2.5px solid #fff;box-shadow:0 0 0 2.5px #0f172a, 0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s}
  .marker:hover{transform:translate(-50%,-50%) scale(1.15);z-index:5}
  .marker.dim{opacity:.35}
  .pmarker{position:absolute;transform:translate(-50%,-50%);min-width:22px;height:22px;padding:0 5px;border-radius:11px;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:800;color:#fff;z-index:4}
  .pmarker.sel{outline:3px solid #2c5282;outline-offset:1px}
  .pmarker.dim{opacity:.3}
  .pmarker{cursor:pointer;transition:transform .1s}
  .pmarker:hover{transform:translate(-50%,-50%) scale(1.18);z-index:6}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px;font-size:12.5px;color:var(--muted)}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  /* Grid list */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;cursor:pointer;border:1px solid #eef2f7;transition:.14s}
  .card:hover{border-color:var(--brand2);transform:translateY(-2px)}
  .card .name-lg{font-size:17px;font-weight:800;color:var(--brand);line-height:1.15}
  .card .num-sm{font-size:12px;color:var(--muted);margin-bottom:8px;margin-top:2px}
  .track{height:8px;background:#eef2f7;border-radius:99px;overflow:hidden}
  .track .fill{height:100%}
  .pctlbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
  .badge{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;margin-top:8px}
  .badge.hab{background:#dcfce7;color:#166534}
  .badge.nohab{background:#fee2e2;color:#991b1b}
  /* Modal */
  .overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
  @media(min-width:720px){.overlay{align-items:center}}
  .modal{background:#f8fafc;width:100%;max-width:760px;max-height:92vh;border-radius:16px 16px 0 0;overflow:auto;box-shadow:var(--shadow)}
  @media(min-width:720px){.modal{border-radius:16px}}
  .modal .mhead{position:sticky;top:0;background:var(--brand);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:12px;z-index:2}
  .modal .mhead h2{margin:0;font-size:18px}
  .modal .mhead .x{margin-left:auto;background:rgba(255,255,255,.18);border:0;color:#fff;width:32px;height:32px;border-radius:8px;font-size:18px}
  .mbody{padding:14px 16px 24px}
  .localplan{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(15,23,42,.06);margin-bottom:12px;overflow:hidden}
  .localplan .lp-head{display:flex;align-items:center;padding:10px 14px;background:#f1f5f9;border-bottom:1px solid var(--line);font-size:14px}
  .localplan .lp-head .lp-zoom{margin-left:auto;display:inline-flex;gap:6px}
  .lp-svgwrap{width:100%;background:#fbfcfe;max-height:340px;overflow:hidden}
  .lp-svgwrap svg{width:100%;height:100%}
  .lp-note{padding:18px 16px;color:var(--muted);font-size:12.5px;background:#fbfcfe}
  .lp-cal{display:flex;gap:12px;align-items:center;padding:8px 14px;font-size:12px;color:#8a5a00;background:#fef3c7;border-top:1px solid var(--line)}
  .lp-cal .lp-pend{margin-left:auto;font-weight:700;color:#b45309}
  .addparte{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#eef4fb;border:1px solid #cfe0f5;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px}
  .addparte select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
  .addparte .hint{color:var(--muted);font-size:11.5px}
  .btn.danger{background:#fee2e2;color:#b91c1c}
  .parte.calsel{outline:2px solid #2c5282;outline-offset:-2px}
  .parte{background:#fff;border-radius:12px;box-shadow:0 1px 4px rgba(15,23,42,.06);margin-bottom:12px;overflow:hidden}
  .parte .ph{display:flex;align-items:center;gap:10px;padding:11px 14px;background:#f1f5f9;border-bottom:1px solid var(--line)}
  .parte:not(.abierta) .ph{border-bottom:0}
  .ph.clickable{cursor:pointer}
  .ph.clickable:hover{background:#e8eef6}
  .ph .twist{font-size:12px;color:var(--muted);width:14px}
  .parte .ph .t{font-weight:700;font-size:14px}
  .parte .ph .tip{font-size:11.5px;color:var(--muted)}
  .parte .ph .mini{margin-left:auto;font-size:11px;color:var(--muted)}
  .parte .ph .ptasks{margin-left:10px;display:inline-flex;gap:6px}
  .parte.editing{outline:2px solid #fcd34d;outline-offset:-2px}
  .parte.editing .ph{background:#fef7e6}
  .taskhint{font-size:12px;color:#8a5a00;background:#fef3c7;padding:7px 14px;border-bottom:1px solid var(--line)}
  .rubros{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;padding:12px 14px}
  .rubro{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:12.5px;display:flex;flex-direction:column;gap:6px}
  .rubro .rn{font-weight:600;color:var(--ink);font-size:12px;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .rubro .rn-txt{flex:1}
  .rubro .rn-act{display:inline-flex;gap:4px;align-items:center}
  .rubro .notebtn{border:0;background:transparent;font-size:12px;cursor:pointer;opacity:.4;padding:0;line-height:1;filter:grayscale(1)}
  .rubro .notebtn.has{opacity:1;filter:none}
  .estado-sel{width:100%;border:0;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:700;color:#fff;text-align:center;letter-spacing:.2px;cursor:pointer;-webkit-appearance:none;appearance:none;text-align-last:center}
  .estado-sel:disabled{cursor:default;opacity:.92}
  .estado-sel[data-e="Terminado"]{background:var(--term)}
  .estado-sel[data-e="Iniciado"]{background:var(--inic)}
  .estado-sel[data-e="Sin realizar"]{background:var(--sin)}
  .estado-sel[data-e="No aplica"]{background:var(--na)}
  .estado-sel option{background:#fff;color:var(--ink);font-weight:600}
  .nota-inp{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:11.5px;font-family:inherit;background:#fffef5}
  /* fases / tareas / subtareas */
  .fases{padding:6px 12px 4px}
  .fase{border:1px solid var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
  .fase-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#eef2f7;font-weight:800;font-size:13px;color:var(--brand);cursor:pointer}
  .fase-h:hover{background:#e4ebf4}
  .fase-h .fase-n{flex:1}
  .fase-h .twist{font-size:12px;color:var(--brand)}
  .tarea-row.clickable{cursor:pointer}
  .tarea-row.clickable:hover{background:#f8fafc}
  .addtarea.sub{margin-left:0}
  .addtarea.addfase{margin:8px 12px 10px}
  .fase-pct{font-size:12.5px;font-weight:800}
  .grupo{padding:4px 10px 8px}
  .grupo-n{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);margin:8px 2px 4px}
  .tarea{border-bottom:1px solid #f1f5f9;padding:3px 0}
  .tarea-row{display:flex;align-items:center;gap:8px}
  .tarea .twist{border:0;background:transparent;font-size:12px;color:var(--muted);cursor:pointer;width:16px;padding:0}
  .tarea .twist.no{cursor:default;color:#cbd5e1}
  .tarea-n{flex:1;font-size:12.5px;font-weight:600;color:var(--ink)}
  .tarea-n .subc{font-weight:600;color:var(--muted);font-size:11px}
  .estado-sel{min-width:118px;width:auto}
  .estado-sel.ro{display:inline-flex;align-items:center;justify-content:center;min-width:118px}
  .estado-sel.sm{min-width:110px;font-size:11px;padding:4px 6px}
  .subtareas{margin:4px 0 8px 24px;border-left:2px solid #e2e8f0;padding-left:10px}
  .sub{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:3px 0}
  .sub-n{flex:1;font-size:11.5px;color:#334155}
  .sub-n em{color:var(--muted);font-style:normal;font-weight:700}
  .addtarea{display:flex;gap:8px;margin:6px 2px 2px}
  .addtarea input{flex:1;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12px;font-family:inherit}
  .hito{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fbfcfe;border-top:1px solid var(--line);font-size:12.5px;font-weight:700}
  .hito-n{flex:1;color:var(--ink)}
  .hito button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:800}
  .hito button.on-si{background:var(--term);color:#fff;border-color:var(--term)}
  .hito button.on-no{background:var(--sin);color:#fff;border-color:var(--sin)}
  .rubro .rmtask{border:0;background:#fee2e2;color:#b91c1c;border-radius:6px;width:18px;height:18px;font-size:11px;font-weight:800;cursor:pointer;line-height:1;padding:0}
  .rubro.addtask{border-style:dashed;border-color:#94a3b8;justify-content:center}
  .rubro.addtask input{border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;font-family:inherit;width:100%}
  .estado{border:0;border-radius:7px;padding:6px 8px;font-size:12px;font-weight:700;color:#fff;text-align:center;letter-spacing:.2px}
  .estado[data-e="Terminado"]{background:var(--term)}
  .estado[data-e="Iniciado"]{background:var(--inic)}
  .estado[data-e="Sin realizar"]{background:var(--sin)}
  .estado[data-e="No aplica"]{background:var(--na)}
  .estado.ro{cursor:default;opacity:.92}
  .pfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 14px;border-top:1px solid var(--line);background:#fbfcfe}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600}
  .toggle button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 10px;font-size:11.5px;font-weight:700}
  .toggle button.on-si{background:var(--term);color:#fff;border-color:var(--term)}
  .toggle button.on-no{background:var(--sin);color:#fff;border-color:var(--sin)}
  /* rev5: gates (permite continuar / verificación final) y editor de rubros per-local */
  .gate{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#fbfcfe;border-top:1px solid var(--line);font-size:12.5px;font-weight:700}
  .gate.pp{background:#fff7ed;border-top:1px dashed #fdba74}
  .gate-n{color:var(--ink);margin-right:2px}
  .gate button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 12px;font-size:12px;font-weight:800}
  .gate button.on-si{background:var(--term);color:#fff;border-color:var(--term)}
  .gate button.on-no{background:var(--sin);color:#fff;border-color:var(--sin)}
  .gatehint{font-size:11px;color:#b45309;font-weight:600;margin-left:6px}
  .lockchip{margin-left:6px;font-size:12px}
  .perlocalbar{border-top:1px solid var(--line);background:#f8fafc}
  .addrubro{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px}
  .addrubro b{font-size:12.5px}
  .addrubro select{border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:12.5px;font-family:inherit}
  .addrubro .hint{font-size:11px;color:var(--muted)}
  .comlbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;margin:4px 14px 0}
  .coment{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;font-family:inherit;margin:4px 14px 12px;width:calc(100% - 28px);resize:vertical}
  .savebar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;align-items:center}
  .savebar .msg{font-size:12.5px;color:var(--muted)}
  .btn.primary{background:var(--brand);color:#fff}
  .btn.primary:disabled{opacity:.4}
  .rochip{font-size:11px;font-weight:700;color:#92400e;background:#fef3c7;padding:4px 9px;border-radius:99px}
  /* Login */
  .login{max-width:380px;margin:8vh auto;background:#fff;border-radius:16px;box-shadow:var(--shadow);padding:28px}
  .login h1{font-size:20px;margin:0 0 4px;color:var(--brand)}
  .login p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .login input{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;margin-bottom:12px}
  .pwinp{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:14px;margin-bottom:10px;font-family:inherit}
  .utab{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
  .utab th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.3px;color:var(--muted);padding:6px 8px;border-bottom:2px solid var(--line)}
  .utab td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
  .utab .uemail{font-weight:600;color:var(--ink)}
  .ucell{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 8px;font-size:12.5px;font-family:inherit}
  .ucell:disabled{background:#f1f5f9;color:#94a3b8}
  .login .btn.primary{width:100%;padding:12px}
  .err{background:#fee2e2;color:#991b1b;border-radius:9px;padding:10px 12px;font-size:12.5px;margin-bottom:12px}
  .calibbar{background:#fef3c7;border:1px solid #fcd34d;border-radius:10px;padding:10px 14px;margin-bottom:12px;font-size:13px;display:flex;flex-direction:column;align-items:stretch;gap:0}
  .calibrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .calibrow.chips{margin-top:8px;padding-top:8px;border-top:1px dashed #fcd34d}
  .calibrow .lbl{font-size:11px;font-weight:800;text-transform:uppercase;color:#8a5a00}
  .calibrow .chip{border:1px solid #e2c98a;background:#fff;color:#7a5200;border-radius:8px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer}
  .calibrow .chip.on{background:#1f3a5f;color:#fff;border-color:#1f3a5f}
  .calibrow .chip.pend{border-style:dashed;opacity:.85}
  .calibrow .calhint{font-size:11.5px;color:#8a5a00}
  .loading{padding:60px;text-align:center;color:var(--muted)}
  .foot{margin-top:26px;text-align:center;color:#94a3b8;font-size:11.5px}
  /* toggle "cómo ver" el plano */
  .verbar{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
  .verbar .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted)}
  .vchip{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:6px 12px;font-size:12.5px;font-weight:700}
  .vchip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* handle de arrastre (matriz) */
  .draghandle{cursor:grab;color:#94a3b8;font-size:15px;line-height:1;user-select:none;padding:0 2px;flex:0 0 auto}
  .draghandle:active{cursor:grabbing}
  .draghandle:hover{color:var(--brand)}
  /* buscador (modo botones) */
  .buscador{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:11px;
    box-shadow:var(--shadow-sm);padding:7px 12px;margin-bottom:12px}
  .buscador .bicon{font-size:14px;opacity:.6}
  .buscador input{flex:1;border:0;outline:0;font-size:14px;background:transparent;color:var(--ink)}
  .buscador .bx{border:0;background:#eef2f7;color:#475569;border-radius:50%;width:22px;height:22px;font-size:15px;font-weight:700;line-height:1}
  .buscador .bcount{font-size:11.5px;color:var(--muted);font-weight:700;white-space:nowrap}
  /* Filtros */
  .fgrid{display:flex;flex-direction:column;gap:8px}
  .frow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .frow .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);min-width:92px}
  .fsel{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;font-family:inherit;min-width:180px;background:#fff}

async function cargarDatos(sb, uid, email){
  const [cfgR, areasR, locR, perfR] = await Promise.all([
    sb.from('av_config').select('*'),
    sb.from('av_areas').select('*').order('modulo').order('nivel'),
    sb.from('av_locales').select('*, av_partes(*)').order('orden'),
    sb.from('av_perfiles').select('*').eq('id', uid)
  ]);
  if(locR.error) return {ok:false, error: locR.error.message};
  const config = Object.fromEntries((cfgR.data||[]).map(r=>[r.clave, r.valor]));
  const plantilla = config.plantilla || [];
  const plantillas = {
    TABIQUE:    config.plantilla_TABIQUE    || plantilla,
    SOLADO:     config.plantilla_SOLADO     || plantilla,
    CIELORRASO: config.plantilla_CIELORRASO || plantilla
  };
  const perfil = (perfR.data&&perfR.data[0]) || {rol:'lector', locales_edicion:'', nombre:email};
  if(perfil.activo===false) return {ok:false, error:"Tu usuario todavía no está habilitado. Pedí al administrador que lo active."};
  const locales = (locR.data||[]).map(l=>({
    local_id:l.local_id, modulo:l.modulo, nivel:l.nivel, numero:l.numero, nombre:l.nombre, orden:l.orden,
    plano_x:l.plano_x, plano_y:l.plano_y,

      tipologia:p.tipologia, plano_x:p.plano_x, plano_y:p.plano_y, comentarios:p.comentarios||"", fases:p.fases}))
  }));
  const raw=String(perfil.locales_edicion||"").trim();

  const res={ok:true, config:{titulo:(config.titulo||"Avance de Obra")}, areas:(areasR.data||[]),
    plantilla, plantillas, locales, usuario:{email, nombre:perfil.nombre||email, rol:perfil.rol, puede_editar:puede}};
  normalizeData(res);
  return res;
}

/* diff de fases para auditoría (qué tarea/subtarea/hito cambió) */
function diffFases(orig, neu, parte_id){
  const out=[];
  (neu||[]).forEach(f=>{
    const of=(orig||[]).find(x=>x.id===f.id);
    if(of && (of.hito&&f.hito) && of.hito.valor!==f.hito.valor)
      out.push({tipo:'hito',parte_id,item:f.nombre,campo:f.hito.nombre,anterior:of.hito.valor,nuevo:f.hito.valor});
    (f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      let ot=null; (of&&of.grupos||[]).forEach(gg=>{const x=(gg.tareas||[]).find(y=>y.id===t.id); if(x)ot=x;});
      if(ot){
        if((ot.estado||'')!==(t.estado||'')) out.push({tipo:'estado',parte_id,item:t.nombre,campo:'estado',anterior:ot.estado||'',nuevo:t.estado||''});
        if((ot.comentario||'')!==(t.comentario||'')) out.push({tipo:'comentario',parte_id,item:t.nombre,campo:'comentario',anterior:ot.comentario||'',nuevo:t.comentario||''});
      }
      (t.subtareas||[]).forEach(s=>{
        const os= ot ? (ot.subtareas||[]).find(y=>y.id===s.id) : null;
        if(os){
          if((os.estado||'')!==(s.estado||'')) out.push({tipo:'subtarea',parte_id,item:t.nombre+' › '+s.nombre,campo:'estado',anterior:os.estado||'',nuevo:s.estado||''});
          if((os.comentario||'')!==(s.comentario||'')) out.push({tipo:'comentario',parte_id,item:t.nombre+' › '+s.nombre,campo:'comentario',anterior:os.comentario||'',nuevo:s.comentario||''});
        }
      });
    }));
  });
  return out;
}

/* ================== helpers ================== */
function partItems(pt){
  // devuelve la lista de estados "hoja" de la parte (subtareas si las hay; si no, tareas; modelo viejo: avance)
  if(pt.fases){
    const out=[];
    pt.fases.forEach(f=>f.grupos.forEach(g=>g.tareas.forEach(t=>{
      if(t.subtareas&&t.subtareas.length) t.subtareas.forEach(s=>out.push(s.estado));
      else out.push(t.estado);
    })));
    return out;
  }
  return Object.values(pt.avance||{});
}
function avancePct(local){
  let tot=0,done=0;
  local.partes.forEach(p=>partItems(p).forEach(e=>{
    if(PESO[e]===null) return; tot++; done+=(PESO[e]||0);
  }));
  return tot? Math.round(100*done/tot):0;
}
function colorPct(p){ if(p>=100)return"#16a34a"; if(p>=60)return"#65a30d"; if(p>=30)return"#f59e0b"; if(p>0)return"#ea580c"; return"#dc2626"; }
/* color por estado de los ítems hoja: verde=todo terminado, naranja=algo iniciado/terminado,
   rojo=nada. Así cualquier avance (por chico que sea) cambia el color, sin depender del %. */
function colorItems(items){
  if(!items||items.length===0) return "#dc2626";        // sin datos cargados → sin iniciar (rojo)
  const rel=items.filter(e=>PESO[e]!==null);           // excluye "No aplica"
  if(rel.length===0) return "#94a3b8";                  // todo "No aplica" → gris
  if(rel.every(e=>e==="Terminado")) return "#16a34a";   // todo terminado → verde
  if(rel.some(e=>e==="Terminado"||e==="Iniciado")) return "#f59e0b"; // algo de avance → naranja
  return "#dc2626";                                     // sin iniciar → rojo
}
function colorLocal(local){ const it=[]; (local.partes||[]).forEach(p=>partItems(p).forEach(e=>it.push(e))); return colorItems(it); }
function colorParte(p){ return colorItems(partItems(p)); }
function puedeEditar(user,local_id){
  if(!user) return false;
  if(user.puede_editar==="*") return true;
  return Array.isArray(user.puede_editar) && user.puede_editar.indexOf(local_id)>=0;
}
/* ---- Backup: exporta a Excel (o CSV si no cargó la librería) un cuadro con
   cada local, cada tabique/solado/cielorraso y el estado de cada ítem ---- */
function exportarBackup(data){
  const rows=[["Modulo","Nivel","Local N°","Local nombre","Elemento","Etapa","Grupo","Tarea","Subgrupo","Subtarea","Estado","Comentario"]];
  (data.locales||[]).forEach(l=>(l.partes||[]).forEach(p=>{
    const fs=p.fases||[];
    if(!fs.length){ rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),"","","","","","(sin cargar)",p.comentarios||""]); return; }
    fs.forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      if(t.subtareas&&t.subtareas.length){
        t.subtareas.forEach(s=>rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),f.nombre,g.nombre||"",t.nombre,s.grupo||"",s.nombre,s.estado,s.comentario||""]));
      } else {
        rows.push([l.modulo,l.nivel,l.numero,l.nombre,normEtq(p.etiqueta),f.nombre,g.nombre||"",t.nombre,"","",t.estado,t.comentario||""]);
      }
    })));
  }));
  const fecha=new Date().toISOString().slice(0,10);
  try{
    if(window.XLSX){
      const ws=XLSX.utils.aoa_to_sheet(rows);
      ws['!cols']=[{wch:7},{wch:6},{wch:8},{wch:20},{wch:14},{wch:16},{wch:16},{wch:18},{wch:14},{wch:22},{wch:12},{wch:24}];
      const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Avance");
      XLSX.writeFile(wb,"backup_avance_"+fecha+".xlsx");
    } else {
      const csv="﻿"+rows.map(r=>r.map(c=>'"'+String(c==null?"":c).replace(/"/g,'""')+'"').join(";")).join("\n");
      const a=document.createElement("a"); a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(csv);
      a.download="backup_avance_"+fecha+".csv"; document.body.appendChild(a); a.click(); a.remove();
    }
  }catch(e){ alert("No se pudo generar el backup: "+(e&&e.message||e)); }
}

/* ================== Detalle de local ================== */
function partPct(pt){
  let t=0,d=0;
  partItems(pt).forEach(e=>{if(PESO[e]===null)return; t++; d+=(PESO[e]||0);});
  return t?Math.round(100*d/t):0;
}
function estadoLeaves(items){ let t=0,d=0; items.forEach(e=>{if(PESO[e]===null)return;t++;d+=(PESO[e]||0);}); return t?Math.round(100*d/t):0; }
function partAbrev(pt){
  if(pt.tipo==="TABIQUE") return "T"+(pt.indice||"");
  if(pt.tipo==="SOLADO") return "S";
  if(pt.tipo==="CIELORRASO") return "C";

function LocalPlan({local,draft,area,zoom,setZoom,mgmt,calPart,setCalPart,svgRef,onSvgClick}){
  if(local.plano_x==null||local.plano_y==null){
    return <div className="localplan"><div className="lp-head"><b>Plano del local</b></div>
      <div className="lp-note">Ubicá este local en el plano del sector (botón <b>⚙ Calibrar locales</b>) para ver su plano individual.</div>
    </div>;
  }
  const W=area.plano_ancho||1000, H=area.plano_alto||1000;
  const cropW=W*zoom, cropH=cropW*0.62;
  const cx=local.plano_x/100*W, cy=local.plano_y/100*H;
  const x0=Math.max(0,Math.min(cx-cropW/2,W-cropW)), y0=Math.max(0,Math.min(cy-cropH/2,H-cropH));
  const ubic=draft.partes.filter(p=>p.plano_x!=null&&p.plano_y!=null);
  const sinUbic=draft.partes.filter(p=>p.plano_x==null);
  const r=cropW*0.018, fs=cropW*0.026;
  return (
    <div className="localplan">
      <div className="lp-head">
        <b>Plano del local</b>
        <span className="lp-zoom">
          <button className="btn sm" onClick={()=>setZoom(z=>Math.min(0.6,+(z+0.06).toFixed(2)))}>–</button>
          <button className="btn sm" onClick={()=>setZoom(z=>Math.max(0.08,+(z-0.06).toFixed(2)))}>+</button>
        </span>
      </div>
      <div className="lp-svgwrap" style={{aspectRatio:cropW+" / "+cropH}}>
        <svg ref={svgRef} viewBox={x0+" "+y0+" "+cropW+" "+cropH} width="100%" height="100%"
             onClick={onSvgClick} style={{cursor:(mgmt&&calPart)?"crosshair":"default",display:"block"}}>
          <image href={area.plano_url} x="0" y="0" width={W} height={H}/>
          {ubic.map(pt=>{const c=colorPct(partPct(pt));
            return <g key={pt.parte_id}>
              <circle cx={pt.plano_x/100*W} cy={pt.plano_y/100*H} r={r} fill={c} stroke="#fff" strokeWidth={r*0.22}/>
              <text x={pt.plano_x/100*W} y={pt.plano_y/100*H} fontSize={fs} fill="#fff" fontWeight="800"
                    textAnchor="middle" dominantBaseline="central">{partAbrev(pt)}</text>
            </g>;})}
        </svg>
      </div>

function normEtq(s){ return String(s||"").replace(/CIELORASO/gi,"CIELORRASO"); }
function buildFases(plantilla,pid){
  let tc=0,sc=0;
  // rev5: las etapas per-local (Revestimiento/Terminaciones) NO salen de la matriz
  return (plantilla||[]).filter(f=>PERLOCAL_NOMBRES.indexOf(f.nombre)<0).map(f=>({
    id:pid+"::"+f.id, nombre:f.nombre, hito:{nombre:f.hito,valor:"NO"}, comentario:"",
    grupos:(f.grupos||[]).map(g=>({nombre:g.nombre, tareas:(g.tareas||[]).map(t=>({
      id:pid+"::t"+(tc++), nombre:t.nombre, estado:"Sin realizar", comentario:"",
      subtareas:(t.subs||[]).map(s=>({id:pid+"::s"+(sc++), nombre:s.n, grupo:s.g||null, estado:"Sin realizar", comentario:""}))
    }))}))
  }));
}
/* etapa per-local vacía (revestimiento en tabiques / terminaciones en cielorraso) */
function etapaPerLocal(pid,nombre){
  return {id:pid+"::rev", nombre:nombre, perLocal:true, verificacion:"NO", comentario:"", grupos:[{nombre:null,tareas:[]}]};
}
/* normaliza una parte al modelo rev5: PP con "permite continuar", y etapa per-local
   según el tipo (descartando tareas placeholder viejas, conservando rubros válidos) */
function normalizeParte(pt){
  if(!pt||!pt.fases) return pt;
  const pp=pt.fases.find(f=>f.nombre===PP_NOMBRE);
  if(pp && pp.permiteContinuar==null) pp.permiteContinuar="SI";
  const revName=ETAPA_PERLOCAL[pt.tipo];
  if(revName){
    let rev=pt.fases.find(f=>f.nombre===revName || f.perLocal);
    if(!rev){ rev=etapaPerLocal(pt.parte_id,revName); pt.fases.push(rev); }
    rev.nombre=revName; rev.perLocal=true;
    if(rev.verificacion==null) rev.verificacion="NO";
    const rubros=[];
    (rev.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(esRubroValido(t.nombre)) rubros.push(t); }));
    rev.grupos=[{nombre:null, tareas:rubros}];
  }
  return pt;
}
function normalizeData(data){
  (data&&data.locales||[]).forEach(l=>(l.partes||[]).forEach(p=>{ if(p.fases) normalizeParte(p); }));
  return data;
}
/* plantilla vigente para un tipo de elemento (TABIQUE/SOLADO/CIELORRASO) */
function plantillaDe(data,tipo){
  return (data&&data.plantillas&&data.plantillas[tipo]) || (data&&data.plantilla) || [];
}
/* Reconstruye las fases de una parte desde una plantilla nueva, CONSERVANDO el avance
   ya cargado emparejando por nombre (etapa › tarea › subtarea[+subgrupo]). Las que
   dejan de existir se descartan; las nuevas arrancan en "Sin realizar". */
function mergeFasesByName(plantilla,pid,oldFases){
  const fresh=buildFases(plantilla,pid);
  const oldF={}; (oldFases||[]).forEach(f=>{ oldF[f.nombre]=f; });
  fresh.forEach(nf=>{
    const of=oldF[nf.nombre]; if(!of) return;
    if(of.hito&&nf.hito) nf.hito.valor=of.hito.valor;
    if(of.permiteContinuar!=null) nf.permiteContinuar=of.permiteContinuar;  // conservar "permite continuar"
    const oT={}, oS={};
    (of.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      oT[t.nombre]=t;
      (t.subtareas||[]).forEach(s=>{ oS[t.nombre+'\u0000'+(s.grupo||'')+'\u0000'+s.nombre]=s; });
    }));
    (nf.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
      const ot=oT[t.nombre];
      if(ot){ t.estado=ot.estado||t.estado; t.comentario=ot.comentario||""; }
      (t.subtareas||[]).forEach(s=>{
        const os=oS[t.nombre+'\u0000'+(s.grupo||'')+'\u0000'+s.nombre];
        if(os){ s.estado=os.estado||s.estado; s.comentario=os.comentario||""; }
      });
    }));
  });
  // PP: asegurar "permite continuar"
  const ppF=fresh.find(f=>f.nombre===PP_NOMBRE); if(ppF&&ppF.permiteContinuar==null) ppF.permiteContinuar="SI";
  // preservar SOLO las etapas per-local conocidas (Revestimiento/Terminaciones).
  // Cualquier otra etapa que no esté en la matriz fue BORRADA a propósito → no se reañade.
  const names=new Set(fresh.map(f=>f.nombre));
  (oldFases||[]).forEach(of=>{ if(!names.has(of.nombre) && PERLOCAL_NOMBRES.indexOf(of.nombre)>=0) fresh.push(of); });
  return fresh;
}
function initDraft(local,data){
  const nd=JSON.parse(JSON.stringify(local));
  nd.partes.forEach(pt=>{
    pt.etiqueta=normEtq(pt.etiqueta);
    if(!pt.fases) pt.fases=buildFases(plantillaDe(data,pt.tipo),pt.parte_id);
    normalizeParte(pt);
  });
  return nd;
}
/* ---- mutadores de partes con fases (operan sobre una copia de la parte) ---- */
function findTareaIn(p,faseId,tareaId){
  const f=(p.fases||[]).find(x=>x.id===faseId); if(!f) return {};
  for(const g of f.grupos){const t=g.tareas.find(x=>x.id===tareaId); if(t) return {f,g,t};}

  const p=estadoLeaves(subs.map(s=>s.estado));

  if(p>=100) return "Terminado"; if(p>0) return "Iniciado"; return "Sin realizar";
}

        partes.push({parte_id:pt.parte_id,tipo:pt.tipo,indice:pt.indice,etiqueta:pt.etiqueta,
          tipologia:pt.tipologia||"",plano_x:pt.plano_x,plano_y:pt.plano_y,comentarios:pt.comentarios||"",fases:pt.fases});
        if(nuevo) cambios.push({tipo:'alta_parte',parte_id:pt.parte_id,item:pt.etiqueta,campo:'',anterior:'',nuevo:pt.tipo});
        dcam.forEach(c=>cambios.push(c));
        if(comCambio) cambios.push({tipo:'comentario',parte_id:pt.parte_id,item:'(elemento)',campo:'comentario general',anterior:(orig&&orig.comentarios)||'',nuevo:pt.comentarios||''});
      }
    });
    const res=await apiPost({action:"guardar",email:user.email,local_id:local.local_id,
                             partes,borrar,cambios});
    setSaving(false);
    if(res.ok){ setMsg("Guardado ✓"); setDirty(false); onSaved(draft); }
    else setMsg("Error: "+(res.error||"desconocido"));
    return res;
  }
  useEffect(()=>{ if(initialParte){ const el=document.getElementById("pt-"+initialParte);
    if(el) el.scrollIntoView({behavior:"smooth",block:"start"}); } },[initialParte]);
  const orderTipo={SOLADO:0,TABIQUE:1,CIELORRASO:2};

  return (

              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>

        <div className="mhead">
          <div>
            <h2><span style={{opacity:.85,fontWeight:600}}>{local.numero}</span> · {local.nombre}</h2>

          {editable && <button className={"btn sm"+(edit?" primary":"")} style={{marginLeft:"auto"}}
                       onClick={()=>setEdit(v=>!v)}>{edit?"✔ Listo":"✏️ Editar"}</button>}
          {!editable && <span className="rochip">Solo lectura</span>}

          {partes.map(pt=>{

function parteResumen(pt,aplicables){
  let t=0,d=0; aplicables.forEach(r=>{const e=pt.avance[r]||"Sin realizar"; if(PESO[e]===null)return; t++; d+=PESO[e];});
  return t? Math.round(100*d/t)+"%":"—";
}

/* ================== Cambiar contraseña ================== */
function CambiarPwd({onClose}){
  const [p1,setP1]=useState(""); const [p2,setP2]=useState("");
  const [msg,setMsg]=useState(""); const [saving,setSaving]=useState(false);
  async function guardar(){
    if(p1.length<6){ setMsg("La contraseña debe tener al menos 6 caracteres."); return; }
    if(p1!==p2){ setMsg("Las contraseñas no coinciden."); return; }
    setSaving(true); setMsg("");
    const sb=getSB();
    const {error}=await sb.auth.updateUser({password:p1});
    setSaving(false);
    if(error){ setMsg("Error: "+error.message); }
    else { setMsg("✓ Contraseña actualizada."); setTimeout(onClose,1200); }
  }
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")onClose()}}>
      <div className="modal" style={{maxWidth:400}}>
        <div className="mhead"><div><h2 style={{fontSize:17}}>Cambiar contraseña</h2></div>
          <button className="x" onClick={onClose}>×</button></div>
        <div className="mbody">
          <input className="pwinp" type="password" placeholder="Nueva contraseña" value={p1}
                 onChange={e=>setP1(e.target.value)} autoFocus/>
          <input className="pwinp" type="password" placeholder="Repetir contraseña" value={p2}
                 onChange={e=>setP2(e.target.value)} onKeyDown={e=>e.key==="Enter"&&guardar()}/>
          <button className="btn primary" style={{width:"100%",padding:11}} disabled={saving} onClick={guardar}>
            {saving?"Guardando…":"Guardar contraseña"}</button>
          {msg && <div style={{marginTop:10,fontSize:13,fontWeight:600,
            color:msg.startsWith("✓")?"#166534":"#b91c1c"}}>{msg}</div>}
        </div>
      </div>
    </div>
  );
}

  async function cargar(){
    const sb=getSB();
    const {data,error}=await sb.from("av_perfiles").select("*").order("email");
    if(error){ setMsg("Error al cargar: "+error.message); setRows([]); }
    else setRows(data||[]);
  }
  useEffect(()=>{ cargar(); },[]);
  async function guardar(p){
    setMsg("Guardando "+p.email+"…");
    const sb=getSB();
    const {data,error}=await sb.rpc("av_upsert_perfil",{p_email:p.email,p_nombre:p.nombre||"",
      p_rol:p.rol,p_activo:!!p.activo,p_locales:p.locales_edicion||p.locales||""});

    if(data&&data.ok===false){ setMsg(data.error||"No se pudo guardar"); return false; }
    setMsg("✓ Guardado "+p.email); await cargar(); return true;
  }
  function upd(id,campo,val){ setRows(rs=>rs.map(r=>r.id===id?{...r,[campo]:val}:r)); }
  async function agregar(){
    if(!nuevo.email.trim()){ setMsg("Poné un email."); return; }

                onChange={e=>setNuevo(n=>({...n,email:e.target.value}))}/>
              <input className="pwinp" style={{flex:"1 1 120px",margin:0}} placeholder="nombre" value={nuevo.nombre}
                onChange={e=>setNuevo(n=>({...n,nombre:e.target.value}))}/>
              <select className="pwinp" style={{flex:"0 0 110px",margin:0}} value={nuevo.rol}
                onChange={e=>setNuevo(n=>({...n,rol:e.target.value}))}>
                <option value="lector">lector</option><option value="editor">editor</option><option value="admin">admin</option>
              </select>
              <input className="pwinp" style={{flex:"1 1 130px",margin:0}} placeholder="locales (* o lista)" value={nuevo.locales}
                onChange={e=>setNuevo(n=>({...n,locales:e.target.value}))}/>
              <button className="btn sm primary" onClick={agregar}>+ Asignar</button>
            </div>
          </div>
          {rows===null ? <div className="loading">Cargando…</div> : (
            <table className="utab">
              <thead><tr><th>Email</th><th>Nombre</th><th>Rol</th><th>Activo</th><th>Locales que edita</th><th></th></tr></thead>
              <tbody>
                {rows.map(r=>(
                  <tr key={r.id}>
                    <td className="uemail">{r.email}</td>
                    <td><input className="ucell" value={r.nombre||""} onChange={e=>upd(r.id,"nombre",e.target.value)}/></td>
                    <td><select className="ucell" value={r.rol} onChange={e=>upd(r.id,"rol",e.target.value)}>
                      <option value="lector">lector</option><option value="editor">editor</option><option value="admin">admin</option></select></td>
                    <td style={{textAlign:"center"}}><input type="checkbox" checked={!!r.activo} onChange={e=>upd(r.id,"activo",e.target.checked)}/></td>
                    <td><input className="ucell" placeholder="* o A-PB-101,…" value={r.locales_edicion||""}
                      onChange={e=>upd(r.id,"locales_edicion",e.target.value)} disabled={r.rol!=="editor"}/></td>
                    <td><button className="btn sm primary" onClick={()=>guardar(r)}>Guardar</button></td>

                ))}

              </tbody>

            <b>Rol:</b> admin (edita todo + gestiona usuarios) · editor (edita los locales de la lista) · lector (solo consulta).

          </div>
        </div>
      </div>
    </div>
  );
}

const TIPOS_MATRIZ=[["TABIQUE","Tabiques"],["SOLADO","Solados"],["CIELORRASO","Cielorrasos"]];
function MatrizPanel({data,onClose,onApplied}){
  const [tipo,setTipo]=useState("TABIQUE");
  // rev5: la matriz solo edita las etapas que NO son per-local (Revestimiento/Terminaciones)
  const base=()=> ((data.plantillas&&data.plantillas[tipo]) || data.plantilla || []).filter(f=>PERLOCAL_NOMBRES.indexOf(f.nombre)<0);
  const [pl,setPl]=useState(()=>JSON.parse(JSON.stringify(base())));
  const [dirty,setDirty]=useState(false);
  const [saving,setSaving]=useState(false);
  const [msg,setMsg]=useState("");
  const [openF,setOpenF]=useState({});
  const [ask,setAsk]=useState(false);       // confirmar "aplicar a toda la obra"
  const [askExit,setAskExit]=useState(false); // confirmar "salir sin guardar"
  const [pendingTipo,setPendingTipo]=useState(null); // cambio de tipo con cambios sin aplicar
  const dragRef=useRef(null);
  useEffect(()=>{ setPl(JSON.parse(JSON.stringify(base()))); setDirty(false); setMsg(""); setOpenF({}); },[tipo]);
  function mut(fn){ setPl(p=>{const np=JSON.parse(JSON.stringify(p)); fn(np); return np;}); setDirty(true); }
  const afectados = data.locales.reduce((n,l)=>n+l.partes.filter(p=>p.tipo===tipo).length,0);

  function tryClose(){ if(dirty&&!saving) setAskExit(true); else onClose(); }
  function cambiarTipo(k){ if(k===tipo) return; if(dirty&&!saving){ setPendingTipo(k); } else { setTipo(k); } }
  function cancelarCambios(){ setPl(JSON.parse(JSON.stringify(base()))); setDirty(false); setMsg("Cambios descartados"); }
  // reordenar arrastrando (dentro de la misma lista)
  function moveItem(arr,from,to){ if(from===to||from<0||to<0||from>=arr.length||to>=arr.length) return; const [x]=arr.splice(from,1); arr.splice(to,0,x); }
  function startDrag(desc){ dragRef.current=desc; }
  function dropOn(desc){ const d=dragRef.current; dragRef.current=null; if(!d||d.lvl!==desc.lvl) return;
    if(d.lvl==='f'){ mut(p=>moveItem(p,d.idx,desc.idx)); }
    else if(d.lvl==='t'){ if(d.fi!==desc.fi||d.gi!==desc.gi) return; mut(p=>moveItem(p[desc.fi].grupos[desc.gi].tareas,d.idx,desc.idx)); }
    else if(d.lvl==='s'){ if(d.fi!==desc.fi||d.gi!==desc.gi||d.ti!==desc.ti) return; mut(p=>moveItem(p[desc.fi].grupos[desc.gi].tareas[desc.ti].subs,d.idx,desc.idx)); }
  }
  async function aplicar(){
    setSaving(true); setMsg("");
    const partes=[], b=base();
    data.locales.forEach(l=>l.partes.forEach(p=>{ if(p.tipo===tipo){
      const old=p.fases||buildFases(b,p.parte_id);
      const tmp={tipo:p.tipo, parte_id:p.parte_id, fases:mergeFasesByName(pl,p.parte_id,old)};
      normalizeParte(tmp);
      partes.push({parte_id:p.parte_id, fases:tmp.fases});
    }}));
    // Se aplica POR LOTES para no superar el límite de tiempo de Supabase.
    // La plantilla se manda solo en el primer lote.
    const CH=100, total=partes.length;
    const lotes=[]; for(let i=0;i<total;i+=CH) lotes.push(partes.slice(i,i+CH));
    if(lotes.length===0) lotes.push([]);   // al menos un lote: guarda la plantilla aunque no haya elementos
    for(let i=0;i<lotes.length;i++){
      setMsg(total? ("Aplicando… "+Math.min((i+1)*CH,total)+"/"+total) : "Guardando plantilla…");
      const res=await apiPost({action:'matriz', tipo, plantilla:i===0?pl:null, partes:lotes[i]});
      if(!res.ok){ setSaving(false);
        setMsg("Error: "+(res.error||"desconocido")+(i>0?(" — se aplicó parcial ("+(i*CH)+"/"+total+"). Tocá “Aplicar” otra vez para completar."):""));
        setAsk(false); return; }
    }
    setSaving(false); setMsg("Aplicado ✓ a "+total+" elemento(s)"); setDirty(false);
    onApplied(tipo,pl,partes); setAsk(false);
  }
  // mutadores por índice
  const addEtapa=()=>mut(p=>p.push({id:nid("f_"),nombre:"Nueva etapa",hito:"Hito",grupos:[{nombre:null,tareas:[]}]}));
  const delEtapa=(fi)=>mut(p=>p.splice(fi,1));
  const addGrupo=(fi)=>mut(p=>p[fi].grupos.push({nombre:"",tareas:[]}));
  const delGrupo=(fi,gi)=>mut(p=>p[fi].grupos.splice(gi,1));
  const addTarea=(fi,gi)=>mut(p=>p[fi].grupos[gi].tareas.push({nombre:"Nueva tarea",subs:[]}));
  const delTarea=(fi,gi,ti)=>mut(p=>p[fi].grupos[gi].tareas.splice(ti,1));
  const addSub=(fi,gi,ti)=>mut(p=>{const t=p[fi].grupos[gi].tareas[ti]; t.subs=t.subs||[]; t.subs.push({n:"Nueva subtarea",g:null});});
  const delSub=(fi,gi,ti,si)=>mut(p=>p[fi].grupos[gi].tareas[ti].subs.splice(si,1));

  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")tryClose()}}>
      <div className="modal" style={{maxWidth:900}}>
        {ask && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setAsk(false)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>Aplicar cambios de la matriz</h2>
                <div style={{fontSize:12,opacity:.85}}>Se va a reescribir la estructura de <b>{afectados}</b> elemento(s) de tipo <b>{tipo}</b> en toda la obra. El avance ya cargado se conserva por nombre.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn primary" disabled={saving} onClick={aplicar}>{saving?"Aplicando…":"Sí, aplicar a toda la obra"}</button>
                <button className="btn" disabled={saving} onClick={()=>setAsk(false)}>Cancelar</button>
              </div>
            </div>
          </div>
        )}
        {askExit && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setAskExit(false)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>¿Salir sin guardar?</h2>
                <div style={{fontSize:12,opacity:.85}}>Tenés cambios en la matriz que todavía no aplicaste. Si salís, se descartan.</div></div></div>
              <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
                <button className="btn danger" onClick={()=>{setAskExit(false);onClose();}}>Salir sin guardar</button>
                <button className="btn" onClick={()=>setAskExit(false)}>Seguir editando</button>
              </div>
            </div>
          </div>
        )}
        {pendingTipo && (
          <div className="overlay" style={{zIndex:60}} onClick={e=>{if(e.target===e.currentTarget)setPendingTipo(null)}}>
            <div className="modal" style={{maxWidth:420,width:"92%"}}>
              <div className="mhead"><div><h2>Cambiar de tipo</h2>

function qrDataURL(texto){
  try{ const qr=window.qrcode(0,'M'); qr.addData(texto); qr.make(); return qr.createDataURL(6,2); }
  catch(e){ return null; }
}
function QRPanel({data,modulo,nivel,onClose}){
  const [scope,setScope]=useState("sector");   // "sector" | "todos"
  const baseURL = (window.location.origin+window.location.pathname).replace(/[?#].*$/,"");
  const locs = (scope==="sector")
    ? data.locales.filter(l=>l.modulo===modulo&&l.nivel===nivel)
    : [...data.locales].sort((a,b)=> (a.modulo+a.nivel).localeCompare(b.modulo+b.nivel) || (a.numero||"").localeCompare(b.numero||"",'es',{numeric:true}));
  const hayLib = !!window.qrcode;
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")onClose()}}>
      <div className="modal" style={{maxWidth:900}}>
        <div className="mhead qr-noprint">
          <div><h2 style={{fontSize:18}}>🔳 Códigos QR de locales</h2>
            <div style={{fontSize:12,opacity:.85}}>Imprimí y pegá el QR en cada local. Al escanearlo, se abre ese local directamente.</div></div>
          <button className="x" onClick={onClose}>×</button>
        </div>
        <div className="mbody">
          <div className="addparte qr-noprint" style={{gap:10,flexWrap:"wrap"}}>
            <b>Mostrar:</b>
            <button className={"btn sm"+(scope==="sector"?" primary":"")} onClick={()=>setScope("sector")}>Este sector ({mNom(modulo)} · {nNom(nivel)})</button>
            <button className={"btn sm"+(scope==="todos"?" primary":"")} onClick={()=>setScope("todos")}>Toda la obra</button>
            <button className="btn sm" style={{marginLeft:"auto"}} onClick={()=>window.print()}>🖨️ Imprimir</button>
          </div>
          {!hayLib && <div className="noplano" style={{margin:"10px 0"}}><p>No se pudo cargar el generador de QR (revisá la conexión). Volvé a abrir este panel.</p></div>}
          {hayLib && (locs.length? (
            <div className="qrsheet">
              {locs.map(l=>{ const url=baseURL+"?local="+encodeURIComponent(l.local_id); const img=qrDataURL(url);
                return (
                <div className="qrcard" key={l.local_id}>
                  {img? <img src={img} alt={l.local_id} className="qrimg"/> : <div className="qrimg"/>}
                  <div className="qrnum">{l.numero}</div>
                  <div className="qrnom">{l.nombre}</div>
                  <div className="qrmod">{mNom(l.modulo)} · {nNom(l.nivel)}</div>
                </div>);
              })}
            </div>
          ) : <div className="noplano"><p>No hay locales en esta selección.</p></div>)}
        </div>
      </div>
    </div>
  );
}
/* ================== Filtros por tarea/subtarea (vista transversal) ================== */
function FiltrosPanel({data,modulo:m0,nivel:n0,onClose,onAbrirLocal}){
  const [m,setM]=useState(m0);
  const [n,setN]=useState(n0);
  const [loc,setLoc]=useState("*");
  const [tarea,setTarea]=useState("");
  const [sub,setSub]=useState("");
  useEffect(()=>{ setLoc("*"); },[m,n]);
  useEffect(()=>{ setSub(""); },[tarea]);
  const locs=data.locales.filter(l=>l.modulo===m&&l.nivel===n);
  const scopeLocs = loc==="*" ? locs : locs.filter(l=>l.local_id===loc);
  // tareas y subtareas presentes en el alcance
  const tMap=new Map();
  scopeLocs.forEach(l=>l.partes.forEach(p=>(p.fases||[]).forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{
    if(!tMap.has(t.nombre)) tMap.set(t.nombre,new Map());
    (t.subtareas||[]).forEach(s=>{ const k=(s.grupo||"")+"\u0000"+s.nombre; tMap.get(t.nombre).set(k,(s.grupo?s.grupo+" · ":"")+s.nombre); });
  })))));
  const tareas=[...tMap.keys()].sort((a,b)=>a.localeCompare(b,'es'));
  const subsDisp = tarea&&tMap.get(tarea) ? [...tMap.get(tarea).entries()] : [];
  function estadoDe(p){
    let found=null;
    (p.fases||[]).forEach(f=>(f.grupos||[]).forEach(g=>(g.tareas||[]).forEach(t=>{ if(t.nombre===tarea) found=t; })));
    if(!found) return null;
    if(sub){ const s=(found.subtareas||[]).find(x=>((x.grupo||"")+"\u0000"+x.nombre)===sub); return s?s.estado:null; }
    if(found.subtareas&&found.subtareas.length) return rollupEstado(found.subtareas);
    return found.estado;
  }
  const filas=[];
  if(tarea) scopeLocs.forEach(l=>l.partes.forEach(p=>{ const e=estadoDe(p); if(e!=null) filas.push({l,p,e}); }));
  const resumen={}; filas.forEach(f=>{resumen[f.e]=(resumen[f.e]||0)+1;});
  const ordTipo={SOLADO:0,TABIQUE:1,CIELORRASO:2};
  filas.sort((a,b)=> (a.l.numero||"").localeCompare(b.l.numero||"",'es',{numeric:true}) || (ordTipo[a.p.tipo]-ordTipo[b.p.tipo]) || ((a.p.indice||0)-(b.p.indice||0)));
  return (
    <div className="overlay" onClick={e=>{if(e.target.className==="overlay")onClose()}}>
      <div className="modal" style={{maxWidth:820}}>
        <div className="mhead">
          <div><h2 style={{fontSize:18}}>🔎 Filtros</h2>
            <div style={{fontSize:12,opacity:.85}}>Elegí módulo, piso, local y una tarea/subtarea para ver su estado en todos los elementos.</div></div>
          <button className="x" onClick={onClose}>×</button>
        </div>
        <div className="mbody">
          <div className="fgrid">
            <div className="frow"><span className="lbl">Módulo</span>
              {["A","B","C"].map(x=><button key={x} className={"vchip"+(m===x?" on":"")} onClick={()=>setM(x)}>{x}</button>)}</div>
            <div className="frow"><span className="lbl">Piso</span>
              {[["PB","Planta Baja"],["PA","Planta Alta"],["EP","Entrepiso"]].map(([c,nm])=>
                <button key={c} className={"vchip"+(n===c?" on":"")} onClick={()=>setN(c)}>{nm}</button>)}</div>
            <div className="frow"><span className="lbl">Local</span>
              <select value={loc} onChange={e=>setLoc(e.target.value)} className="fsel">
                <option value="*">Todos ({locs.length})</option>
                {locs.map(l=><option key={l.local_id} value={l.local_id}>{l.numero} · {l.nombre}</option>)}
              </select></div>
            <div className="frow"><span className="lbl">Rubro / Tarea</span>
              <select value={tarea} onChange={e=>setTarea(e.target.value)} className="fsel">
                <option value="">— elegir —</option>
                {tareas.map(t=><option key={t} value={t}>{t}</option>)}
              </select></div>
            {tarea && subsDisp.length>0 && <div className="frow"><span className="lbl">Subtarea</span>
              <select value={sub} onChange={e=>setSub(e.target.value)} className="fsel">
                <option value="">(toda la tarea)</option>
                {subsDisp.map(([k,label])=><option key={k} value={k}>{label}</option>)}
              </select></div>}
          </div>
          {!tarea && <div className="noplano" style={{marginTop:12}}><p>Elegí un rubro/tarea para ver resultados.</p></div>}
          {tarea && (
            <React.Fragment>
              <div className="fresumen">
                {Object.keys(resumen).sort().map(k=>
                  <span key={k} className="fchip-r" style={{background:COLOR[k]||"#94a3b8"}}>{k}: {resumen[k]}</span>)}
                <span style={{marginLeft:"auto",fontSize:12,color:"var(--muted)",fontWeight:700}}>{filas.length} elemento(s)</span>
              </div>
              <div className="ftable">
                {filas.map(({l,p,e},i)=>(
                  <div className="ftr" key={i} onClick={()=>{onAbrirLocal(l.local_id,p.parte_id);onClose();}}>
                    <span className="ftloc">{l.numero}</span>
                    <span className="ftnom">{l.nombre}</span>
                    <span className="ftel">{normEtq(p.etiqueta)}</span>
                    <span className="estado-sel ro" data-e={e} style={{marginLeft:"auto"}}>{e}</span>
                  </div>
                ))}
                {filas.length===0 && <div className="noplano"><p>Ningún elemento del alcance tiene esa tarea.</p></div>}
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    </div>
  );
}
/* ================== App ================== */
const MODS=["A","B","C"];
const NIVS=[["PB","Planta Baja"],["PA","Planta Alta"],["EP","Entrepiso"]];
function App(){
  const [user,setUser]=useState(null);
  const [data,setData]=useState(null);
  const [error,setError]=useState("");
  const [loading,setLoading]=useState(false);
  const [modulo,setModulo]=useState("A");
  const [nivel,setNivel]=useState("PB");
  const [mode,setMode]=useState("plano");   // "plano" | "botones"
  const [sel,setSel]=useState(null);
  const [selParte,setSelParte]=useState(null);   // parte a abrir al entrar (click desde el plano)
  const [calib,setCalib]=useState(false);
  const [calibSel,setCalibSel]=useState(null);      // local_id a calibrar
  const [calibTarget,setCalibTarget]=useState("local"); // "local" | parte_id
  const [calibMsg,setCalibMsg]=useState("");
  const [matrizOpen,setMatrizOpen]=useState(false);
  const [qrOpen,setQrOpen]=useState(false);
  const [nlNum,setNlNum]=useState("");
  const [nlNom,setNlNom]=useState("");
  const [edNum,setEdNum]=useState("");   // editar N° del local seleccionado
  const [edNom,setEdNom]=useState("");   // editar nombre del local seleccionado
  const [confirmDel,setConfirmDel]=useState(null);
  const [filtro,setFiltro]=useState("");         // buscador en modo Botones
  const [planoVer,setPlanoVer]=useState("todos");// "todos" | "local" (cómo ver el plano)
  const [filtrosOpen,setFiltrosOpen]=useState(false); // panel de filtros por tarea/subtarea
  const [booting,setBooting]=useState(ONLINE);   // mientras chequea si ya hay sesión iniciada
  const pendingLocalRef=useRef(null);            // local_id a abrir por deep-link (QR)
  const imgRef=useRef(null);

  async function login(email, password){
    if(!email){setError("Ingresá un email");return;}
    if(ONLINE && !password){setError("Ingresá tu contraseña");return;}
    setLoading(true); setError("");
    const res=await apiGet(email, password);
    setLoading(false);
    if(!res.ok){ setError(res.error||"No se pudo cargar"); return; }
    store.set("avance_email",email);
    setUser(res.usuario); setData(res);
  }
  function abrirLocalPorId(lid){
    const l=(data&&data.locales||[]).find(x=>x.local_id===lid);
    if(l){ setModulo(l.modulo); setNivel(l.nivel); setSelParte(null); setSel(l); }
  }
  // Arranque: lee el local del QR (?local=…) y, en online, entra directo si ya hay sesión.
  useEffect(()=>{
    try{ const u=new URL(window.location.href);
      const lp=u.searchParams.get("local")||((u.hash.match(/local=([^&]+)/)||[])[1]);
      if(lp) pendingLocalRef.current=decodeURIComponent(lp);
    }catch(e){}
    if(!ONLINE){ const e=store.get("avance_email"); if(e) login(e); return; }
    (async()=>{ const res=await apiSesion(); if(res&&res.ok){ setUser(res.usuario); setData(res); } setBooting(false); })();
  },[]);
  // Cuando ya cargó todo, si venía un local por QR, lo abre.
  useEffect(()=>{ if(data&&user&&pendingLocalRef.current){ abrirLocalPorId(pendingLocalRef.current); pendingLocalRef.current=null; } },[data,user]);
  async function logout(){ store.del("avance_email"); if(ONLINE){ const sb=getSB(); if(sb) await sb.auth.signOut(); } setUser(null); setData(null); }
  const [pwOpen,setPwOpen]=useState(false);
  const [usersOpen,setUsersOpen]=useState(false);

  const areas = (data&&data.areas)||[];
  const area = areas.find(a=>a.modulo===modulo&&a.nivel===nivel)||{modulo,nivel,plano_url:""};
  const localesArea = data? data.locales.filter(l=>l.modulo===modulo&&l.nivel===nivel):[];

  const global = useMemo(()=>{
    if(!data) return 0;
    let t=0,d=0;
    data.locales.forEach(l=>l.partes.forEach(p=>partItems(p).forEach(e=>{
      if(PESO[e]===null)return; t++; d+=(PESO[e]||0);})));
    return t?Math.round(100*d/t):0;
  },[data]);

  function cambiarArea(m,n){ setModulo(m); setNivel(n); setCalib(false); setCalibSel(null); setCalibMsg("");
    const a=areas.find(x=>x.modulo===m&&x.nivel===n); setMode((a&&a.plano_url)?"plano":"botones"); }

  function onSaved(updatedLocal){
    setData(d=>{const nd={...d,locales:d.locales.map(l=>l.local_id===updatedLocal.local_id?updatedLocal:l)};return nd;});
    setSel(s=>s&&s.local_id===updatedLocal.local_id?updatedLocal:s);
  }

  function onMatriz(tipo,plantilla,partes){
    const fmap=Object.fromEntries(partes.map(x=>[x.parte_id,x.fases]));
    setData(d=>({...d, plantillas:{...(d.plantillas||{}),[tipo]:plantilla},
      locales:d.locales.map(l=>({...l,partes:l.partes.map(p=>fmap[p.parte_id]?{...p,fases:fmap[p.parte_id]}:p)}))}));
    setSel(s=>{ if(!s) return s; return {...s,partes:s.partes.map(p=>fmap[p.parte_id]?{...p,fases:fmap[p.parte_id]}:p)}; });
  }

  async function crearLocal(){
    const num=(nlNum||"").trim(); if(!num){ setCalibMsg("Poné un número de local."); return; }
    const lid=modulo+"-"+nivel+"-"+num;
    if(data.locales.some(l=>l.local_id===lid)){ setCalibMsg("Ya existe un local con ese número en este sector."); return; }
    const res=await apiPost({action:'crear_local',local_id:lid,modulo,nivel,numero:num,nombre:(nlNom||"").trim()});
    if(res.ok){
      const nuevo={local_id:lid,modulo,nivel,numero:num,nombre:(nlNom||"").trim(),orden:9999,plano_x:null,plano_y:null,partes:[]};
      setData(d=>({...d,locales:[...d.locales,nuevo]}));
      setUser(u=>(u.rol==='editor'&&u.puede_editar!=='*')
        ? {...u,puede_editar:[...(Array.isArray(u.puede_editar)?u.puede_editar:[]),lid]} : u);
      setNlNum(""); setNlNom(""); setCalibSel(lid); setCalibTarget("local");
      setCalibMsg("Local creado ✓ — ubicalo haciendo click en el plano.");
    } else setCalibMsg("Error: "+(res.error||"no se pudo crear"));
  }
  async function doBorrarLocal(l){
    const res=await apiPost({action:'borrar_local',local_id:l.local_id});
    if(res.ok){ setData(d=>({...d,locales:d.locales.filter(x=>x.local_id!==l.local_id)}));
      if(calibSel===l.local_id) setCalibSel(null); setCalibMsg("Local eliminado ✓"); }
    else setCalibMsg("Error: "+(res.error||"no se pudo eliminar"));
    setConfirmDel(null);
  }
  async function editarLocal(){
    if(!calibSel) return;
    const num=(edNum||"").trim(), nom=(edNom||"").trim();
    const res=await apiPost({action:'editar_local',local_id:calibSel,numero:num,nombre:nom});
    if(res.ok){ setData(d=>({...d,locales:d.locales.map(l=>l.local_id===calibSel?{...l,numero:num||l.numero,nombre:nom}:l)}));
      setCalibMsg("Local actualizado ✓"); }
    else setCalibMsg("Error: "+(res.error||"no se pudo editar"));
  }
  async function quitarDelPlano(){
    if(!calibSel) return;
    const res=await apiPost({action:'descalibrar_local',local_id:calibSel});
    if(res.ok){ setData(d=>({...d,locales:d.locales.map(l=>l.local_id===calibSel
        ? {...l,plano_x:null,plano_y:null,partes:l.partes.map(p=>({...p,plano_x:null,plano_y:null}))} : l)}));
      setCalibMsg("Local quitado del plano ✓ — queda para recalibrar."); }
    else setCalibMsg("Error: "+(res.error||"no se pudo quitar del plano"));
  }
  // al elegir un local en Calibrar, precargar su número/nombre en los campos de edición
  useEffect(()=>{ const l=(data&&data.locales||[]).find(x=>x.local_id===calibSel);
    setEdNum(l?l.numero||"":""); setEdNom(l?l.nombre||"":""); },[calibSel]);

  async function planoClick(ev){
    if(!calib||!calibSel) return;
    const rect=imgRef.current.getBoundingClientRect();
    const x=+(100*(ev.clientX-rect.left)/rect.width).toFixed(2);
    const y=+(100*(ev.clientY-rect.top)/rect.height).toFixed(2);
    if(calibTarget==="local"){
      setData(d=>({...d,locales:d.locales.map(l=>l.local_id===calibSel?{...l,plano_x:x,plano_y:y}:l)}));
      await apiPost({action:"calibrar",email:user.email,posiciones:[{local_id:calibSel,plano_x:x,plano_y:y}]});
      setCalibMsg("Ubicado el local ✓");
    } else {
      setData(d=>({...d,locales:d.locales.map(l=>l.local_id!==calibSel?l:
        {...l,partes:l.partes.map(p=>p.parte_id===calibTarget?{...p,plano_x:x,plano_y:y}:p)})}));
      await apiPost({action:"calibrar_parte",email:user.email,local_id:calibSel,parte_id:calibTarget,plano_x:x,plano_y:y});
      setCalibMsg("Ubicada la parte ✓");
    }
  }
  const calLocal = calib&&calibSel ? localesArea.find(l=>l.local_id===calibSel) : null;

  if(ONLINE && booting && !user) return <div className="loading">Cargando…</div>;
  if(!user) return <Login onLogin={login} error={error} loading={loading}/>;
  if(loading||!data) return <div className="loading">Cargando…</div>;

  const conf=data.config;
  const sinUbicar=localesArea.filter(l=>l.plano_x==null||l.plano_y==null);
  const cnt=(m,n)=>data.locales.filter(l=>l.modulo===m&&l.nivel===n).length;
  const tienePlano=(m,n)=>{const a=areas.find(x=>x.modulo===m&&x.nivel===n);return a&&a.plano_url;};

  return (
  <div className="app">
    <header className="top">
      <div className="row">
        <div>
          <h1>Avance de Obra — {mNom(modulo)} · {nNom(nivel)}</h1>
          <div className="sub">{localesArea.length} locales en el sector · {data.locales.length} en total · {user.rol==="admin"?"Administrador":user.rol==="editor"?"Editor":"Solo lectura"}</div>
        </div>
        <div className="spacer"></div>
        <div className="userbox"><b>{user.nombre||user.email}</b><span>{user.email}</span></div>
        {user.rol==="admin" && <button className="btn ghost sm" title="Descargar backup en Excel" onClick={()=>exportarBackup(data)}>⬇️ Backup</button>}
        {ONLINE && user.rol==="admin" && <button className="btn ghost sm" title="Usuarios y permisos" onClick={()=>setUsersOpen(true)}>👥 Usuarios</button>}
        {ONLINE && <button className="btn ghost sm" title="Cambiar contraseña" onClick={()=>setPwOpen(true)}>🔑</button>}
        <button className="btn ghost sm" onClick={logout}>Salir</button>
      </div>
      <div className="globalbar">
        <span style={{fontSize:12,opacity:.9}}>Avance global</span>
        <div className="track"><div className="fill" style={{width:global+"%"}}></div></div>
        <b style={{fontSize:14}}>{global}%</b>
      </div>
    </header>

    {/* Selector de área: Módulo + Planta */}
    <div className="areabar">
      <div className="areagrp">
        <span className="lbl">Módulo</span>
        {MODS.map(m=><button key={m} className={"achip"+(modulo===m?" on":"")}
                     onClick={()=>cambiarArea(m,nivel)}>{m}</button>)}
      </div>
      <div className="areagrp">
        <span className="lbl">Planta</span>
        {NIVS.map(([code,nom])=>{const c=cnt(modulo,code);
          return <button key={code} className={"achip wide"+(nivel===code?" on":"")}
                   onClick={()=>cambiarArea(modulo,code)}>
                   {nom}{tienePlano(modulo,code)?" 🗺️":""}{c?<span className="cbadge">{c}</span>:null}
                 </button>;})}
      </div>
    </div>

    <div className="tabs">
      <button className={mode==="plano"?"active":""} onClick={()=>setMode("plano")}>🗺️ Plano</button>
      <button className={mode==="botones"?"active":""} onClick={()=>setMode("botones")}>🔢 Botones</button>
      <button onClick={()=>setFiltrosOpen(true)}>🔎 Filtros</button>
      {user.rol==="admin" &&
        <button onClick={()=>setQrOpen(true)} style={{marginLeft:"auto"}}>🔳 QR</button>}
      {user.rol==="admin" &&
        <button onClick={()=>setMatrizOpen(true)} style={{marginLeft:"8px"}}>🧩 Configuración matriz</button>}
      {(user.rol==="admin"||user.rol==="editor") && area.plano_url && mode==="plano" &&
        <button className={calib?"active":""} onClick={()=>{setCalib(c=>!c);setCalibMsg("")}}
          style={{marginLeft:user.rol==="admin"?"8px":"auto"}}>
          {calib?"✔ Terminar calibración":"⚙ Calibrar"}</button>}
    </div>

    {calib && (
      <div className="calibbar">
        <div className="calibrow">
          <b>Calibrar.</b>
          <span>Elegí un local:</span>
          <select value={calibSel||""} onChange={e=>{setCalibSel(e.target.value);setCalibTarget("local");}}>
            <option value="">— elegir local —</option>
            {localesArea.map(l=><option key={l.local_id} value={l.local_id}>{l.numero} · {l.nombre}{(l.plano_x==null?" (sin ubicar)":"")}</option>)}
          </select>
          <span style={{color:calibMsg.startsWith("Error")?"#b91c1c":"#166534",fontWeight:600,marginLeft:"auto"}}>{calibMsg}</span>
        </div>
        <div className="calibrow" style={{flexWrap:"wrap"}}>
          <b>Locales.</b>
          <input placeholder="N°" value={nlNum} onChange={e=>setNlNum(e.target.value)} style={{width:70}}/>
          <input placeholder="Nombre (ej. Oficina)" value={nlNom} onChange={e=>setNlNom(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&crearLocal()} style={{minWidth:150}}/>
          <button className="btn sm primary" onClick={crearLocal}>+ Agregar local</button>
        </div>
        {calibSel && (()=>{const l=localesArea.find(x=>x.local_id===calibSel); if(!l) return null; return (
          <div className="calibrow" style={{flexWrap:"wrap",borderTop:"1px dashed #fcd34d",paddingTop:8,marginTop:8}}>
            <b>Local {l.numero}.</b>
            <input placeholder="N°" value={edNum} onChange={e=>setEdNum(e.target.value)} style={{width:70}}/>
            <input placeholder="Nombre" value={edNom} onChange={e=>setEdNom(e.target.value)}
              onKeyDown={e=>e.key==="Enter"&&editarLocal()} style={{minWidth:150}}/>
            <button className="btn sm" onClick={editarLocal}>✎ Guardar nombre</button>
            {l.plano_x!=null && <button className="btn sm" onClick={quitarDelPlano} title="Quita el marcador del plano, sin borrar el local">📍✕ Quitar del plano</button>}
            <button className="btn sm danger" onClick={()=>setConfirmDel(l)}>🗑 Eliminar local</button>
          </div>);})()}
        {calLocal && (
          <div className="calibrow chips">
            <span className="lbl">Ubicar:</span>
            <button className={"chip"+(calibTarget==="local"?" on":"")} onClick={()=>setCalibTarget("local")}>
              📍 El local{calLocal.plano_x==null?" ·sin ubicar":""}</button>
            {[...calLocal.partes].sort((a,b)=>({SOLADO:0,TABIQUE:1,CIELORRASO:2}[a.tipo]-{SOLADO:0,TABIQUE:1,CIELORRASO:2}[b.tipo])||((a.indice||0)-(b.indice||0))).map(p=>
              <button key={p.parte_id} className={"chip"+(calibTarget===p.parte_id?" on":"")+(p.plano_x==null?" pend":"")}
                onClick={()=>setCalibTarget(p.parte_id)}>{normEtq(p.etiqueta)}</button>)}
            <span className="calhint">→ hacé click en el plano</span>
          </div>
        )}
      </div>
    )}

    {mode==="plano" && (
      area.plano_url ? (
        <div>
          {!calib && <div className="verbar">
            <span className="lbl">Cómo ver:</span>
            <button className={"vchip"+(planoVer==="todos"?" on":"")} onClick={()=>setPlanoVer("todos")}>Ver todos los tabiques</button>
            <button className={"vchip"+(planoVer==="local"?" on":"")} onClick={()=>setPlanoVer("local")}>Solo número de local</button>
          </div>}
          <div className="planowrap"><div className="inner">
            <img ref={imgRef} src={area.plano_url} alt="Plano" onClick={planoClick}
                 style={{cursor:calib&&calibSel?"crosshair":"default"}}/>
            {localesArea.map(l=> (l.plano_x!=null&&l.plano_y!=null) &&
              <Marker key={l.local_id} local={l} dim={calib&&calibSel&&calibSel!==l.local_id}
                      onClick={()=>{ if(!calib){ setSelParte(null); setSel(l); } }}/> )}
            {(calib || planoVer==="todos") && localesArea.flatMap(l=>l.partes.filter(p=>p.plano_x!=null&&p.plano_y!=null).map(p=>(
              <div key={l.local_id+"::"+p.parte_id}
                   className={"pmarker"+(calib&&calibTarget===p.parte_id?" sel":"")+(calib&&calibSel&&calibSel!==l.local_id?" dim":"")}
                   style={{left:p.plano_x+"%",top:p.plano_y+"%",background:colorParte(p),
                           pointerEvents:calib?"none":"auto"}}
                   title={l.numero+" · "+normEtq(p.etiqueta)}
                   onClick={()=>{ if(!calib){ setSelParte(p.parte_id); setSel(l); } }}>{partAbrev(p)}</div>)))}
          </div></div>
          <div className="legend">
            <span className="k"><span className="dot" style={{background:"#16a34a"}}></span>Completo</span>
            <span className="k"><span className="dot" style={{background:"#f59e0b"}}></span>En proceso</span>
            <span className="k"><span className="dot" style={{background:"#dc2626"}}></span>Sin iniciar</span>
            {localesArea.length>0 && sinUbicar.length>0 && <span style={{marginLeft:"auto",color:"#b45309"}}>
              {sinUbicar.length} local(es) sin ubicar{(user.rol==="admin"||user.rol==="editor")?" — usá “⚙ Calibrar”":""}.</span>}
            {localesArea.length===0 && <span style={{marginLeft:"auto",color:"#64748b"}}>
              Este sector todavía no tiene locales cargados.</span>}
          </div>
        </div>
      ) : (
        <div className="planowrap"><div className="noplano">
          <p style={{fontSize:15,fontWeight:600,color:"#334155"}}>Todavía no hay plano para {mNom(modulo)} · {nNom(nivel)}.</p>
          <p>Poné la imagen en la subcarpeta <b>planos</b> y cargá su nombre en la hoja <b>AREAS</b> (columna <code>plano_url</code>).<br/>
          Mientras tanto podés usar la vista <b>Botones</b>.</p>
        </div></div>
      )
    )}

    {mode==="botones" && (
      localesArea.length? (()=>{
        const q=filtro.trim().toLowerCase();
        const lista=q? localesArea.filter(l=>((l.numero||"")+" "+(l.nombre||"")).toLowerCase().includes(q)) : localesArea;
        return (
        <div>
          <div className="buscador">
            <span className="bicon">🔍</span>
            <input placeholder="Buscar local por número o nombre…" value={filtro} onChange={e=>setFiltro(e.target.value)}/>
            {filtro && <button className="bx" onClick={()=>setFiltro("")} title="Limpiar">×</button>}
            <span className="bcount">{lista.length} de {localesArea.length}</span>
          </div>
          {lista.length? (
          <div className="grid">
          {lista.map(l=>{const p=avancePct(l);
            const habil=l.partes.length && l.partes.every(x=>x.habilitado_final==="SI");
            return (
            <div className="card" key={l.local_id} onClick={()=>setSel(l)}>
              <div className="name-lg">{l.nombre}</div>
              <div className="num-sm">Local {l.numero}</div>
              <div className="track"><div className="fill" style={{width:p+"%",background:colorPct(p)}}></div></div>
              <div className="pctlbl"><span>{l.partes.length} partes</span><b style={{color:colorPct(p)}}>{p}%</b></div>
              <span className={"badge "+(habil?"hab":"nohab")}>{habil?"Habilitado":"En obra"}</span>
            </div>
          )})}
          </div>
          ) : <div className="planowrap"><div className="noplano"><p>No hay locales que coincidan con “{filtro}”.</p></div></div>}
        </div>);
      })() : (
        <div className="planowrap"><div className="noplano">
          <p style={{fontSize:15,fontWeight:600,color:"#334155"}}>{mNom(modulo)} · {nNom(nivel)} todavía no tiene locales cargados.</p>
          <p>A medida que sumes sectores, van a aparecer acá como botones.</p>
        </div></div>
      )
    )}

    {sel && <LocalDetail local={data.locales.find(l=>l.local_id===sel.local_id)} data={data} user={user}
                         initialParte={selParte}
                         onClose={()=>{setSel(null);setSelParte(null);}} onSaved={onSaved}/>}
    {pwOpen && <CambiarPwd onClose={()=>setPwOpen(false)}/>}
    {usersOpen && <UsuariosPanel onClose={()=>setUsersOpen(false)}/>}
    {matrizOpen && <MatrizPanel data={data} onClose={()=>setMatrizOpen(false)} onApplied={onMatriz}/>}
    {qrOpen && <QRPanel data={data} modulo={modulo} nivel={nivel} onClose={()=>setQrOpen(false)}/>}
    {filtrosOpen && <FiltrosPanel data={data} modulo={modulo} nivel={nivel} onClose={()=>setFiltrosOpen(false)}
       onAbrirLocal={(lid,pid)=>{const l=data.locales.find(x=>x.local_id===lid); if(l){setModulo(l.modulo);setNivel(l.nivel);setSelParte(pid||null);setSel(l);}}}/>}
    {confirmDel && (
      <div className="overlay" onClick={e=>{if(e.target.className==="overlay")setConfirmDel(null)}}>
        <div className="modal" style={{maxWidth:420,width:"92%"}}>
          <div className="mhead"><div><h2>Quitar local</h2>
            <div style={{fontSize:12,opacity:.85}}>Se va a eliminar <b>{confirmDel.numero} · {confirmDel.nombre}</b> y todos sus elementos ({confirmDel.partes.length}). No se puede deshacer.</div></div></div>
          <div className="mbody" style={{display:"flex",flexDirection:"column",gap:8}}>
            <button className="btn danger" onClick={()=>doBorrarLocal(confirmDel)}>Sí, quitar local</button>
            <button className="btn" onClick={()=>setConfirmDel(null)}>Cancelar</button>
          </div>
        </div>
      </div>
    )}

    <div className="foot">
      Avance de Obra · beta {ONLINE?"· en línea (Supabase)":"· MODO DEMO (datos de ejemplo)"}
    </div>
  </div>
  );
}
function mNom(m){ return "Módulo "+m; }
function nNom(n){ const f=NIVS.find(x=>x[0]===n); return f?f[1]:n; }
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
