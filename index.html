  body{font-family:'AvIconos',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       background:#eef2f7;color:var(--ink);-webkit-text-size-adjust:100%}
  button,select,textarea,input{font-family:inherit}
  button{cursor:pointer}
  .app{max-width:1200px;margin:0 auto;padding:0 14px 60px}
  /* Header */
  header.top{position:sticky;top:0;z-index:30;background:linear-gradient(135deg,#1e3a5f,#2c5282);color:#fff;
    margin:0 -14px 16px;padding:14px 18px;box-shadow:0 2px 14px rgba(15,23,42,.18)}
  .top .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
  .top .sub{font-size:12px;opacity:.8;margin-top:2px}
  .spacer{flex:1}
  .userbox{font-size:12.5px;text-align:right;line-height:1.3}
  .userbox b{display:block;font-size:13px}
  .btn{border:0;border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;background:#fff;color:var(--brand)}
  .btn.ghost{background:rgba(255,255,255,.15);color:#fff}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn:disabled{opacity:.5;cursor:not-allowed}
  /* global progress */
  .globalbar{display:flex;align-items:center;gap:12px;margin:6px 0 0}
  .globalbar .track{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
  .globalbar .fill{height:100%;background:linear-gradient(90deg,#22c55e,#4ade80)}
  /* area selector */
  .areabar{display:flex;gap:18px;flex-wrap:wrap;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:11px 14px;margin-bottom:12px}
  .areagrp{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .areagrp .lbl{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-right:2px}
  .achip{position:relative;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:9px;padding:7px 13px;font-size:13px;font-weight:700}
  .achip.wide{padding:7px 14px}
  .achip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .achip .cbadge{display:inline-block;margin-left:7px;background:#e2e8f0;color:#334155;border-radius:99px;font-size:10.5px;font-weight:800;padding:1px 6px}
  .achip.on .cbadge{background:rgba(255,255,255,.25);color:#fff}
  /* tabs */
  .tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  .tabs button{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:600}
  .tabs button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* Plano */
  .planowrap{position:relative;background:#fff;border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
  .planowrap .inner{position:relative;width:100%}
  .planowrap img{display:block;width:100%;height:auto;user-select:none}
  .noplano{padding:40px 20px;text-align:center;color:var(--muted)}
  /* rev20: cambiar estados desde Filtros */
  .fmasivo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:#eef4fb;border:1px solid #cfe0f5;border-radius:10px;padding:8px 12px;margin:0 0 8px;font-size:13px}
  .fmasivo .fhint{font-size:11.5px;color:var(--muted)}
  .fok{background:#dcfce7;color:#166534;border-radius:9px;padding:9px 12px;font-size:12.5px;font-weight:600;margin-bottom:8px}
  .ftr .estado-sel{flex:0 0 auto}
  .ftr.fpend{background:#fffbeb;border-color:#fcd34d}
  .fantes{font-size:11px;color:#b45309;font-weight:600}
  /* rev20: botones Anterior / Sig. local en la ficha */
  .navloc{display:inline-flex;gap:6px}
  .navloc button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:4px 9px;display:flex;flex-direction:column;align-items:center;line-height:1.1;min-width:44px}
  .navloc button b{font-size:15px}
  .navloc button small{font-size:9.5px;font-weight:700;opacity:.9;white-space:nowrap}
  .navloc button:disabled{opacity:.3;cursor:default}
  @media(max-width:640px){ .navloc button small{display:none} .navloc button{padding:7px 10px} }
  /* rev20: zoom del plano + círculos que se adaptan (--mk = diámetro según el ancho de la pantalla) */
  .planobox{position:relative}
  .zoombox{position:absolute;top:8px;right:8px;z-index:9;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.92);
    padding:4px 6px;border-radius:10px;box-shadow:var(--shadow-sm);font-size:12px;font-weight:700;color:var(--muted)}
  .zoombox .btn{border:1px solid var(--line);min-width:32px;font-size:16px;line-height:1;padding:4px 8px}
  .planowrap.zoomed{overflow:auto;max-height:calc(100vh - 140px);-webkit-overflow-scrolling:touch}
  .planowrap.zoomed .inner{display:block;max-width:none!important}   /* con zoom el plano crece (en pantallas grandes y en 3 columnas tenía tope) */
  .planowrap.zoomed img{width:100%!important;max-width:none!important;max-height:none!important}
  .marker{position:absolute;transform:translate(-50%,-50%);width:var(--mk,34px);height:var(--mk,34px);border-radius:50%;
    border:2.5px solid #fff;box-shadow:0 0 0 2.5px #0f172a, 0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;color:#fff;cursor:pointer;transition:transform .1s;
    white-space:nowrap;overflow:hidden;line-height:1;letter-spacing:-.3px;text-align:center;padding:0}
  .marker:hover{transform:translate(-50%,-50%) scale(1.15);z-index:5}
  .marker.dim{opacity:.35}
  .pmarker{position:absolute;transform:translate(-50%,-50%);min-width:calc(var(--mk,34px) * .65);height:calc(var(--mk,34px) * .65);
    padding:0 calc(var(--mk,34px) * .14);border-radius:99px;
    border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center;
    font-size:calc(var(--mk,34px) * .29);font-weight:800;color:#fff;z-index:4}
  .pmarker.sel{outline:3px solid #2c5282;outline-offset:1px}
  .pmarker.dim{opacity:.3}
  .pmarker{cursor:pointer;transition:transform .1s}
  .pmarker:hover{transform:translate(-50%,-50%) scale(1.18);z-index:6}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin:12px 2px;font-size:12.5px;color:var(--muted)}
  .legend .k{display:inline-flex;align-items:center;gap:6px}
  .dot{width:12px;height:12px;border-radius:50%;display:inline-block}
  /* Grid list */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px;cursor:pointer;border:1px solid #eef2f7;transition:.14s}
  .card:hover{border-color:var(--brand2);transform:translateY(-2px)}
  .card .name-lg{font-size:17px;font-weight:800;color:var(--brand);line-height:1.15}

  .umuted{color:var(--muted);font-size:12px}
  /* rev16: pantalla grande / TV touch — se agranda todo (zoom) y se usa todo el ancho.
     El zoom depende del ancho: 1080p ≈ 1.3x, 2K ≈ 1.7x, 4K sin escalar ≈ 2.4x.
     Las alturas con vh se dividen por el zoom para que los modales y el plano entren en la pantalla. */
  @media(min-width:1500px){
    :root{--z:1}
    .app{zoom:var(--z);max-width:none;padding:0 18px 40px}
    header.top{margin:0 -18px 14px}
    .modal{max-height:calc(92vh / var(--z))}
    .modal.local{max-width:1100px}
    .reptxt{min-height:calc(55vh / var(--z))}
    .fotobig img{max-height:calc(88vh / var(--z))}
    /* el plano se achica para entrar entero en la altura de la pantalla, centrado */
    .planowrap{text-align:center}
    .planowrap .inner{display:inline-block;width:auto;max-width:100%;vertical-align:top}
    .planowrap img{width:auto;max-width:100%;max-height:calc(100vh / var(--z) - 245px)}
    header.top{padding:8px 18px}
    .globalbar{margin-top:2px}
    .verbar{display:none}            /* en TV, "Cómo ver" va arriba de la lista lateral */
    .ver-over{display:flex;flex-direction:column;position:absolute;top:8px;left:8px;z-index:8;gap:6px;background:rgba(255,255,255,.92);
      padding:5px;border-radius:11px;box-shadow:var(--shadow-sm)}
    .ver-over .vchip{font-size:12px;padding:6px 10px}
    .grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
    .planolayout{display:flex;gap:16px;align-items:flex-start}
    .planocol{flex:1 1 auto;min-width:0}
    .planoside{display:flex;flex-direction:column;gap:6px;flex:0 0 300px;max-height:calc(100vh / var(--z) - 250px);overflow:auto;
      background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:10px}
  }
  /* rev18: planos parados (C-1, C-2): en PC no se estiran a todo el ancho; entran en la altura de la pantalla */
  .planowrap.vert{text-align:center}
  .planowrap.vert .inner{display:inline-block;width:auto;max-width:100%;vertical-align:top}
  .planowrap.vert img{width:auto;max-width:100%;max-height:calc(100vh - 140px)}
  .planoside{display:none}
  .ver-over{display:none}   /* rev17: solo en pantalla grande (en PC común/celu está la barra "Cómo ver" arriba del plano) */
  @media(min-width:1500px){ .planoside{display:flex} .ver-over{display:flex}
    .planowrap.vert img{max-height:calc(100vh / var(--z) - 245px)}
    .planowrap.zoomed{max-height:calc(100vh / var(--z) - 245px)} }
  .ps-tit{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);padding:2px 4px 4px;display:flex;justify-content:space-between}
  .ps-item{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 10px;text-align:left;font-size:13px;color:var(--ink)}
  .ps-item:hover{border-color:var(--brand2);background:#f8fafc}
  .ps-dot{width:12px;height:12px;border-radius:50%;flex:0 0 12px}
  .ps-num{font-weight:800;color:var(--brand);min-width:38px}
  .ps-nom{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  /* el agrandado es solo para la tele táctil (se maneja con el dedo); en un monitor con mouse todo queda igual y se ve más */
  @media(min-width:1500px) and (pointer:coarse){ :root{--z:1.3} }
  @media(min-width:2200px) and (pointer:coarse){ :root{--z:1.7} }
  @media(min-width:3000px) and (pointer:coarse){ :root{--z:2.4} }
  /* rev10: celular — la ficha del local (la que abre el QR) ocupa toda la pantalla y se lee cómoda */
  @media(max-width:640px){
    .overlay.ov-local{align-items:stretch}
    .modal.local{max-height:none;height:100vh;height:100dvh;border-radius:0}
    .modal.local .mhead{padding:10px 12px;gap:8px}
    .modal.local .mhead h2{font-size:16px;line-height:1.2}
    .modal.local .mbody{padding:10px 8px 20px}

    .modal.local .tarea-row{gap:6px;min-height:40px}
    .modal.local .tarea-n{font-size:13px}
    .modal.local .estado-sel{min-width:100px;font-size:12px;padding:8px 6px}
    .modal.local .estado-sel.sm{min-width:96px}
    .modal.local .subtareas{margin-left:6px;padding-left:8px}
    .modal.local .sub{min-height:38px}
    .modal.local .sub-n{flex:1 1 120px;font-size:12px}
    .modal.local .parte .ph{padding:12px 10px}
    .modal.local .coment{margin:4px 8px 10px;width:calc(100% - 16px)}
    .modal.local .savebar{padding:10px 10px calc(10px + env(safe-area-inset-bottom));flex-wrap:wrap}
    .modal.local .lp-svgwrap{max-height:240px}
    .nota-inp,.coment,.addtarea input,.addrubro select,.fsel,.buscador input,.ccomp textarea{font-size:16px}  /* evita el zoom automático de iOS */
    .reptxt{white-space:pre-wrap;font-size:12px}
    .top h1{font-size:15px}
    .userbox span{display:none}
  }
  @media print{
    body{background:#fff}
    body *{visibility:hidden}
    .qrsheet,.qrsheet *{visibility:visible}
    .qrsheet{position:absolute;left:0;top:0;width:100%;grid-template-columns:repeat(3,1fr);gap:10px}
    .qr-noprint{display:none!important}
    .overlay{position:static;background:none}
    .modal{box-shadow:none;max-width:none;width:100%}
  }
